title: "From Box to Building: Everything I Figured Out About My 3D Printer (So You Don't Have To)"
author: "Ben"
default_word_target: 1200

parts:
  - title: "Part One: Meet the Machine"
    description: >
      You don't drive a car before you know where the brakes are. This part is the slow walk-around: what 3D
      printing actually is, every part of the Centauri Carbon 2 and what it does, the stuff that's hot enough to
      hurt you, and your very first print — all before we touch a single setting. By the end you'll have made a
      real object and learned the one habit that separates people whose prints work from people who are always
      frustrated.

    sections:
      - title: "What This Thing Actually Is"
        description: >
          Killing the intimidation. A 3D printer isn't magic and isn't a movie replicator — it's a robot stacking
          melted plastic. These chapters give you the mental model and the vocabulary the whole book runs on.

        chapters:
          - title: "It's Just a Robot With a Hot Glue Gun"
            word_target: 1100
            description: >
              Demystify 3D printing before touching the machine. It's not magic and not a sci-fi replicator — it's
              a robot squeezing melted plastic in lines, one thin layer on top of another, until a shape appears.
              This chapter kills the intimidation and sets the "stacking layers" mental model the whole book uses.

            intro: >
              Open with the hot glue gun. "Have you ever used a hot glue gun? You squeeze, hot goopy plastic comes
              out, it cools, it gets hard. Now imagine a robot holding that glue gun, moving it around super
              precisely, drawing the same shape over and over, stacking each drawing on top of the last one.
              That's it. That's the whole secret. The first time someone explained it to me I felt kind of
              cheated — I thought it'd be way more magic than that. It's not magic. It's stacking."

            chapter_sections:
              - heading: "Drawing, Then Stacking"
                description: >
                  The core idea: a 3D print is just a tall stack of flat drawings.
                bullet_points:
                  - "A 3D print is a stack of flat drawings called layers — that's literally all it is"
                  - "Each layer is paper-thin, about 0.2mm, thinner than a stack of three of your hairs"
                  - "The printer can't 'see' your shape — it only follows lines you give it, one layer at a time"
                  - "Here's the truth nobody tells beginners: the printer is dumb. It does exactly what you tell it, even when what you told it is dumb. Most failed prints are the human's fault, not the robot's"

              - heading: "Why Plastic Spaghetti"
                description: >
                  The material shows up as a long string wound on a spool.
                bullet_points:
                  - "The plastic comes as one long string wound on a spool, like fishing line or super-thin spaghetti"
                  - "The printer pulls it in, melts it, and squirts it out a tiny hole at the bottom"
                  - "A whole big print is really just one super-long noodle, melted and re-drawn into a shape"
                  - "That little spool holds about a kilogram of string — enough to stretch the length of a few football fields"

              - heading: "What It's Great At, What It's Bad At"
                description: >
                  Honest expectations so you're not disappointed.
                bullet_points:
                  - "Great at: small, detailed plastic things — toys, models, spare parts, and your dad's buildings"
                  - "Bad at: anything huge, anything in five minutes, anything made of metal or glass"
                  - "A print that fits in your hand can take two to four hours — this is a slow hobby, and that's okay"
                  - "Here's something nobody admits: the people online showing perfect prints deleted the nine that failed. Everybody's printer fails. Mine fails. You're not bad at this — it's just like this"

              - heading: "Try This — Read a Print Like Tree Rings"
                description: >
                  A no-printer warm-up to see layers with your own eyes.
                bullet_points:
                  - "Find something 3D-printed near you — a board-game piece, a phone stand, a fidget toy"
                  - "Look really close and find the layer lines, those tiny ridges stacked up the side"
                  - "Run your fingernail across them — you can actually feel the layers"
                  - "Guess how many layers tall it is: measure the height in millimeters and divide by 0.2. You just read a print like a tree's rings"

            conclusion: >
              A 3D printer isn't a magic box. It's a careful robot stacking thin layers of melted plastic. Once you
              see it that way, the whole thing stops being scary and starts being something you can boss around.

            transition: >
              But before you can boss it around, you have to know its parts — what moves, what gets hot, and what
              that weird four-spool tower on the side is for. Next we're going to walk all the way around the
              machine and name everything, like meeting a new pet and learning where it likes to be scratched
              and where it bites.

          - title: "The Grand Tour — Every Part and What It Does"
            word_target: 1300
            description: >
              A full walk-around of the Elegoo Centauri Carbon 2 Combo, naming the parts the rest of the book keeps
              pointing back to: the box-shaped enclosure, the fast CoreXY arm, the screaming-hot nozzle, the magnet
              build plate, the touchscreen and camera, and the CANVAS four-color tower. The goal is fluency with
              the words so later chapters don't have to keep stopping to explain.

            intro: >
              Open with a named scene. "The day my printer arrived, I just stood there staring into the little
              window like it was a fish tank. I had no idea what anything was called. So let's do the thing I wish
              someone had done with me: a slow lap around the machine, pointing at stuff. Put your finger on the
              glass door. Ready? Let's go around."

            chapter_sections:
              - heading: "The Box and Why It's a Box"
                description: >
                  The enclosure isn't for looks — it has three real jobs.
                bullet_points:
                  - "It's enclosed — walls and a door — on purpose, not to look cool"
                  - "The walls trap heat, which the fancier plastics need so they don't crack while printing"
                  - "The walls also keep little fingers and curious pets away from the hot, fast-moving parts"
                  - "There's a clear window and a built-in camera so you can watch without opening it — and opening the door lets the heat escape, which can wreck a tall print"

              - heading: "The Arm That Moves (CoreXY)"
                description: >
                  How the nozzle zips around so fast.
                bullet_points:
                  - "The nozzle rides on a system called CoreXY — two motors working as a team to whip it left-right and front-back"
                  - "This printer can move up to 500mm per second — about as fast as you can swipe your hand across a table"
                  - "The bed drops down a hair after each layer so the next one stacks neatly on top"
                  - "Fast looks awesome, but fast also shakes the machine. Sometimes slower equals nicer — we'll come back to this"

              - heading: "Where It Melts and Where It Sticks (Nozzle and Bed)"
                description: >
                  The two hot parts — where plastic comes out, and where it lands.
                bullet_points:
                  - "The hot end heats up to as high as 350°C — hot enough to cook an egg in about a second"
                  - "Melted plastic comes out a tiny hole called the nozzle, usually 0.4mm wide, about the thickness of four sheets of paper; it's 'hardened' so tough filaments don't grind it down like sandpaper"
                  - "The print lands on a flat plate that heats to about 110°C, hotter than boiling water, so the first layer sticks"
                  - "The plate pops off with a magnet, so you can bend it like a candy bar to peel your print off — honestly the best feeling in this hobby"
                  - "Two rules live here: never touch the nozzle, since it burns faster than anything, and never pry a print off with a knife — the magnet bend is the only way"

              - heading: "The CANVAS Tower — Your Four Colors"
                description: >
                  The feature that makes the whole color project possible.
                bullet_points:
                  - "That tower holding four spools is the CANVAS system — it lets you print in four colors without swapping anything by hand"
                  - "It reads a tiny chip on Elegoo spools and automatically knows what color and type is loaded"
                  - "It feeds whichever color the print needs right now and parks the other three"
                  - "Here's the honest part: this is the feature that makes Dad's four-color building possible, and also the feature that wastes the most plastic. Both true. More on that later"

            conclusion: >
              You now know the parts: the box, the fast arm, the screaming-hot nozzle, the magnet bed, and the
              four-color tower. Every chapter from here points back to these. You don't have to memorize it — you'll
              learn it by using it.

            transition: >
              There's one thing I kept saying on that tour: do not touch. I wasn't kidding, and it's important
              enough to get its own chapter. Before we turn anything on, let's talk about the parts that can
              actually hurt you — and the two or three rules that mean they never will.

          - title: "The Stuff That Can Hurt You (Read This One)"
            word_target: 1000
            description: >
              The safety chapter, written straight to a kid — no fear-mongering, no fluff. Covers the burn risks
              (nozzle and bed), the fast-moving parts, fumes and why airflow matters, and the short list of rules
              that keep all of it safe. Framed as the rules that let a grown-up say yes to you using this alone.

            intro: >
              Open with a confession and direct address. "Okay, real talk. I burned my finger on the nozzle once.
              Just once. It touches you for less than a second and it already hurts for an hour. I'm not telling
              you that to scare you — I'm telling you so you believe me about the rules, because the rules are
              short, and then you never think about them again."

            chapter_sections:
              - heading: "Hot. Like, Really Hot."
                description: >
                  The two parts that burn, and how to know when it's safe.
                bullet_points:
                  - "The nozzle hits 350°C and the bed hits 110°C — and both stay hot for several minutes after a print ends"
                  - "The metal and glass near them get warm too, so the danger zone is bigger than just the nozzle"
                  - "Rule: never reach toward the nozzle or bed while it's printing or right after it finishes"
                  - "The screen always shows the temperature — when the nozzle reads under about 40°, it's safe to be near"

              - heading: "Moving Parts and Long Hair"
                description: >
                  The arm moves fast and doesn't know your hand is there.
                bullet_points:
                  - "That arm zips around at full speed and has no idea your fingers are anywhere near it"
                  - "Tie back long hair, push up your sleeves, and keep charging cables and pet tails out of the box"
                  - "Rule: door closed while it's running, every single time"
                  - "The closed door isn't just for heat — it's a wall between you and the moving parts"

              - heading: "What You're Breathing"
                description: >
                  Melting plastic puts stuff in the air, and some plastics more than others.
                bullet_points:
                  - "Melting plastic makes a smell and some tiny particles you can't see"
                  - "PLA, the easy starter plastic, is the mildest; tougher plastics like ABS smell stronger and need more air"
                  - "Rule: print in a room with some airflow — a cracked window or a fan, not a sealed closet"
                  - "If a print really stinks, that's the plastic telling you to open a window. Listen to it"

              - heading: "Try This — Make Your Own Rule Card"
                description: >
                  Turn the rules into a habit, and earn the grown-up yes.
                bullet_points:
                  - "Write three rules on an index card and tape it to the printer: door closed, let it cool, airflow on"
                  - "Show it to whoever's letting you use the printer — grown-ups say yes way faster when they see you take it seriously"
                  - "Always check the temperature on the screen before you reach anywhere near the nozzle"
                  - "Congratulations — you're now officially the safest person in the house at this"

            conclusion: >
              Three rules: door closed, let it cool, keep air moving. That's basically the whole safety talk.
              Follow them and this machine is no more dangerous than an oven — which you're also not supposed to
              grab the inside of.

            transition: >
              Rules done. Now the fun starts. Next we actually turn it on, get it set up, feed it its first spool
              of plastic, and — without changing a single setting — make the machine prove it works. Your first
              print is closer than you think.

      - title: "First Contact"
        description: >
          Powering on, setting up, and making your very first object. The machine does the hard parts; your job is
          to watch one specific thing that predicts whether every future print will work.

        chapters:
          - title: "Turning It On Without Breaking Anything"
            word_target: 1200
            description: >
              First-time setup as a calm checklist a kid can follow alone: powering on, the touchscreen basics, the
              automatic leveling (and what "leveling" even means), and loading the first spool into the CANVAS
              system. The whole point is letting the printer's automation handle the scary parts.

            intro: >
              Open with a confession that lowers the stakes. "When I set mine up, I was sure I was going to break
              it in the first ten minutes. I didn't. You won't either, because this printer does the hard parts for
              you — it's honestly easier than setting up a new video game console. Let's go step by step, and I'll
              tell you exactly which scary-looking thing to just ignore."

            chapter_sections:
              - heading: "Power, Screen, and the First Tap"
                description: >
                  Getting to the menu without panic.
                bullet_points:
                  - "Plug it in, flip the switch, and the 5-inch touchscreen wakes up like a phone"
                  - "It works in your language and taps just like a tablet — you already know how to use this"
                  - "For now you only need three buttons: load filament, level, and print"
                  - "Don't panic at all the other menus. Everything else can wait until you actually need it"

              - heading: "What 'Leveling' Means and Why It Matters"
                description: >
                  The single setup step that decides if plastic sticks.
                bullet_points:
                  - "'Leveling' means the printer figuring out exactly how far the nozzle is from the bed, all across the plate"
                  - "Too far and plastic won't stick; too close and it scrapes — leveling finds the just-right gap"
                  - "This printer has 31 little sensors and levels itself with one tap, poking the bed in a grid and taking notes"
                  - "Older printers made you do this by hand with a slip of paper. You were born at the right time — just press the button and watch"

              - heading: "Feeding It Lunch (Loading Filament)"
                description: >
                  Getting the first spool in.
                bullet_points:
                  - "Put a spool of PLA on the CANVAS tower and poke the end of the string into the feed hole until the printer grabs it"
                  - "The printer heats up and pulls it through — you'll see a little plastic ooze out the nozzle, like it's clearing its throat"
                  - "If it reads an Elegoo chip, it fills in all the settings for you automatically"
                  - "That first clean squirt of color is the machine saying 'I'm fed and ready to go'"

              - heading: "Try This — The Full Wake-Up"
                description: >
                  Do the whole setup sequence once, solo.
                bullet_points:
                  - "Power on and run auto-level from start to finish — it takes a few minutes, so let it do its thing"
                  - "Load one spool of PLA and watch for the ooze"
                  - "Watch the nozzle push out a clean line of color"
                  - "You just did every setup step there is. The printer is now ready to actually make something"

            conclusion: >
              Powered on, leveled, fed. That's the entire setup, and the machine did most of it. The intimidating
              part is over and you didn't break anything.

            transition: >
              Your printer is loaded and leveled and basically vibrating with readiness. So let's not make it wait.
              Next chapter, we press the one button that matters most — print — on a model that's already on the
              machine, and you watch your first real object appear out of nothing. And I'll teach you the single
              most important thing to watch for while it goes.

          - title: "Your First Print (and the First Layer Rule)"
            word_target: 1200
            description: >
              The first real print using a model already stored on the printer, so no software needed yet. The
              chapter is really about teaching the reader to watch the first layer — the single best predictor of
              success — to feel the magic that hooks every maker, and to learn to start, pause, and cancel a print.

            intro: >
              Open with a personal memory. "I still remember my first print. A little dumb boat. I sat on the floor
              and watched the whole thing like it was a movie. And here's the secret I didn't know to look for that
              day — the one thing that would've saved me a hundred failed prints later: watch the first layer. The
              first layer tells you everything. Let me show you what I mean."

            chapter_sections:
              - heading: "Press the One Button"
                description: >
                  Starting a built-in print, no computer required.
                bullet_points:
                  - "The printer comes with test models built right in — pick a small one, like a boat or a cube"
                  - "Tap print. No computer needed yet — the file's already on the machine"
                  - "It heats up the nozzle and bed first, which takes a couple of minutes. This is normal, not frozen"
                  - "Then the arm starts moving and the show begins"

              - heading: "The First Layer Is Everything"
                description: >
                  How to read the one layer that predicts the whole print.
                bullet_points:
                  - "The first layer is the foundation, like the bottom row of a Lego baseplate — if it's crooked, nothing on top sits right"
                  - "A good first layer looks like smooth, even lines gently squished together, no gaps"
                  - "A bad one looks stringy, gappy, or like it's not sticking down at all"
                  - "If the first layer looks bad, STOP the print. It will not fix itself. I've watched six-hour prints fail because I 'hoped' a bad first layer would heal. It never does"

              - heading: "Stop, Watch, Wait"
                description: >
                  You're the boss, and patience is a skill.
                bullet_points:
                  - "You can pause or cancel from the screen anytime — you're in charge, not the machine"
                  - "Once the first layer looks good, you can walk away (door closed!)"
                  - "Use the camera to peek from your phone or the screen instead of opening the door"
                  - "Don't open the door to 'check on it' — that lets the heat out and can ruin tall prints near the top"

              - heading: "Try This — Judge Your Own First Layer"
                description: >
                  Build the instinct that makes everything else easier.
                bullet_points:
                  - "Start a built-in print and crouch down to watch JUST the first layer go down"
                  - "Decide out loud: good or bad? Smooth lines mean good; gaps or stringy means bad"
                  - "If it's good, let it finish and pop it off with the magnet bend"
                  - "If it's bad, cancel, re-run auto-level, and try again. Failing here is free practice"

            conclusion: >
              You made a thing — out of string and heat and patience. And you learned the one habit that separates
              people whose prints work from people who are always frustrated: they watch the first layer, and
              they're not afraid to hit cancel.

            transition: >
              Right now you're printing whatever came on the machine. That's like only ever eating the free sample.
              To print what YOU want — toys, models, your dad's buildings — you need to understand the stuff you're
              printing with. Because not all plastic is the same, and picking the wrong kind is how good prints go
              bad. Time to meet the filament family.

  - title: "Part Two: The Stuff You Print With"
    description: >
      Plastic isn't just plastic. There's a whole family of filaments, each melting at a different temperature and
      good at different jobs — and there's a four-color system that turns one boring print into something that
      pops. This part gets you fluent in materials and color before we ever open the software, because the best
      settings in the world can't fix the wrong plastic.

    sections:
      - title: "The Plastic Spaghetti"
        description: >
          Meeting the filaments. PLA first, because it's the friendly one, then the whole family — plus the one
          rule about keeping plastic dry that nobody tells beginners.

        chapters:
          - title: "Meet PLA, Your New Best Friend"
            word_target: 1100
            description: >
              A friendly deep-dive on PLA as the default starter filament and on what filament is in general. Teaches
              why PLA is so forgiving, what it's made of, what its one real limit is (heat), and why every beginner
              should start and stay here for a long time before branching out.

            intro: >
              Open with a story and a regret. "When I started, I wanted to print the fancy strong stuff right away.
              Big mistake. An older kid at my school who'd been doing this for years told me, 'Just print PLA for
              like three months. Trust me.' I didn't trust him. I should have. Let me save you the three months of
              frustration I earned the hard way."

            chapter_sections:
              - heading: "What PLA Actually Is"
                description: >
                  The friendly plastic, and where it comes from.
                bullet_points:
                  - "PLA is the most popular 3D printing plastic by a mile"
                  - "It's made mostly from corn starch, of all things — basically melted-down plant sugar"
                  - "It melts at a low-ish temperature, around 200°C, which makes it easy and forgiving"
                  - "It comes in every color you can imagine, including glow-in-the-dark and sparkly"

              - heading: "Why Beginners Should Start Here (and Stay)"
                description: >
                  Forgiveness is the whole point.
                bullet_points:
                  - "PLA sticks well, barely warps, and hardly smells"
                  - "It forgives your mistakes — wrong setting? It usually still kind of works"
                  - "The harder plastics punish every tiny error you make"
                  - "Anyone who tells an 11-year-old to start with ABS is going to make you want to quit. Start with PLA. There's zero shame in printing PLA forever — tons of grown-up pros do"

              - heading: "PLA's One Real Weakness"
                description: >
                  It hates heat, and that's fine.
                bullet_points:
                  - "Leave a PLA print in a hot car and it can droop like a melting candle"
                  - "So it's perfect for toys, models, and your dad's buildings, but bad for stuff that lives outside in summer"
                  - "That's not a flaw — it's just knowing the right tool for the job"
                  - "For everything we're doing in this book, PLA is exactly right"

              - heading: "Try This — The Sun Test"
                description: >
                  Feel the limit with your own hands.
                bullet_points:
                  - "Print a small simple PLA shape, like a cube or a ring"
                  - "Leave it on a sunny windowsill or a car dashboard for an afternoon (with a grown-up's okay)"
                  - "Check if it's gone soft or bent out of shape"
                  - "You just felt PLA's limit yourself — now you'll never be surprised by it"

            conclusion: >
              PLA is cheap, easy, forgiving, and comes from corn. It's the right plastic to learn on and the right
              plastic for almost everything you'll want to make. Start here. Stay a while.

            transition: >
              But PLA isn't the only plastic on the shelf, and someday you'll want something tougher or bendier. You
              don't need the others yet — but you should know they exist and what they're for, so when someone hands
              you a weird spool you know whether to be excited or careful. Let's meet PLA's whole family.

          - title: "The Whole Filament Family (and When to Cheat on PLA)"
            word_target: 1300
            description: >
              A field guide to the main filaments the Centauri Carbon 2 can run — PLA, PETG, ABS, TPU, and the
              carbon-fiber "CF" filaments — with kid-clear descriptions of what each is for, plus the crucial,
              rarely-taught lesson about keeping filament dry.

            intro: >
              Open with a candy analogy and a list of three. "Think of filaments like candy that melts at different
              temperatures. Chocolate melts in your hand. A jawbreaker basically never melts. Filaments are the
              same — each one needs a different amount of heat and acts differently. Here are the ones you'll
              actually meet, ranked from 'baby's first plastic' to 'ask a grown-up first.'"

            chapter_sections:
              - heading: "The Big Four You'll Actually Use"
                description: >
                  The common types and what each is for.
                bullet_points:
                  - "PLA — easy, stiff, your default (we just covered it)"
                  - "PETG — a little tougher and more bendy, good for things that take a beating, but stringier and fussier to print"
                  - "ABS — strong and heat-proof, the stuff Lego is made of, but it smells and warps easily and needs the door shut tight"
                  - "TPU — soft and rubbery, like a phone case or a flexible bracelet (it needs a special adapter on this printer)"
                  - "Here's the honest split: you'll print PLA about ninety percent of the time. The other three are for specific jobs, not for showing off"

              - heading: "The Fancy 'CF' Stuff"
                description: >
                  Carbon fiber, and why you don't need it yet.
                bullet_points:
                  - "Some spools say 'CF,' which means tiny carbon fibers are mixed in to make parts extra stiff and strong"
                  - "Those fibers are like sand in the plastic — they'd chew up a soft nozzle, which is why this printer has a hardened one"
                  - "It's cool, but it's total overkill for toys and models"
                  - "You do not need it for buildings. Save it for the day you're making something that really has to be strong"

              - heading: "The Thing Nobody Tells Beginners: Dry Your Plastic"
                description: >
                  The secret fix for a ton of mystery problems.
                bullet_points:
                  - "Filament soaks up water from the air like a sponge, even just sitting out on a shelf"
                  - "Wet filament prints terribly — it crackles and pops like bacon in a pan and comes out rough and weak"
                  - "That's why spools arrive in sealed bags with a little 'do not eat' packet inside"
                  - "If your prints suddenly get bad and you didn't change anything, your filament probably got damp. Keep spools in a sealed box or bag. This one secret fixes a LOT of mystery problems"

              - heading: "Try This — Match the Plastic to the Job"
                description: >
                  Build the judgment of someone who picks materials on purpose.
                bullet_points:
                  - "For each of these, guess the best plastic: a toy figure, a flexible watch band, a bracket for a hot car, a water-bottle holder"
                  - "Check yourself: figure is PLA, watch band is TPU, hot-car bracket is ABS, bottle holder is PETG"
                  - "Notice you reasoned it out from how each plastic behaves, not by memorizing"
                  - "You're now thinking like someone who chooses materials on purpose, not by accident"

            conclusion: >
              Four main plastics, one fancy add-on, and one golden rule: keep it dry. You'll live in PLA-land for a
              long time, and that's exactly right. The others are waiting for the day you have a job that needs them.

            transition: >
              You know the plastic. Now for the part that makes prints actually exciting: color. Not just one color —
              four at once. That four-spool tower we met on the tour is about to become your favorite feature, and
              it works in a way that's clever, a little gross, and absolutely worth understanding before you use it.

      - title: "Color, the Fun Part"
        description: >
          How the printer juggles four colors from one nozzle, what that magic trick costs, and how to choose your
          four colors like a designer instead of dumping them out at random.

        chapters:
          - title: "How the Printer Juggles Four Colors"
            word_target: 1200
            description: >
              Explains the CANVAS multi-color system: how a single nozzle prints four colors by swapping filament
              mid-print, what the RFID auto-detection does, and — most importantly — the slightly gross truth that
              every color change purges wasted plastic. Sets realistic expectations for time and waste before the
              reader gets too excited.

            intro: >
              Open with a confession and a 'this is real' beat. "The first time I watched my printer change colors,
              I thought it was broken. It pulled one color out, shoved another in, and then pooped out a little
              rainbow blob of mixed plastic onto the side. I was like — is it sick? No. That's just how it works.
              Yes, this is real. No, I'm not making it up. Let me explain the weirdest, cleverest part of this
              machine."

            chapter_sections:
              - heading: "One Nozzle, Four Colors, One at a Time"
                description: >
                  Why 'multi-color' really means 'fast color-swapping.'
                bullet_points:
                  - "There's only ONE nozzle — it can't do four colors at the same instant"
                  - "Instead it prints all the red parts of a layer, switches, prints the blue, then switches again"
                  - "The CANVAS tower holds four spools and feeds whichever one the print asks for next"
                  - "So 'multi-color' really means 'fast color-swapping,' over and over, sometimes hundreds of times in one print"

              - heading: "How It Knows What's Loaded (RFID)"
                description: >
                  The tap-to-pay chip that keeps colors straight.
                bullet_points:
                  - "Elegoo spools have a tiny chip the printer reads, like a contactless tap-to-pay card"
                  - "It tells the printer the color and type automatically, so the picture on the screen matches reality"
                  - "It can even auto-refill from a backup spool if one runs out in the middle of a print"
                  - "This is great until you use a no-chip spool — then YOU have to tell it what's loaded, and if you tell it wrong, your print comes out the wrong colors. Garbage in, garbage out"

              - heading: "The Gross Secret: Every Swap Wastes Plastic"
                description: >
                  Where the rainbow blobs come from.
                bullet_points:
                  - "When it switches from red to blue, the nozzle is still full of red — so it squirts out the leftover red until pure blue comes through"
                  - "That squirted-out plastic is the little blobs makers literally call 'poop'"
                  - "A busy four-color print can waste almost as much plastic on swaps as the actual model uses"
                  - "This is the real cost of multi-color: not money so much as time and waste. We'll spend a whole chapter on tricks to waste less. For now, the rainbow blobs are normal"

              - heading: "Try This — Count the Swaps"
                description: >
                  See the tradeoff before you fall in love with it.
                bullet_points:
                  - "Next time you see a multi-color print going, watch for one color change and find the little purge blob"
                  - "Now imagine a print that changes color 300 times — that's 300 blobs"
                  - "Ask yourself: did that design really need four colors everywhere, or just in a few spots?"
                  - "You're learning to think about cost, which is exactly what separates pros from button-mashers"

            conclusion: >
              Four colors from one nozzle is a clever magic trick: print, swap, purge, repeat. It's awesome and it's
              wasteful, both at once. Knowing that now means you'll design smarter later instead of being shocked by
              a pile of wasted plastic.

            transition: >
              Now that you know how the four-color system works — and what it costs — let's actually load it up and
              think like a designer about which four colors to choose. Because with only four slots, picking your
              colors is a real decision, and a good choice makes a model look incredible while a lazy one wastes the
              whole feature.

          - title: "Loading Four Colors and Choosing Them Like a Designer"
            word_target: 1100
            description: >
              The practical how-to of loading the four CANVAS slots, plus the design thinking behind choosing a
              four-color palette. Teaches the four-slot limit as a creative tool and introduces the idea that color
              choices should map to the parts of a model — a direct setup for coloring the building later.

            intro: >
              Open with a fun problem and a flop. "Here's a fun problem: you have four slots and the world has a
              million colors. When I first loaded mine, I just grabbed my four favorite colors at random. The print
              looked like a clown exploded. Choosing colors is actually a little puzzle, and once I figured out the
              trick, my prints went from 'eh' to 'whoa, did you buy that?'"

            chapter_sections:
              - heading: "Loading the Four Slots"
                description: >
                  The mechanics, and the one thing that trips everyone up.
                bullet_points:
                  - "Load each spool onto the tower and feed it like you did the first one — the printer takes them one at a time"
                  - "The screen shows four color boxes — slot 1, 2, 3, 4 — matching what's loaded"
                  - "Keep the types matchable: don't mix PLA and ABS in one print, because they melt at very different temperatures and the print will fail"
                  - "Remember which color is in which slot — slot 1 is white, slot 2 is red, and so on. The software cares about slot numbers, not color names, and this trips up everyone at first"

              - heading: "Four Slots Is a Gift, Not a Limit"
                description: >
                  The constraint is what makes it look designed.
                bullet_points:
                  - "Only four colors forces you to choose what matters — and that's a good thing"
                  - "Most amazing models use three or four colors, not twenty"
                  - "Pick colors that contrast so the details pop — dark next to light"
                  - "A classic pro move: one main color, one for accents, one for the base, one for a fun pop"

              - heading: "Match Colors to Parts"
                description: >
                  Plan the color map before you touch the software.
                bullet_points:
                  - "Before printing, decide which color goes where, like a coloring-book plan"
                  - "For a building: maybe gray walls, blue windows, green ground, red roof"
                  - "For a toy: skin, clothes, eyes, hair"
                  - "Decide your color map BEFORE you open the software. Coloring is way easier when you already know the plan. Winging it is how you waste an afternoon"

              - heading: "Try This — Plan a Four-Color Model"
                description: >
                  Do the exact planning step every multi-color print needs.
                bullet_points:
                  - "Pick any object in your room — a sneaker, a game controller, a Lego box"
                  - "If you could only use four colors to print it, which four would you choose?"
                  - "Write down what each color is for"
                  - "You just did the same planning you'll use on every multi-color print, including Dad's building"

            conclusion: >
              Four colors isn't a limit holding you back — it's a puzzle that makes you choose what matters. Plan
              your colors before you print, map each one to a part, and pick contrast. That habit alone will make
              your prints look designed instead of dumped-out.

            transition: >
              You've got the machine, the plastic, and the colors. But so far you've only printed what was already
              on the printer. To print anything you want, you need the piece of software that turns a 3D model into
              instructions the printer can follow. It's called a slicer — and it's where you go from "pressing a
              button" to actually being in charge.

  - title: "Part Three: OrcaSlicer — Talking to the Printer"
    description: >
      A 3D printer can't read a model. It only understands simple instructions: move here, squirt this much, go up
      a layer. The program that translates between the two is called a slicer, and OrcaSlicer is the one we use.
      This part takes you from "what even is this" to confidently turning any model into a print you carry over on
      an SD card — including the handful of settings that actually matter out of the hundreds that don't.

    sections:
      - title: "The Translator"
        description: >
          What a slicer is, why we run the printer offline with an SD card, and the four moves you'll do to
          literally every model you ever print.

        chapters:
          - title: "What a Slicer Is (and Why We Use a Card, Not Wi-Fi)"
            word_target: 1200
            description: >
              Introduces the slicer as a translator and explains the core workflow, including the deliberate choice
              to run the printer offline — slicing on a computer and carrying the file over by SD card instead of
              connecting to the internet. Frames the why behind the offline workflow in kid terms.

            intro: >
              Open with a GPS analogy. "Imagine you tell your mom 'let's go to Grandma's.' She knows where that is.
              But a car's GPS can't use 'Grandma's' — it needs turn-by-turn: left here, right there, go straight two
              miles. A slicer is the thing that turns 'print this cool model' into turn-by-turn directions a dumb
              printer can follow. Without it, the printer has no idea what you want."

            chapter_sections:
              - heading: "The Printer Only Speaks Baby Talk"
                description: >
                  Why a slicer has to exist at all.
                bullet_points:
                  - "A 3D model is a fancy shape file the printer can't understand on its own"
                  - "The printer only knows simple commands: move here, push out this much plastic, raise up"
                  - "The slicer chops your model into hundreds of flat layers and writes the directions for each one — that's why it's called a slicer"
                  - "The directions it writes out are saved in a file called G-code"

              - heading: "OrcaSlicer, Your Control Room"
                description: >
                  The tool we drive, and its twin.
                bullet_points:
                  - "OrcaSlicer is a free program where you load a model, set it up, and slice it"
                  - "Your printer comes with a twin program called ElegooSlicer — same buttons, same idea, so anything here works on both"
                  - "You tell it which printer you have, the Centauri Carbon 2, so it knows your bed size and limits"
                  - "This is where you're actually in charge, not just pressing a green button"

              - heading: "Why We Carry a Card Instead of Going Online"
                description: >
                  The offline workflow, and why it's a choice, not a limitation.
                bullet_points:
                  - "You can connect printers to wifi, but we're doing it the offline way — slice on the computer, save to an SD card, walk it over"
                  - "It's like packing a lunch and carrying it over instead of ordering delivery — a few seconds slower, but totally in your control"
                  - "Nothing online can poke at your printer, and it works even when the internet's down"
                  - "Offline feels old-fashioned, but pros do it on purpose: fewer things to break, nothing spying, no surprise updates mid-print. Slower-but-solid beats fast-but-flaky"

              - heading: "Try This — Find the Three Tabs"
                description: >
                  Get un-lost in the software, which is step one.
                bullet_points:
                  - "Open OrcaSlicer and find the spot where you pick your printer"
                  - "Find the Prepare tab, where you set up the model"
                  - "Find the Preview tab, where you see the sliced result"
                  - "Don't change anything yet — just find them. Getting un-lost is the whole goal today"

            conclusion: >
              A slicer is a translator that turns your model into baby-talk directions the printer can follow, saved
              onto a card you carry over yourself. That's the whole workflow. Everything else is just details inside
              it.

            transition: >
              Now that you know what OrcaSlicer is for, let's actually drive it. Next we load a model and learn the
              four moves you'll do to every single print — placing it, sizing it, spinning it, and standing it up
              the smart way. These four moves are the steering wheel of this whole hobby.

          - title: "The Four Moves: Place, Size, Spin, Stand"
            word_target: 1200
            description: >
              A hands-on tour of OrcaSlicer's basic model controls: importing a file, then the move, scale, and
              rotate tools, plus the critical idea of orientation — how the way a model sits on the plate changes
              everything about how well it prints. The foundational mechanical skills for every print.

            intro: >
              Open with a freeze-up and a reassurance. "When I opened the slicer the first time, there were about a
              thousand buttons and I froze. Here's what nobody told me: you only need four of them to start. Four.
              I'm going to show you those four, and you can ignore the other 996 until you need them — which,
              honestly, might be never."

            chapter_sections:
              - heading: "Getting a Model In"
                description: >
                  Importing, and where to find models.
                bullet_points:
                  - "Drag a model file onto the plate, or use Open — it drops onto the picture of your printer's bed"
                  - "That bed picture is exactly your real bed size: 256mm each way, about the length of a school ruler and a bit"
                  - "If a model lands halfway off the plate, it's either too big or just needs moving — both fixable"
                  - "Free models live on sites like Printables and Thingiverse, downloaded as STL or 3MF files"

              - heading: "Move and Scale"
                description: >
                  Position and size.
                bullet_points:
                  - "Move slides the model around the plate — keep it roughly centered for the best first layer"
                  - "Scale makes it bigger or smaller, by a percentage or an exact size"
                  - "Watch the size numbers — a model can import way too big or comically tiny depending on how it was made"
                  - "If a download is mysteriously the size of a grain of rice or a refrigerator, it's not broken — the maker used different units. Just scale it to what you want and move on"

              - heading: "Spin and Stand (Orientation Is Secret Power)"
                description: >
                  Rotate, and why it quietly matters most.
                bullet_points:
                  - "Rotate spins the model in any direction"
                  - "How a model sits changes EVERYTHING — strength, smoothness, and how much support junk it needs"
                  - "Flat-and-wide prints easier than tall-and-tippy; a figure lying down can print cleaner than one standing up"
                  - "The single biggest free upgrade to a print is just turning it a smarter way before you slice. It costs nothing, and beginners never think to try it"

              - heading: "Try This — Spin the Same Model Three Ways"
                description: >
                  Discover orientation the way it takes most people months to learn.
                bullet_points:
                  - "Load any model and place it flat, then on its side, then standing tall"
                  - "Each time, notice how much of it would hang in mid-air (those parts need support)"
                  - "Pick the orientation with the least stuff hanging — that's usually your best print"
                  - "You just learned a trick most people stumble onto only after months"

            conclusion: >
              Place it, size it, spin it, stand it smart. Four moves, every print, forever. And the sneakiest one —
              orientation — is the free trick that makes prints better without changing a single setting.

            transition: >
              Speaking of settings — it's time. There really are hundreds of them in OrcaSlicer, and the truth is
              you'll only ever touch a handful. Next we cut through all of it and learn the few settings that
              actually change how your print turns out, starting with the one that controls the tug-of-war between
              speed and quality.

      - title: "The Settings That Matter"
        description: >
          The handful of settings that actually change your print — layers, walls, the hollow secret of infill, and
          supports — plus the final step of previewing and sending the job to the printer.

        chapters:
          - title: "Layers, Walls, and the Speed-vs-Nice Tug-of-War"
            word_target: 1300
            description: >
              Demystifies the quality settings that matter most — layer height and wall count — and frames the
              universal tradeoff of 3D printing: faster and rougher versus slower and smoother. Gives the reader
              real default numbers and the judgment to choose between them.

            intro: >
              Open with a life-truth and a flop. "Here's a thing that's true about almost everything in life, and
              definitely true in 3D printing: you can have it fast, or you can have it nice, but you usually can't
              have both at once. I learned this when I tried to print a birthday present the night before and
              cranked the speed way up. It printed fast. It also looked like it was made of melted crayons. Let me
              show you the two knobs that control this."

            chapter_sections:
              - heading: "Layer Height — How Thin You Slice"
                description: >
                  The main quality knob.
                bullet_points:
                  - "Remember prints are stacked layers — layer height is how thick each one is"
                  - "Thinner layers, like 0.12mm, mean smoother and slower; thicker, like 0.28mm, mean rougher and faster"
                  - "0.2mm is the everyday sweet spot — start there for basically everything"
                  - "Thin layers look amazing but take forever — a print can take twice as long for a smoothness you can barely see across a room. Don't go thin unless the model really shows it"

              - heading: "Walls — How Thick the Skin Is"
                description: >
                  Wall count, and why it matters extra for display models.
                bullet_points:
                  - "The outside shell is made of 'walls' — loops of plastic around the edge"
                  - "More walls means stronger and heavier and slower"
                  - "Two or three walls is plenty for most things"
                  - "For models you just look at, like a building, the walls are also what you SEE — so a clean wall setting matters more than whatever's hidden inside"

              - heading: "The Tug-of-War"
                description: >
                  The tradeoff mindset that is the whole skill.
                bullet_points:
                  - "Every setting pulls between fast/rough/cheap and slow/smooth/strong"
                  - "There's no 'best' — only best for THIS print"
                  - "A quick test piece? Go fast and rough. A gift? Go slow and smooth"
                  - "The pros aren't using secret magic settings. They're just choosing the right tradeoff for the job. That's the whole skill, and you already understand it now"

              - heading: "Try This — Print the Same Thing Twice"
                description: >
                  Feel the tradeoff in your hands.
                bullet_points:
                  - "Print a small model at 0.28mm (fast) and again at 0.12mm (smooth)"
                  - "Time both prints and look at both up close"
                  - "Decide: was the extra time worth the smoothness for THIS object?"
                  - "Now you'll never blindly pick a setting again — you'll choose on purpose"

            conclusion: >
              Two knobs do most of the quality work: how thin you slice and how thick the skin is. And the big idea
              behind them — fast-or-nice, pick one — is the most useful thing in the whole hobby. There's no perfect
              setting, only the right tradeoff.

            transition: >
              But what about the inside of a print? When you print a solid-looking cube, is it really solid plastic
              all the way through? Nope — and the setting that controls that is the single most important trick for
              printing big things like buildings without using a mountain of plastic or waiting three days. It's
              called infill, and it's the hollow secret.

          - title: "The Hollow Secret (Infill)"
            word_target: 1300
            description: >
              The crucial chapter on infill — teaching that prints are mostly empty inside by design, controlled by
              an infill percentage, and that this is the key to printing large models like the building quickly and
              cheaply. Directly serves the "mostly hollow" requirement, reframed for a kid as "you don't carve it
              out, you just leave it empty."

            intro: >
              Open with the hollow chocolate bunny. "Have you ever bitten into a chocolate Easter bunny expecting
              solid chocolate — and it was hollow? Felt like a rip-off, right? Well, in 3D printing, hollow is the
              secret to winning. Almost every print you've ever held was mostly empty inside, and you never knew.
              Let me show you the setting that does it, because it's about to make printing big things actually
              possible."

            chapter_sections:
              - heading: "Prints Are Mostly Empty (On Purpose)"
                description: >
                  The big reveal.
                bullet_points:
                  - "A 'solid' print is usually only 10 to 15 percent plastic inside, and the rest is air"
                  - "The inside is filled with a repeating pattern — honeycomb, squares, or a wavy one called gyroid"
                  - "You never see it because the outside walls and top hide it, like the chocolate shell on a hollow bunny"
                  - "This saves plastic, time, and weight without making the print feel flimsy"

              - heading: "The Infill Knob"
                description: >
                  The setting and how to use it.
                bullet_points:
                  - "'Infill' is the percent-full setting — 0 percent is totally hollow, 100 percent is solid plastic"
                  - "10 to 15 percent is the everyday default and feels surprisingly sturdy"
                  - "Only crank it high for parts that must be strong, like a hook holding weight"
                  - "Going from 15 percent to 100 percent can triple your print time and plastic for strength you don't even need. Beginners crank it up 'to be safe' and just waste hours. Leave it low"

              - heading: "Why This Is the Building's Best Friend"
                description: >
                  Connecting infill straight to the mission.
                bullet_points:
                  - "A model of a building is big — printing it solid would take forever and weigh a ton"
                  - "You don't need it strong, you just need it to look right"
                  - "So we set infill low, around 10 percent — that's what 'mostly hollow' means: not carving anything out, just telling the printer to leave the middle mostly empty"
                  - "You don't hollow a print by hand. You just turn down a number, and the printer does the rest. That's the trick that makes Dad's building print in hours, not days"

              - heading: "Try This — The Weight Test"
                description: >
                  Feel why nobody prints solid.
                bullet_points:
                  - "Print the same small cube at 10 percent infill and at 100 percent infill"
                  - "Hold one in each hand — feel how much lighter the hollow one is"
                  - "Gently try to squeeze each — the 10 percent one is still way tougher than you'd guess"
                  - "Now you GET why nobody prints solid unless they absolutely have to"

            conclusion: >
              Here's the secret pros take for granted: prints are mostly air, and that's the smart way. Infill lets
              you choose how full, and low is almost always right. For big display models like buildings, low infill
              is what turns "impossible" into "done by morning."

            transition: >
              There's one more settings problem to solve before you're dangerous. Some shapes can't print straight
              up — parts that stick out into mid-air would just fall, because the printer can't squirt plastic onto
              nothing. The fix is supports, and they come with their own little tricks and annoyances. Let's tackle
              the last big setting.

          - title: "Holding Up the Sky (Supports and Sticking Down)"
            word_target: 1300
            description: >
              Covers supports (for overhangs) and bed adhesion (brims), the two settings that solve most "why did my
              print fail or fall over" problems. Teaches the physical reason prints need support, the 45-degree
              rule of thumb, and the tradeoff that supports leave marks and waste plastic.

            intro: >
              Open with construction scaffolding. "You know how when a building is going up, there's all that metal
              scaffolding around it, and then once it's done they take it all away? 3D prints need that too. The
              printer can't squirt melted plastic onto thin air — it'd just drip and fall. So for parts that hang
              out over nothing, we build temporary scaffolding called supports. And just like real scaffolding, the
              fun part is ripping it off at the end."

            chapter_sections:
              - heading: "Why Stuff Falls (the Overhang Problem)"
                description: >
                  The physics, in plain terms.
                bullet_points:
                  - "Each layer needs something underneath to land on — plastic squirted onto air just droops and falls"
                  - "A part that sticks out sideways with nothing below it is called an overhang"
                  - "Good rule of thumb: anything leaning more than about 45 degrees probably needs help"
                  - "This is why orientation matters so much — spinning a model can erase overhangs for free, no supports needed"

              - heading: "Supports — Temporary Scaffolding"
                description: >
                  The fix and its catch.
                bullet_points:
                  - "Turn on supports and the slicer builds breakaway scaffolding under the droopy parts"
                  - "You snap it off after printing — it's designed to break away cleanly"
                  - "Supports always leave little scars where they touched. There's no perfect support"
                  - "So the smart move is to NEED as few as possible: orient the model cleverly first, then support only what's left"

              - heading: "Making the First Layer Stick (Brims)"
                description: >
                  Cheap insurance against tippy prints.
                bullet_points:
                  - "Tall or tippy prints can pop off the bed mid-print, which is a disaster"
                  - "A 'brim' is a thin flat lip printed around the base, like a wide foot, to hold it down"
                  - "You peel the brim off after the print finishes"
                  - "Most flat-bottomed prints don't need one, but for tall or skinny-footed models it's cheap insurance"

              - heading: "Try This — Rescue an Overhang"
                description: >
                  Solve the number-one reason beginner prints fail.
                bullet_points:
                  - "Find or make a model with an arm or ledge that sticks out"
                  - "Slice it once with supports off and watch the Preview — see the droopy part?"
                  - "Slice it again with supports on, then print it and snap the scaffolding off"
                  - "You just solved the most common reason beginner prints fail"

            conclusion: >
              Supports hold up the parts that would otherwise fall, and brims keep tippy prints stuck down. Both are
              temporary, both leave a mark, and both get smaller the smarter you orient your model first.
              Scaffolding, then snap it off — just like a real building.

            transition: >
              You now understand every setting that matters: layers, walls, infill, supports, sticking down. There's
              one last step before a print is real — checking the slicer's preview to catch problems before you
              waste hours, and getting the finished file onto that SD card and over to the printer. Let's close the
              loop.

          - title: "Look Before You Leap (Preview and Sending the Job)"
            word_target: 1100
            description: >
              Teaches the Preview tab as the final safety check that catches problems before you commit hours to a
              print, then the practical step of slicing and getting the G-code onto an SD card and into the offline
              printer. Closes the basic single-color workflow loop.

            intro: >
              Open with an overnight disaster. "I once let a seven-hour print run overnight without checking the
              preview. In the morning I had a beautiful, perfect... half a model, because part of it had been
              floating in mid-air the whole time and I never looked. The preview would've shown me in five seconds.
              Now I check every single time, and you should too. It's the cheapest insurance in this hobby."

            chapter_sections:
              - heading: "The Preview Tab Is a Time Machine"
                description: >
                  Catch problems before they cost you hours.
                bullet_points:
                  - "After you slice, the Preview tab shows exactly what the printer will do, layer by layer"
                  - "Drag the slider to scrub up through the layers, like scrubbing a YouTube video"
                  - "Look for floating bits, gaps, or missing supports BEFORE you waste hours of printing"
                  - "Five seconds of scrubbing the preview saves five hours of wasted plastic. The people who 'never have failures' just actually look at the preview"

              - heading: "How Long and How Much"
                description: >
                  Read the estimate and change your mind cheaply.
                bullet_points:
                  - "The slicer estimates print time and plastic used — check both before you commit"
                  - "If a 'quick' print says 14 hours, something's off — probably too big, too thin, or too much infill"
                  - "This is your chance to change your mind for free"
                  - "Tweak a setting, re-slice, check again — redoing it here costs nothing"

              - heading: "Onto the Card and Over to the Printer"
                description: >
                  The offline handoff.
                bullet_points:
                  - "When it looks right, save the sliced file to the SD card"
                  - "Pop the card out, walk it to the printer, and slide it in"
                  - "On the touchscreen, find the file and press print — same as the built-in models, but now it's YOURS"
                  - "That little card is the bridge between the computer and the offline printer"

              - heading: "Try This — The Full Loop, Solo"
                description: >
                  Do the entire single-color workflow by yourself.
                bullet_points:
                  - "Pick a small model, do the four moves, set layer height and infill, and slice"
                  - "Scrub the preview and check the time and plastic estimates"
                  - "Save to the card, carry it over, print it, and watch that first layer"
                  - "You just did the entire single-color workflow by yourself, start to finish. You're officially driving"

            conclusion: >
              Slice, then look before you leap — the preview catches mistakes for free. Then it's just a card and a
              short walk to the printer. You've now closed the whole loop, from a model on the screen to a thing in
              your hand, all on your own.

            transition: >
              Everything so far has been one color at a time. But you've got that four-color CANVAS tower sitting
              right there, and a plan to print Dad's building in four colors. Time to level up. Next we open the
              tool that lets you paint a model right on the screen — and it's exactly as fun as it sounds.

  - title: "Part Four: Multi-Color Like a Pro"
    description: >
      One color is great. Four colors is where people stop and say "wait, you made that?" This part teaches you to
      paint a model right on the screen, to color smartly so a building's floors and features pop, and to wrestle
      with the one real downside — the wasted plastic and time every color change costs. By the end you'll do a
      full four-color print, your dress rehearsal before the main event.

    sections:
      - title: "Painting in 3D"
        description: >
          Using OrcaSlicer's paint tools to color a model, then coloring smart — by part, by floor, and by a plan
          that keeps the print efficient.

        chapters:
          - title: "Painting Right on the Model"
            word_target: 1200
            description: >
              Hands-on with OrcaSlicer's color painting tool — the N shortcut, the painting brushes (fill, circle,
              triangle, height range), and assigning your four loaded colors to areas of a model. This is the core
              multi-color skill the rest of the part builds on.

            intro: >
              Open with a laugh-out-loud first reaction. "The first time I used the paint tool, I genuinely laughed
              out loud. You literally pick a color and paint your 3D model on the screen with your mouse, like a
              coloring book that's somehow 3D. It felt like cheating. It's not cheating — it's just way more fun
              than it has any right to be. Let me show you the brushes."

            chapter_sections:
              - heading: "Turning On Paint Mode"
                description: >
                  Getting into the tool.
                bullet_points:
                  - "Make sure all four colors are loaded in the slicer's color boxes first — paint mode hides itself if you only have one color"
                  - "Select your model and press N (or click the color-painting tool) to enter paint mode"
                  - "Your four colors show up as numbered boxes — pick one and start painting"
                  - "Press the number keys 1 through 4 to switch colors fast"

              - heading: "The Brushes"
                description: >
                  The different painting tools and when to use each.
                bullet_points:
                  - "Fill — click and a whole connected area floods with color, the fastest way to do big sections"
                  - "Circle and Sphere — a round brush for painting freely, sized with the scroll wheel"
                  - "Triangle — clicks one tiny face at a time, for precision"
                  - "Height Range — colors everything between two heights at once (remember this one, it's magic for buildings)"
                  - "The Fill tool has an 'edge detection' option that stops the color at corners — turn it on for clean sections, off when you want to flood across a smooth surface. Knowing this saves so much fiddling"

              - heading: "Painting Cleanly"
                description: >
                  Avoiding the mess that trips up beginners.
                bullet_points:
                  - "Spin the model and check every angle — paint can leave stray spots you missed on the back"
                  - "Zoom in on the edges where two colors meet"
                  - "If you mess up, just paint over it with the right color — it's all changeable until you slice"
                  - "Take your time here. It's the fun part, not a chore"

              - heading: "Try This — Color a Simple Model Four Ways"
                description: >
                  Practice all the brushes on something easy.
                bullet_points:
                  - "Load a simple shape — a cube, a little house, a robot"
                  - "Use Fill on the big parts, the Circle brush for a small detail, and try Height Range once"
                  - "Spin it all the way around and clean up any missed spots"
                  - "You just learned the tool that turns boring gray prints into things people can't believe you made"

            conclusion: >
              The paint tool really is a 3D coloring book: pick a color, pick a brush, paint. Fill for big areas,
              the round brush for freehand, triangle for detail, and height-range for the magic. It's the most fun
              part of the software, and now it's yours.

            transition: >
              Painting is fun, but painting smart is what makes a model look truly designed — especially something
              with clear parts and levels, like a building. Next we'll use the tricks pro makers use to color
              quickly and cleanly, including that height-range tool that's basically built for buildings with floors.

          - title: "Coloring Smart (By Part, By Floor, By Plan)"
            word_target: 1200
            description: >
              Goes beyond raw painting to strategic coloring: assigning a whole part to one color at once (faster
              than painting), using the height-range tool for layered structures like building floors, and
              minimizing color changes to save time and waste. The bridge between painting and the building project.

            intro: >
              Open with a doing-it-the-hard-way story. "After I learned to paint, I painted EVERYTHING by hand, one
              brush stroke at a time, like a maniac. Took forever. Then an older kid watched me struggle and said,
              'You know you can just color a whole piece at once, right?' I did not know that. I'd been doing the
              hard version of an easy thing. Let me save you that embarrassment."

            chapter_sections:
              - heading: "Color a Whole Part in One Click"
                description: >
                  The fast way most beginners miss.
                bullet_points:
                  - "If a model comes in separate parts — a body, a hat, a base — you can assign each part a color in one click, no painting needed"
                  - "Just select the part in the list on the side and press its color number"
                  - "This is way faster and cleaner than hand-brushing"
                  - "Lots of well-made models are built in separate parts exactly so you CAN color them in one click. Check the parts list before you start hand-painting like I did"

              - heading: "The Height-Range Trick for Floors"
                description: >
                  The single most useful trick for buildings.
                bullet_points:
                  - "The Height Range brush colors everything between two heights at once — perfect for a building's floors"
                  - "Want every other floor a different color? Set the height bands and click — done in seconds"
                  - "The same trick works on anything stacked: a layer-cake model, stairs, a rocket"
                  - "This one tool turns a 20-minute hand-paint job on a tall building into about 30 seconds. It's the most useful coloring trick for the kind of stuff your dad makes"

              - heading: "Fewer Changes = Less Waste"
                description: >
                  Pretty and efficient are the same choice.
                bullet_points:
                  - "Remember every color change wastes plastic and time with those purge blobs"
                  - "So a design with colors in big clean zones prints way better than colors scattered everywhere"
                  - "Before you finalize, ask: can I group the colors so the printer switches less often?"
                  - "A smart color plan isn't just prettier — it literally prints faster and wastes less. Pretty and efficient turn out to be the same choice"

              - heading: "Try This — Color a Building Model Two Ways"
                description: >
                  Compare hard and smart on a preview of the real mission.
                bullet_points:
                  - "Find a free multi-story building model online"
                  - "Color it once by hand-painting every floor, then start over and use Height Range"
                  - "Time both and compare how clean they look"
                  - "You just felt the difference between working hard and working smart — and previewed exactly what you'll do on Dad's building"

            conclusion: >
              Smart coloring beats hard coloring every time: color whole parts at once, use height-range for
              anything stacked, and group colors to cut down on changes. These tricks make your prints look more
              designed and print more cheaply, both at once.

            transition: >
              There's still that one nagging downside we keep mentioning — all the plastic wasted every time the
              printer swaps colors. It's real, and a sloppy four-color print can waste more plastic than it uses.
              Next we face it head-on with the tricks that fight the waste, so your big colorful prints don't come
              with a giant pile of rainbow garbage.

      - title: "Making Colors Behave"
        description: >
          Facing the real cost of multi-color printing — the wasted plastic and time — and then putting everything
          together in a full four-color print, your graduation before the building.

        chapters:
          - title: "Fighting the Rainbow Waste"
            word_target: 1200
            description: >
              Tackles the practical downsides of multi-color printing — the purge waste, the purge tower and
              'poop,' flushing volumes, and controlling which color prints first. Gives the reader concrete levers
              to reduce waste and print time on color-heavy models like the building.

            intro: >
              Open with a waste disaster and a 'this is real' beat. "Let me tell you about the time I printed a
              four-color keychain and ended up with a pile of wasted plastic three times bigger than the keychain
              itself. The keychain was the size of a quarter. The garbage was the size of a golf ball. I almost
              rage-quit. Then I learned the tricks that cut that waste way down, and I want you to know them before
              you make my mistake."

            chapter_sections:
              - heading: "Where the Waste Comes From"
                description: >
                  A quick recap of the cost.
                bullet_points:
                  - "Every color swap, the nozzle has to purge the old color before the new one comes out clean"
                  - "The slicer even shows you the 'flushed' plastic amount — sometimes more than the model itself"
                  - "The more swaps, the more waste, which is why grouping colors from the last chapter matters so much"
                  - "This is normal, but it's not fixed in stone — you have levers you can pull"

              - heading: "The Purge Tower and the Poop"
                description: >
                  Where all that wasted plastic goes.
                bullet_points:
                  - "The slicer can build a 'purge tower' next to your model — a little throwaway pillar the nozzle wipes onto when switching"
                  - "Some printers shoot the waste out a chute instead, the famous 'poop'"
                  - "Both are just the nozzle cleaning itself between colors — don't be alarmed"
                  - "You toss the tower and the poop in the trash when the print's done"

              - heading: "The Levers That Cut Waste"
                description: >
                  Settings that bring the waste back down.
                bullet_points:
                  - "Lower the 'flushing volume' setting carefully — less purge, but go too low and colors bleed into each other (test it)"
                  - "Group colors so the printer makes fewer total swaps"
                  - "Choose which color prints first and last to avoid pointless extra changes"
                  - "You can't get the waste to zero with one nozzle — anyone promising that is selling something. You just get it reasonable, and reasonable is the win"

              - heading: "Try This — Slice the Same Model Two Ways"
                description: >
                  Prove that smart design beats wasteful design, with real numbers.
                bullet_points:
                  - "Take a four-color model and slice it once with the colors scattered everywhere"
                  - "Slice it again with the colors grouped into big clean zones"
                  - "Compare the 'flushed plastic' number the slicer shows for each"
                  - "Notice the grouped one wastes way less. You just proved smart design beats wasteful design with actual numbers"

            conclusion: >
              Multi-color always costs some wasted plastic — that's the price of one nozzle doing four jobs. But
              grouping colors, tuning the flush, and picking a smart print order keep it reasonable. You can't beat
              the waste to zero, but you can absolutely keep it from beating you.

            transition: >
              You now know everything about multi-color printing — the painting, the smart strategy, and the
              waste-fighting. There's only one thing left before the big mission: actually doing a complete
              four-color print yourself, start to finish, as a dress rehearsal. Let's print something real in four
              colors before we take on Dad's building.

          - title: "Your Four-Color Graduation Print"
            word_target: 1100
            description: >
              A capstone chapter where the reader executes a complete multi-color print from start to finish — a
              real object like a nameplate, keychain, or small figure — pulling together every skill so far. Serves
              as confidence-building practice immediately before the harder building project.

            intro: >
              Open with the graduation framing and a real moment. "Okay. This is your graduation. Everything you've
              learned — the four moves, the settings, the painting, the waste tricks, the SD card — you're going to
              do all of it, in one print, in four colors, by yourself. When I finished my first real four-color
              print, I carried it around the house showing literally everyone. You're about to have that exact
              moment. Let's go."

            chapter_sections:
              - heading: "Pick Something Worth Showing Off"
                description: >
                  Choosing a smart first multi-color project.
                bullet_points:
                  - "Pick a small four-color model you'd actually want — a nameplate with your name, a keychain, a little character"
                  - "Small is smart for a first multi-color print: less time, and less waste if something goes wrong"
                  - "Make sure it has clear areas for different colors so the four-color feature actually shows"
                  - "Download it as an STL or 3MF file"

              - heading: "Run the Whole Checklist"
                description: >
                  Every skill so far, in order.
                bullet_points:
                  - "Place, size, spin, and stand it — the four moves"
                  - "Set layer height to 0.2mm and infill to about 15 percent"
                  - "Load and assign your four colors, painting smart and grouping them"
                  - "Add supports only if something actually hangs. This is every chapter so far, in order — you already know all of it"

              - heading: "Preview, Card, Print"
                description: >
                  Finishing the job.
                bullet_points:
                  - "Scrub the preview — check the colors look right and nothing floats"
                  - "Check the time and the flushed-plastic number, and tweak if it's silly"
                  - "Save to the card, carry it over, print it, and WATCH that first layer"
                  - "When it finishes, peel it off and go show someone"

              - heading: "Try This — Print It, Then Improve It"
                description: >
                  The print-look-improve loop that is the real secret.
                bullet_points:
                  - "After your first four-color print, look at it honestly — what's not perfect?"
                  - "Change one thing — a color, the orientation, the flush setting — and print it again"
                  - "Compare the two and see yourself getting better in real time"
                  - "That loop — print, look, improve — is the actual secret to getting good at this"

            conclusion: >
              You just did a complete four-color print by yourself, using every single skill in this book so far.
              That thing in your hand is proof you're not a beginner anymore. Go show it off — you earned it.

            transition: >
              You're ready. Truly ready. Because now comes the real reason you have this printer: Dad's building.
              It starts as a giant, messy, computer-choking file that absolutely will not print as-is. The next
              part is about taming that monster and turning it into a clean, colorful model you can hold. This is
              the final boss.

  - title: "Part Five: The Real Mission — Printing Dad's Building"
    description: >
      This is why you have the printer. Dad hands you a model of one of his real buildings — and it's a
      200-megabyte monster that freezes the computer and refuses to print. This final part is the boss battle:
      shrinking the giant file, fixing what's broken, sizing it to fit, coloring it by floor, and finally printing
      a real building you can hold in your hand. Everything you've learned was training for this.

    sections:
      - title: "The Giant File Problem"
        description: >
          Why a real building file is a monster, and the three-step plan to tame it: shrink it, fix it, and get it
          watertight enough for the slicer to accept.

        chapters:
          - title: "The 200-Megabyte Monster"
            word_target: 1200
            description: >
              Frames the central challenge — architectural files exported from professional software are enormous
              (millions of tiny triangles) and will choke the slicer or refuse to print. Explains WHY in kid terms
              and lays out the rescue plan for the next chapters, so the reader isn't overwhelmed.

            intro: >
              Open with a frozen computer. "The first time my dad sent me one of his building files, I dragged it
              into the slicer and... the whole computer froze. Spinning wheel. For like two minutes. I thought I
              broke it. I didn't. The file was just a monster — way too big and detailed for a printer to ever use.
              Here's the thing nobody warns you about, and the plan to beat it."

            chapter_sections:
              - heading: "Why Dad's Files Are Monsters"
                description: >
                  Where all that size comes from.
                bullet_points:
                  - "The programs grown-ups use to design real buildings save EVERY tiny detail — every pipe, every screw, millions of little triangles"
                  - "That's perfect for building it for real, but a printer can't use a fraction of that detail"
                  - "A file like that can be 200 megabytes, when your slicer really wants more like a few"
                  - "The screen even warns you 'too many triangles' the second you load it"

              - heading: "A Triangle You Can't See Is a Triangle You Don't Need"
                description: >
                  The core insight that makes the whole rescue make sense.
                bullet_points:
                  - "3D models are made of tiny triangles, and detailed ones have millions of them"
                  - "But your printed building is the size of your hand, and the nozzle is 0.4mm — way too fat to print a tiny screw anyway"
                  - "So most of those triangles can't even be printed — they just choke the computer for no reason"
                  - "The fix isn't a faster computer. It's throwing away the detail you could never print in the first place. Less is the whole answer"

              - heading: "The Rescue Plan"
                description: >
                  The roadmap, so it doesn't feel overwhelming.
                bullet_points:
                  - "Step one — shrink it: throw away triangles you can't see (next chapter)"
                  - "Step two — fix it: patch any holes or broken bits so the slicer accepts it"
                  - "Step three — fit it and color it: size it to the bed and color it by floor"
                  - "Dad handles getting it out of his fancy software and into a regular model file. Your job starts when you've got that file — and your job is exactly the stuff this book taught you. The whole thing takes about an hour, not the 20 you might fear"

              - heading: "Try This — Try to Break It (Safely)"
                description: >
                  See the problem clearly, which is step one to solving it.
                bullet_points:
                  - "With Dad's help, get one of his exported building files and drag it into the slicer"
                  - "Watch it struggle, or warn you about too many triangles"
                  - "Don't panic — you're about to fix exactly this"
                  - "Seeing the problem with your own eyes is the first step to beating it"

            conclusion: >
              Dad's building file is a monster only because it's packed with detail you could never print anyway.
              The fix isn't more computer — it's less detail. Over the next few chapters you'll cut it down to size,
              and it's way faster than it looks.

            transition: >
              So let's start cutting. The very first move is to throw away all those triangles you can't see — and
              OrcaSlicer has a tool that does it in seconds. Next we shrink the monster from unprintable to
              printable, and watch the computer stop choking.

          - title: "Shrinking the Monster (Simplify)"
            word_target: 1300
            description: >
              The how-to for OrcaSlicer's Simplify Model tool — reducing triangle count with the detail level and
              decimate ratio, using show-wireframe to inspect, and watching for the gotcha where simplifying can
              lift the model off the bed. The single most important technique for the building project.

            intro: >
              Open with the million-dots drawing. "Imagine a drawing made of a million tiny dots, and the same
              drawing made of way fewer dots. From across the room? Identical. Up close, sure, the dotty one is a
              little rougher — but you're not looking up close. That's exactly the trick we're about to pull on
              Dad's building: throw away most of the dots, keep the picture. It's almost magic how well it works."

            chapter_sections:
              - heading: "The Simplify Tool"
                description: >
                  Finding it and using it.
                bullet_points:
                  - "Right-click the model in the Prepare tab and choose Simplify Model"
                  - "It lets you pick a detail level, or a 'decimate ratio' — basically what fraction of the triangles to keep"
                  - "A ratio of 0.5 keeps half; 0.1 keeps a tenth. For a monster file, you can throw away most of them"
                  - "The slicer instantly redraws the model with way fewer triangles"

              - heading: "Show Wireframe and Check Your Work"
                description: >
                  Use your eyes, not guesses.
                bullet_points:
                  - "Turn on 'show wireframe' so you can SEE the triangles before and after"
                  - "Simplify a little, then look — does it still look like the building? Simplify more"
                  - "Stop when it starts losing details you actually care about, like a roofline or a tower"
                  - "Do it in steps and keep looking. Don't slam it to the most aggressive setting blind — sneak up on the lowest detail that still looks like the building"

              - heading: "The Sneaky Bottom-Lift Gotcha"
                description: >
                  The trap that makes people blame the printer.
                bullet_points:
                  - "Simplifying can accidentally make the flat bottom not-flat, so the model floats a hair above the bed and won't stick"
                  - "After simplifying, check that the model is sitting FLAT on the plate"
                  - "If it's floating, just drop it down onto the bed (use 'place on face' or the lower option)"
                  - "This trips up tons of people — they simplify, the print won't stick, and they blame the printer. It's the lifted bottom. Now you'll know instantly"

              - heading: "Try This — Shrink Dad's Building"
                description: >
                  The real task, the hardest single step in the project.
                bullet_points:
                  - "Take Dad's building, turn on wireframe, and run Simplify"
                  - "Cut the triangles down in steps until it slices fast but still looks like the building"
                  - "Check that it's sitting flat on the bed"
                  - "You just turned an unprintable monster into something the printer can handle — the hardest single step, done"

            conclusion: >
              Simplify is the tool that beats the monster: throw away the triangles you can't see, keep checking
              with wireframe, and make sure it didn't float off the bed. A 200-megabyte file becomes printable in a
              couple of minutes. That's the whole trick the pros use.

            transition: >
              Sometimes, though, a shrunk-down building still won't slice right — the slicer complains the model is
              'broken,' with holes or weird edges. That's a different problem with a different fix, and it's the
              last technical hurdle before the fun part. Next we patch up a broken model and make it watertight.

          - title: "Patching the Holes (Fixing a Broken Model)"
            word_target: 1200
            description: >
              Covers mesh repair: what 'broken' (non-manifold) means in kid terms — a model that couldn't hold
              water — using OrcaSlicer's Fix Model, the surprising scale-up-100x trick for rounding-error problems,
              and when to confirm the repair. The troubleshooting safety net for the building.

            intro: >
              Open with a balloon. "Think about a balloon. If it's perfect, it holds air. But if there's even one
              tiny hole, the whole thing won't work — air leaks right out. A 3D model is the same: the slicer needs
              a shape that could hold water, with no holes and no weird edges. Buildings exported from fancy
              software are FULL of tiny holes. Here's how to patch them."

            chapter_sections:
              - heading: "What 'Broken' Even Means"
                description: >
                  The watertight idea, in plain words.
                bullet_points:
                  - "The slicer needs a model that's 'watertight' — a sealed shape with a clear inside and outside"
                  - "Broken models have holes, or edges where the walls don't quite meet, or surfaces facing the wrong way"
                  - "The slicer gets confused about what's solid and what's air, and either fails or prints garbage"
                  - "Building files break this way constantly because they were drawn as flat surfaces, not solid objects"

              - heading: "The Fix Model Button"
                description: >
                  Built-in repair.
                bullet_points:
                  - "OrcaSlicer has a 'Fix Model' option that auto-patches holes and bad edges"
                  - "Right-click, fix, wait a moment — it stitches the model watertight"
                  - "This handles most building problems on its own"
                  - "Check it afterward to make sure it still looks like the building you started with"

              - heading: "The Weird Trick: Make It Huge"
                description: >
                  The scale-up fix that makes no sense but works.
                bullet_points:
                  - "Sometimes a model breaks because of teeny rounding errors too small for the slicer to handle"
                  - "The fix is bizarre but real: scale the whole model UP by 100 times, fix it, then scale it back down"
                  - "At giant size, the errors are big enough for the repair tool to actually patch"
                  - "This makes zero sense the first time you hear it, and it works almost every time. When a building 'just won't slice,' try the 100x trick before you give up. I've rescued so many models this way"

              - heading: "Try This — Fix and Confirm"
                description: >
                  Add 'model surgeon' to your skills.
                bullet_points:
                  - "If Dad's building threw an error, run Fix Model on it"
                  - "If that didn't do it, try the scale-up-100x trick, fix, then scale back down"
                  - "Slice again and watch the error disappear"
                  - "You just added 'model surgeon' to your skills — most adults with this printer have no idea how to do this"

            conclusion: >
              A broken model is just one that can't hold water — holes, bad edges, confused surfaces. Fix Model
              patches most of it, and the weird 100x trick rescues the rest. With those two moves, almost no
              building file can stop you.

            transition: >
              The monster is shrunk and patched. Now the fun returns. The building is finally a clean, printable
              model — so let's make it fit the bed, and then color it floor by floor into something that actually
              looks like Dad's real building. The payoff is close.

      - title: "Fit, Color, Print"
        description: >
          The home stretch: sizing the building to the bed (and cutting it up if it's too big), coloring it like
          the real thing, and running the full print that this whole book has been training you for.

        chapters:
          - title: "Making It Fit (Scale and the Cut Tool)"
            word_target: 1200
            description: >
              Sizing the building to the 256mm build volume, choosing a scale, and using the Cut tool to split
              buildings too tall or wide to fit — then printing in pieces and joining them. Solves the 'it's bigger
              than the bed' problem that real buildings always create.

            intro: >
              Open with a too-tall sandwich. "Ever try to bite into a sandwich that's way too tall? You can't — you
              have to squish it or cut it. A building model has the same problem: real buildings are big, and your
              printer's bed is only about the size of a school ruler each way. So we either shrink the building to
              fit, or we slice it into pieces and glue it back together. Both are easy once you know the moves."

            chapter_sections:
              - heading: "How Big Should It Be?"
                description: >
                  Choosing a scale.
                bullet_points:
                  - "The bed is 256mm each way — about a ruler's length cubed"
                  - "Scale the building down until it fits with a little room to spare"
                  - "Bigger looks more impressive but takes way longer to print — choose your tradeoff (you know this game now)"
                  - "Watch the size numbers and pick a height that feels right for a model you'll display"

              - heading: "When It's Still Too Big: the Cut Tool"
                description: >
                  Splitting and joining, which is normal, not cheating.
                bullet_points:
                  - "If the building won't shrink small enough without losing detail, use the Cut tool to slice it into pieces, like cutting that tall sandwich"
                  - "Print each piece separately, then glue them together — pros do this all the time for big models"
                  - "Cut along natural lines, like between floors or at a corner, so the seams hide"
                  - "Cutting and gluing isn't cheating — it's how almost every big model and cosplay prop gets made. The seam disappears with a little sanding. Don't be afraid of it"

              - heading: "Standing It Up Right"
                description: >
                  Orientation, building edition.
                bullet_points:
                  - "Usually a building prints best standing the way it really stands, with its flat base on the bed"
                  - "That flat bottom sticks great and needs almost no support"
                  - "If there are big overhangs — a balcony, an overhanging roof — remember supports from earlier"
                  - "The smart-orientation skill you learned applies right here"

              - heading: "Try This — Fit Dad's Building"
                description: >
                  Get the building physically ready to print.
                bullet_points:
                  - "Scale Dad's building to fit the bed with room to spare"
                  - "If it's too detailed to shrink, try the Cut tool and split it into two printable pieces"
                  - "Make sure it's sitting flat with a solid base"
                  - "The building is now physically ready to print — it just needs color"

            conclusion: >
              Real buildings are bigger than your bed, so you either shrink them to fit or cut them into pieces and
              join them — both totally normal. With the building scaled and standing flat, the hard engineering is
              behind you. All that's left is the fun part: color.

            transition: >
              Now for the best moment in the whole project — taking that plain gray building and painting it into
              something that looks like Dad's real design, floor by floor, feature by feature. Everything you
              learned about smart coloring is about to pay off on the model that matters most.

          - title: "Coloring the Building Like the Real Thing"
            word_target: 1100
            description: >
              Applies the multi-color skills specifically to the building: planning a four-color map for a real
              structure, using height-range for floors and by-part for features, and grouping colors to keep the
              print efficient. The satisfying creative payoff chapter.

            intro: >
              Open with the moment it becomes real. "This is the part I look forward to every single time. The
              building's been a boring gray blob through all that fixing and shrinking. Now you get to bring it to
              life — windows here, brick there, a green base, a pop of color on the roof. The first time I colored
              one of Dad's buildings and it actually looked like his real building, he put it on his desk at work.
              That's the goal. Let's make it."

            chapter_sections:
              - heading: "Plan the Four-Color Map First"
                description: >
                  Use the planning habit on the real thing.
                bullet_points:
                  - "Before painting, decide your four colors and what each is for — just like you practiced"
                  - "For a building: maybe walls one color, windows another, the ground or base a third, the roof or accents the fourth"
                  - "Look at a photo of Dad's real building for ideas"
                  - "Match the model to the real thing and it stops being a toy and becomes a real architecture model — that's what makes a grown-up put it on their desk"

              - heading: "Height-Range for Floors, By-Part for Features"
                description: >
                  The efficient combo on the model it was made for.
                bullet_points:
                  - "Use the Height-Range brush to color floors or bands fast — seconds, not minutes"
                  - "If the building came in parts — roof, base, tower — color those by-part in one click each"
                  - "Use the Fill brush for big wall sections"
                  - "This is exactly the smart-coloring combo from Part Four, on the model it was made for"

              - heading: "Keep It Efficient"
                description: >
                  Stay waste-aware on a big print.
                bullet_points:
                  - "Group colors into clean zones so the printer swaps less and wastes less"
                  - "A building colored in neat bands prints far better than one with colors scattered everywhere"
                  - "Check the flushed-plastic number in the preview and adjust if it's wild"
                  - "Pretty and efficient, same choice — you know this by now"

              - heading: "Try This — Bring Dad's Building to Life"
                description: >
                  The creative payoff task.
                bullet_points:
                  - "Pull up a photo of the real building and plan your four colors to match"
                  - "Color it: height-range the floors, by-part the features, fill the walls"
                  - "Spin it around and clean up any missed spots"
                  - "You now have a colored model of a real building, ready for its final step"

            conclusion: >
              With a smart four-color plan — height-range for floors, by-part for features, grouped to stay
              efficient — that gray blob becomes a real architecture model of Dad's actual building. This is the
              moment all the fixing and shrinking was for.

            transition: >
              The building is shrunk, fixed, fitted, and colored. There's just one thing left: pressing print and
              turning all this work into a real object you can hold. The final chapter is the dress rehearsal and
              the main event — the whole project, start to finish, and what to watch for so it comes out right.

          - title: "Press Print (The Whole Project, Start to Finish)"
            word_target: 1300
            description: >
              The culminating walkthrough: a final checklist pulling together every skill, slicing the colored
              building, previewing carefully, saving to the card, and running the long multi-color print —
              including realistic expectations about print time, watching the first layer, and what can go wrong
              overnight. The payoff of the entire book.

            intro: >
              Open with the night-before-the-morning. "This is it. The whole book has been training for this one
              print. When I did my first full building, I checked everything three times, pressed print, and then
              barely slept because I kept wanting to check the camera. In the morning there it was — a real
              building, in four colors, that I made. Let's get you to that morning. One careful pass through
              everything, then we press the button."

            chapter_sections:
              - heading: "The Final Checklist"
                description: >
                  Every skill in the book, in one list.
                bullet_points:
                  - "Building shrunk and sitting flat? Holes fixed? Scaled to fit? Four colors mapped and painted, grouped smart?"
                  - "Layer height 0.2mm, infill low (around 10 percent — it's a display model)"
                  - "Supports only where something actually hangs"
                  - "Four colors loaded in the right slots and matching the slicer. This is everything you learned, in one list"

              - heading: "Slice and Preview Like Your Time Depends On It"
                description: >
                  The five-minute check that protects an all-night print.
                bullet_points:
                  - "Slice it, then really scrub the preview — colors right? Nothing floating? Supports where you need them?"
                  - "Check the time estimate — a colored building can take many hours, and that's normal, so plan for overnight"
                  - "Check the flushed-plastic number one last time"
                  - "This five-minute check protects a print that might run all night"

              - heading: "Print It and Survive the Wait"
                description: >
                  The main event.
                bullet_points:
                  - "Save to the card, carry it over, press print, and WATCH the first layer — your whole habit comes down to this moment"
                  - "Once the first layer's good, let it run, door closed, and watch from the camera instead of opening it"
                  - "Long prints can fail late — a color jam, a piece popping loose — so checking the camera now and then beats discovering it cold in the morning"
                  - "When it finishes, let it cool, then bend the plate and peel off your building"

              - heading: "Try This — Print the Building, Then Make It Better"
                description: >
                  The print-look-improve loop, one last time.
                bullet_points:
                  - "Print Dad's building start to finish"
                  - "When it's done, look hard — what would you change next time? Colors, scale, orientation?"
                  - "Print version two with that one improvement"
                  - "You've now done the full loop on a real project — and that print-look-improve loop never stops, no matter how good you get"

            conclusion: >
              You took a 200-megabyte monster and turned it into a real, colorful building you can hold in your hand
              — using every skill in this book, all by yourself. That's not beginner stuff. That's the whole game,
              start to finish. The printer's just a tool now. The maker is you.

            transition: >
              There's no next chapter, because there's no next lesson you need from me — you've got all of it. So
              go print YOUR house, your school, your whole street. Become Dad's official model-maker for his other
              buildings. The skills you built here — shrinking, fixing, fitting, coloring — work on literally any
              model, not just buildings. The printer was never the point. You learning to make anything you can
              imagine was the point. Now go print something.
