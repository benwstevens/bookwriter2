title: The CivicDev Pursuit Playbook
author: Ben
default_word_target: 1500
parts:
- title: 'Part One: The Municipal Buyer'
  description: 'Who actually buys municipal capital projects in North Carolina, South Carolina, and Virginia,
    and why their behavior makes no sense from a private-developer''s mental model. This part covers the
    buyer''s objective function (defensibility, fairness, re-election), the forms of government and special-purpose
    districts that govern who can sign, the career-staff and elected-body roster, and the leadership transitions
    that quietly reshape a jurisdiction''s capital priorities every year. Misreading any of this is the
    single largest cause of failed pivots from private development to public-sector advisory.

    '
  sections:
  - title: How the Public Sector Decides
    description: 'The objective function and governance structure of municipal buyers — different from
      a private LP in every dimension that matters to a pursuit.

      '
    chapters:
    - title: Why Municipal Buyers Behave Nothing Like Private Clients
      word_target: 1500
      description: 'The single largest cause of failed pivots from private development to public-sector
        advisory is misreading the buyer. Municipal clients are not slow or irrational — they are optimizing
        for a different objective function entirely: political survival, audit defensibility, and equity.
        This chapter defines that objective function and shows why "speed and certainty" pitches that
        close private LPs flop in front of a town council.

        '
      intro: 'Open with an analogy from the appellate bench. A trial judge writes a quick decision; an
        appellate judge writes every decision knowing it will be read by a higher court, by losing counsel,
        by the press, and possibly by the editorial board. Every word is defensible because every word
        will be reviewed. The municipal buyer is the appellate judge of capital projects: they are not
        optimizing for the best outcome, they are optimizing for the most defensible outcome. A private
        developer who walks in with "we''ll move fast and unlock value" sounds like a trial lawyer to
        an appellate audience.

        '
      chapter_sections:
      - heading: What Public Buyers Are Actually Optimizing For
        description: 'The three things every public buyer is privately optimizing for that no private
          client cares about.

          '
        bullet_points:
        - 'Defensibility: every decision has to survive the auditor, the local newspaper, and the next
          election cycle'
        - 'Fairness: the procurement process is the actual product — not the building, not the schedule,
          the audit trail'
        - 'Retention: the city manager who survives ten years has approved zero scandals; one bad project
          ends a career, ten good ones get you another contract renewal'
        - 'The asymmetry that explains everything: a public manager loses far more from one bad project
          than they gain from ten good ones, which makes risk-aversion rational, not pathological'
      - heading: Why 'Speed and Certainty' Pitches Backfire
        description: 'The private-developer reflexes that read as red flags to a council or board.

          '
        bullet_points:
        - The 'we'll move fast' opener signals to a public buyer that you don't understand the procurement
          timeline they are legally bound to
        - The 'we have certainty on outcomes' pitch reads as overconfidence to a manager who has watched
          ten consultants over-promise
        - The private-LP framing of risk-adjusted returns does not translate; public clients optimize
          for downside risk only
        - 'The insider truth: the private developer''s instinct to get to the close fast is the exact
          behavior that gets them excluded from the shortlist'
      - heading: The Audit Trail as the Real Product
        description: 'What you are actually selling, and why most pursuits get it wrong.

          '
        bullet_points:
        - Procurement is a paper-trail business; the SOQ, the evaluation memo, the contract, the change-order
          file all have to read clean if subpoenaed
        - Defensibility is built in — through evaluation rubrics, scoring memos, public meetings, and
          bid tabulations — not bolted on at the end
        - 'The owner''s-rep value proposition translates directly: ''we make your record defensible''
          is the highest-leverage sentence in the cover letter'
        - 'Why a small jurisdiction without an in-house capital projects manager is the buyer most acutely
          feeling this: they have the same defensibility burden as a big city, with none of the staff
          to carry it'
      conclusion: 'The public buyer is not slow, not irrational, not anti-business. They are optimizing
        for a different objective function — defensibility first, fairness second, results third — and
        a private developer who recognizes that hierarchy in the first thirty seconds of a meeting is
        the developer who gets a second meeting. Every pursuit decision in the rest of this book follows
        from that recognition.

        '
      transition: 'Recognizing the buyer''s objective function is the necessary first step. The next is
        identifying who the buyer actually is — and in NC, SC, and VA, that depends on the form of government
        and the special-purpose districts laid over it. Misidentify the form, and you spend a year courting
        the mayor when the manager controls procurement. The next chapter maps that terrain.

        '
    - title: Forms of Government and Special-Purpose Districts in NC, SC, and VA
      word_target: 1700
      description: 'Who can sign, who can champion, and who can kill a project depends entirely on the
        form of government — and on the layer of special-purpose districts that often controls CivicDev''s
        best targets. NC and VA are dominated by council-manager and county-administrator structures;
        SC has a wider mix including strong-mayor cities and three distinct county forms. Many of the
        highest-converting pursuits — fire stations, schools, water authorities — are not run by general-purpose
        governments at all.

        '
      intro: 'Open with an analogy from etiquette and protocol. The same direct question is gracious in
        one culture and a duel-trigger in another. In NC''s council-manager city you call the manager
        and skip the mayor; in SC''s strong-mayor town you call the mayor and the manager answers to him;
        in a VA county with a constitutional sheriff, you call the sheriff because the county administrator
        can''t tell him what to do. Same call, three different doors, three different outcomes. The form
        of government is the protocol — and a developer accustomed to private-sector etiquette is going
        to violate it on call one unless they learn it first.

        '
      chapter_sections:
      - heading: Council-Manager and Its Variants
        description: 'The dominant form across the three-state footprint and where authority actually
          sits.

          '
        bullet_points:
        - Council-manager (NC default for cities; common in VA; common in SC) — the manager has appointing
          authority over staff, runs procurement, and is the practical decision-maker on capital scope
          and shortlists
        - Mayor-council and strong-mayor variants in SC and a handful of NC cities — the mayor controls
          the executive function, and the 'manager' may be appointed by and serving the mayor
        - 'The ''manager-in-name-only'' pattern: a small town with a part-time clerk-manager who has the
          title but not the authority — the elected board is running procurement directly'
        - 'The insider truth: in council-manager governments, the mayor cuts the ribbon but the manager
          picks the firm — pitch the wrong one and your name never reaches the panel'
      - heading: County Structures Across Three States
        description: 'NC, SC, and VA each have a different county model — and SC has three of them.

          '
        bullet_points:
        - NC's manager-led counties — the county manager is the equivalent of a city manager and runs
          capital procurement
        - SC's three forms (council, council-administrator, council-manager, council-supervisor) and how
          each shifts the authority center
        - VA's board of supervisors with a county administrator or county executive — and the constitutionally
          independent sheriff, commonwealth's attorney, clerk, treasurer, and commissioner of revenue
          who hold capital leverage of their own
        - Where authority for capital project initiation, A/E selection, and contract award actually sits
          in each form — and how to ask the question without sounding like an outsider
      - heading: Special-Purpose Districts — The Underserved Market
        description: 'Fire districts, school boards, and authorities are CivicDev''s sweet spot precisely
          because they are systematically under-served by the big firms.

          '
        bullet_points:
        - NC fire service districts and county fire commissions; SC special purpose fire districts (Indian
          Land, Greater Greenville); VA fire/EMS departments embedded in counties or cities
        - 'School boards: NC''s elected county-coterminous boards, SC''s mixed appointed/elected boards,
          VA''s elected/appointed split with county-funded capital — the bifurcation that traps unprepared
          firms'
        - Water/sewer authorities, regional airport authorities, library systems, recreation districts
          — boards with capital authority, no in-house staff, and one consultant on speed-dial
        - 'Why district boards are the CivicDev sweet spot: same defensibility burden as a city, fraction
          of the staff, far less competition for the work'
      - heading: Mapping Authority Before You Pitch
        description: 'The thirty-minute exercise that prevents the wrong-door pursuit.

          '
        bullet_points:
        - 'The pre-pitch authority map: who initiates, who approves the CIP line, who selects the A/E,
          who signs the contract, who manages the project'
        - 'Public artifacts to consult: charter/code, board agendas, the budget message''s signature page,
          the org chart on the website'
        - The 'who do I talk to about capital projects' phone call to the clerk's office — the most efficient
          five-minute investment in any pursuit
        - The mayor-vs-manager tension and how to avoid being weaponized in it — a pitch that names both
          keeps you neutral, a pitch that names only one picks a side you didn't mean to pick
      conclusion: 'Every form of government in NC, SC, and VA encodes a different answer to one question:
        who has the authority to spend money on this building? Knowing the answer before the first call
        is what separates a pursuit firm from a cold-caller. Knowing the layer of special-purpose districts
        on top of it is what separates a CivicDev-style firm from a generalist consultant.

        '
      transition: 'The form of government tells you which door to walk through. Once you''re inside, the
        next question is who actually reads your proposal — and the surprise for most private developers
        is that the elected officials read it last, if at all. The career staff are the first audience,
        and most lost pursuits were lost in the staff read.

        '
    - title: The Career-Staff Buyer Roster
      word_target: 1700
      description: 'In a pursuit, the proposal is read first by career staff and only then — sometimes
        — by elected officials. Knowing each role''s daily pain, professional credentials, conference
        circuit, and reading list converts cold outreach into warm conversation. Most lost pursuits were
        lost in the staff read, not the council vote.

        '
      intro: 'Open with an analogy from teaching hospitals. The patient thinks the attending physician
        makes the call, but every chart was written by a resident and reviewed by a fellow before the
        attending walked in the room. The chart determines what the attending sees. In a pursuit, the
        city manager is the attending — and the finance director, public works director, and procurement
        officer are the residents writing the chart. The proposal that wins is the one written for the
        residents, not the attending.

        '
      chapter_sections:
      - heading: The Manager's Office
        description: 'County administrator, city manager, town manager, and the deputies who do the actual
          reading.

          '
        bullet_points:
        - County administrator / city manager / town manager — the appointed executive who runs the day-to-day
          and reports to the elected body
        - Assistant county administrators (ACA) and assistant city managers (ACM) — usually the actual
          reader of capital advisory proposals, often promoted from finance or planning
        - 'Career arc: most managers come up through finance or planning, hold an MPA, and circulate through
          the ICMA / NCCCMA / SCCCMA / VLGMA conference circuit'
        - 'Daily pain: state-mandate compliance, audit findings, council politics, staff retention, and
          finding capacity for capital projects nobody wants to manage themselves'
      - heading: The Money and Operations Roles
        description: 'Finance, public works, facilities, and the procurement officer who can quietly kill
          any pursuit.

          '
        bullet_points:
        - Finance director and budget officer — gatekeepers of CIP and bond capacity; track GFOA / NCGFOA
          / SCGFOA / VGFOA, the GFOA Best Practices, the CPFO and CGFM credentials
        - Public works director, facilities/operations chief, capital projects manager or director — the
          operators who will live with the building for thirty years
        - Procurement officer — the role most often underestimated; veto power over scope language, schedule,
          evaluation criteria, and shortlist composition
        - Planning director and engineering director — the technical reviewers whose silence on a project
          means it isn't moving
      - heading: The Department-Head Sponsors
        description: 'The end users who become project champions — and the ones who can sink a pursuit
          if ignored.

          '
        bullet_points:
        - Fire chief — typically holds CFO (Chief Fire Officer) or EFO (Executive Fire Officer); reads
          Fire Engineering, FireRescue1, IAFC / NCAFC / SCSFA / VFCA materials
        - Police chief and sheriff — different authority structures, especially in VA where the sheriff
          is constitutionally independent
        - School superintendent and chief facilities officer — the CFO ambiguity (chief financial vs.
          chief facilities) that trips up firms; reads CASBO/ASBO and tracks the NCSSA / SCASA / VASS
          circuit
        - Library director, parks director, IT director — smaller buyers but often more accessible and
          the entry point to a longer relationship
      - heading: Matching Signals at the Top of the Letter
        description: 'The single highest-leverage editing pass on any cold outreach.

          '
        bullet_points:
        - Identify the recipient's professional association and credential before drafting the salutation
        - Reference the publication or conference they actually read — 'I saw the panel you moderated
          at NCLM last fall' beats any case study
        - 'Match the formality of address: ''Manager'' for a council-manager city, ''Administrator'' for
          a VA county, ''Chief'' for a fire department, never ''Mr./Ms.'' as the first signal'
        - 'The insider truth: most cold pursuit letters fail in the salutation and the first sentence
          — the rest of the letter never gets read'
      conclusion: 'Career staff are the first readers, and the SOQ that doesn''t speak to their daily
        concerns gets passed up the chain only as a courtesy. A firm that knows which credential the chief
        holds and which conference the manager skips earns five extra seconds of attention — and five
        seconds is what separates a deleted email from a returned call.

        '
      transition: 'The career staff are the first readers, but they are not the deciders. The elected
        body is — and reading a council or board is a different skill from reading a manager. The next
        chapter is about vote-counting, fault lines, and the leadership transitions that quietly redraw
        a jurisdiction''s capital priorities every year.

        '
    - title: Reading the Elected Body — and Tracking the Transitions
      word_target: 1500
      description: 'A council or board is not a monolith; it is a vote-counting exercise with predictable
        fault lines. Reading 24 months of meeting minutes before writing an SOQ tells you which commissioners
        must be addressed, which fault lines to avoid, and whether the project has the four votes it needs
        to break ground. And every year, a new manager or chief or superintendent rewrites the capital
        priorities of a jurisdiction within their first 90 days — making transitions the single highest-conversion
        pursuit window in the business.

        '
      intro: 'Open with an analogy from poker. A council is a poker table — there are tells, predictable
        hands, a swing seat that turns every pot, and a dealer (the manager) who isn''t playing but shapes
        how the cards come out. The firms that win are the ones that read the table before the first ante.
        The firms that lose sit down, push chips into the pot, and wonder why everyone else is folding
        their way.

        '
      chapter_sections:
      - heading: Reading 24 Months of Minutes
        description: 'The pre-pursuit research that maps the board before you spend a dollar on outreach.

          '
        bullet_points:
        - Pull the last 24 months of board minutes and consent agendas; vote tallies tell you who aligns
          with whom and on what kinds of issues
        - 'Predictable fault lines to map: urban/rural, fiscal-conservative/growth, geographic equity,
          race and district lines'
        - Identify the project champion (the one who proposes and defends), the skeptic (the one who asks
          for cost detail), and the silent killer (the one who never speaks but always votes no)
        - The 'swing seat' pattern and how A/E and OR firms get caught in it — the firm that's seen as
          captured by the swing's faction loses the swing
      - heading: The Mayor-Manager Tension
        description: 'The political weather pattern that decides whether your pursuit is calm or stormy.

          '
        bullet_points:
        - 'Recognizing mayor-manager tension from public artifacts: budget messages with rebuttals, public
          letters to staff, council members publicly rebuking the manager'
        - 'The risk of being weaponized: a firm that meets only with the mayor in a council-manager city
          becomes a pawn in a fight that has nothing to do with the firm'
        - 'The neutralizing pitch: name both, address both, and refuse to be tagged with either side until
          the project is procured'
        - 'The insider truth: in any jurisdiction with an active mayor-manager fight, the procurement
          is going to be slower and the political risk to the firm higher — qualify accordingly'
      - heading: Leadership Transitions as Windows
        description: 'The 90-day window that opens when a new manager, chief, or superintendent arrives.

          '
        bullet_points:
        - 'The 90-day window: every new executive wants ''help getting my arms around this'' — outside
          advisors are pulled in to do the assessment they don''t have time to do themselves'
        - Interim managers and acting chiefs as accelerated decision-makers — they have less to lose and
          shorter time horizons, so the pursuit cycle compresses
        - The retirement-wave phenomenon in NC/SC/VA fire and school facilities leadership (post-COVID
          demographics) — and how to track it via state association job boards, retirement announcements,
          and LinkedIn
        - 'The risk side of transitions: the prior manager''s vendor often gets quietly cut by the new
          one; if your introduction came from the prior manager, your first call should be to the new
          one before the fact'
      - heading: The Daily BD Discipline of Tracking 150 Miles
        description: 'The systematic monitoring practice that converts transitions from luck into a pipeline
          source.

          '
        bullet_points:
        - 'The watch list: every jurisdiction within 150 miles of Raleigh, every key role, with current
          incumbent and tenure tracked monthly'
        - 'Sources to monitor: state association job boards (NCCCMA, SCCCMA, VLGMA), local trade press,
          ICMA''s PM Magazine, LinkedIn signals on tenure changes'
        - 'The first-touch playbook: a congratulations note within seven days of an announcement, no pitch,
          just an offer to be useful'
        - 'The 60-day follow-up: a substantive memo on a topic the new executive is likely thinking about,
          again no pitch — patience is the capability'
      conclusion: 'The elected body is a vote-counting exercise; the executive bench is a transition-tracking
        exercise; and reading both is daily BD discipline, not project-level research. A firm that knows
        the swing commissioner on every county board within 150 miles of Raleigh — and the tenure of every
        manager and chief in those jurisdictions — has a pursuit pipeline that no competitor can replicate
        without putting in the same years.

        '
      transition: 'Knowing the buyer is the first half of the pursuit equation. The second half is knowing
        the project — where it sits in the seven-to-ten-year arc from first whisper to first ribbon cut.
        The next part of the book follows that arc end to end, because every pursuit decision — when to
        call, what to offer, what fee structure to propose — depends on which phase the project is in.

        '
- title: 'Part Two: How a Project Becomes a Project'
  description: 'The seven-to-ten-year arc from "we need a station" to a ribbon cutting, mapped phase by
    phase, with special attention to the entry points where a CivicDev-style firm adds the most value.
    This part covers the canonical project lifecycle, the under-served pre-architect needs assessment,
    the Capital Improvement Plan as the gateway to every project, the conceptual hinge between program
    management and project management, and the funding mechanics that decide whether anything actually
    gets built.

    '
  sections:
  - title: The Lifecycle and the Wedge
    description: 'Where projects come from, how they enter the pipeline, and where an outside advisor
      can plausibly insert.

      '
    chapters:
    - title: The Municipal Capital Project Lifecycle, End to End
      word_target: 1500
      description: 'Every pursuit decision — when to call, what to offer, what fee structure to propose
        — depends on which phase the project is in. A private developer''s mental model collapses needs
        assessment, financing, and design into one compressed process; the municipal lifecycle stretches
        them across three to seven years with formal gates between each. This chapter walks the eleven
        canonical phases and shows where the OR can plausibly enter and where they cannot.

        '
      intro: 'Open with an analogy from a long-haul flight. A flight has eleven distinct phases — gate
        push, taxi, takeoff, climb, cruise, descent, approach, landing, taxi, gate, deplane — and each
        requires a different procedure, a different checklist, sometimes a different person in command.
        Most passengers only experience the cruise. Most private developers only experience the construction
        phase. The owner''s rep is the air traffic controller who has to track all eleven phases at once,
        on multiple aircraft, with the FAA watching.

        '
      chapter_sections:
      - heading: The Eleven Phases
        description: 'The canonical sequence and the formal gates between each.

          '
        bullet_points:
        - Need → programming → site → environmental and zoning → CIP entry → funding → A/E procurement
          → design (SD/DD/CD) → CMR/builder procurement → construction → commissioning, FF&E, occupancy
        - 'Each phase has a formal gate: a vote, a memo, an agency review, a published RFQ — these gates
          are the diagnostic markers a pursuit firm reads'
        - Phases run in parallel more often than the textbook admits; funding can move while design is
          in progress, and CMR procurement can overlap with DD
        - 'The insider truth: the gates aren''t really sequential — they are political checkpoints, and
          a project that looks stalled is usually waiting for one of them, not all of them'
      - heading: Where Outside Advisors Can Enter
        description: 'The phases where an OR adds value and the phases where they''re already too late.

          '
        bullet_points:
        - 'Highest-value entry: pre-programming and pre-CIP, when the program and budget are both fluid
          and a needs assessment can shape both'
        - 'Mid-value entry: post-CIP, pre-funding, when the project has a number but not a delivery method
          or A/E'
        - 'Late but viable: A/E procurement support, owner-side scope-development, CMR procurement support
          — the standard owner''s-rep window'
        - 'Too-late entry: a project already in CD or pricing — the OR can clean up but cannot reshape'
      - heading: Diagnosing Phase from Public Artifacts
        description: 'The fifteen-minute exercise that tells you what phase a project is in before you
          pick up the phone.

          '
        bullet_points:
        - 'The CIP listing: ''study only,'' ''design,'' ''construction'' — each phrase encodes a phase'
        - 'The agenda packet: a presentation labeled ''needs assessment'' is pre-CIP; an item labeled
          ''A/E selection'' is post-funding'
        - 'RFQ language: scope verbs (''assess'' vs. ''design'' vs. ''manage'') tell you which phase the
          buyer thinks they''re in'
        - 'The ''phase confusion'' problem: jurisdictions that issue an RFQ before they have a program
          or funding — a red flag the OR should name on the discovery call'
      conclusion: 'The eleven phases are the spine of every pursuit. A firm that diagnoses phase accurately
        on call one — and offers help calibrated to that phase — sounds like a peer. A firm that pitches
        construction-phase services at a project still in needs assessment sounds like a stranger.

        '
      transition: 'The highest-value entry point is the earliest one — the needs assessment, before the
        architect, before the CIP commitment, before anyone has decided what the building is. This is
        also the most under-served part of the market, and the chapter that follows explains why.

        '
    - title: Needs Assessments and the CivicDev Wedge
      word_target: 1500
      description: 'The needs assessment is the highest-leverage entry point for a CivicDev-style firm
        because it is pre-architect, pre-CIP-locking, and pre-political-commitment. A needs assessment
        well done determines the program, the budget, and often the architect — and the firm that runs
        it usually wins downstream advisory. Architects systematically under-invest in this work, and
        that gap is the wedge.

        '
      intro: 'Open with an analogy from medicine — the differential diagnosis. Before any surgeon operates,
        an internist runs the differential, orders the imaging, and writes the working diagnosis. No competent
        hospital lets the surgeon pick the patient and the procedure on the same morning. But that is
        exactly what most municipalities do: they hire the architect before they have run the differential.
        The needs assessment is the pre-surgical workup — and the firm that does it is the firm the surgeon
        answers to.

        '
      chapter_sections:
      - heading: What a Defensible Needs Assessment Contains
        description: 'The components every assessment must have to survive a council presentation.

          '
        bullet_points:
        - 'Capacity-vs-condition-vs-compliance framing: how much do you have, what condition is it in,
          and what mandate are you out of compliance with'
        - 'Demographic and call-volume data sources: state fire marshal data, NC DPI / SC DOE / VDOE enrollment
          projections, U.S. Census, locally-validated growth assumptions'
        - 'Peer-jurisdiction benchmarks: square footage per population, response-time performance, capital-spend
          per capita against ten comparable jurisdictions'
        - 'Findings written in defensible language: every finding tied to a data source, a standard, or
          a peer benchmark — never a consultant opinion'
      - heading: Why Architects Under-Invest Here
        description: 'The structural reason this gap exists, and why it is durable.

          '
        bullet_points:
        - The architect's fee model rewards design hours, not pre-design assessment hours
        - Most architects pitch needs assessment as a loss leader to win design — the assessment is rushed
          and the program reflects it
        - 'The ''free programming'' trap: architects offer programming as part of the design fee, but
          free programming is worth what you paid for it'
        - 'The insider truth: the architect''s program is always the architect''s program — an owner-side
          needs assessment produces an owner''s program, and those are different documents with different
          politics'
      - heading: Pricing the Wedge
        description: 'How to scope, price, and convert a needs assessment into the next contract.

          '
        bullet_points:
        - 'Typical fee range: $30K–$150K depending on project type and scope; lump sum, defined deliverables,
          fixed timeline'
        - 'Scope-defining deliverables: the assessment report, the program-of-spaces draft, the order-of-magnitude
          budget, the funding-strategy memo'
        - 'The ''wedge'' contract clause: the assessment retains the firm as program-management advisor
          through CIP entry without re-procurement'
        - 'How a $75K assessment becomes a $400K program-management contract: the assessment defines the
          scope of the next phase, and the firm that wrote the scope is the natural prime'
      - heading: Who Buys an Assessment
        description: 'The roles most likely to pull the trigger and the framing that gets to yes.

          '
        bullet_points:
        - Fire chief who needs to defend a station to a skeptical council — assessment is political ammunition,
          not just analytical work
        - Manager facing a CIP request from a department head with no supporting analysis — assessment
          is the cover for either funding or denying the request
        - School superintendent with growth pressure and a county that won't fund without numbers — assessment
          is the bridge between the district and the county
        - 'The framing that lands: ''before you commit to a $20M building, spend $75K to make sure you''re
          building the right one'' — the ratio sells itself'
      conclusion: 'The needs assessment is the most over-looked product in municipal capital advisory
        and the most strategic. It is the cheapest way for a firm to enter a relationship, the cheapest
        way for a buyer to de-risk a $20M decision, and the most reliable wedge into program-management
        fees that follow. The firm that masters this product changes the unit economics of pursuit.

        '
      transition: 'An assessment defines what to build. The next question is when, and that is decided
        by the Capital Improvement Plan — the document that determines whether a project lives or dies
        in any given budget cycle.

        '
    - title: Capital Improvement Plans and the Politics of Ranking
      word_target: 1700
      description: 'No project that is not on the CIP gets built. Understanding how CIPs are assembled,
        ranked, and adopted in NC/SC/VA local government is the precondition for every BD conversation
        — and the politics of CIP ranking is where geography, equity, and re-election math get encoded
        into a five-year capital schedule. Misreading the politics leads to pursuing projects that will
        never get funded, regardless of how good the SOQ was.

        '
      intro: 'Open with an analogy from the NCAA tournament selection committee. Sixty-eight teams have
        to fit into a bracket. Every conference gets at least one bid. Geographic balance matters. Marquee
        programs get protected seeds. The committee chair mediates between the analytics and the political
        reality. The CIP committee is the selection committee — and the project that doesn''t get a bid
        has a year to wait, regardless of how good its season was.

        '
      chapter_sections:
      - heading: The CIP Mechanics
        description: 'What a CIP is, what it does, and the statutory frame in NC/SC/VA.

          '
        bullet_points:
        - 'What a CIP is in NC/SC/VA practice: a rolling 5-year (and often 10-year) plan listing capital
          projects, costs, funding sources, and timing'
        - 'Statutory hooks: NC GS 159-8 (budget statute incorporating capital), VA Code §15.2-2239 (planning
          commission CIP review), SC''s local-ordinance frame'
        - 'The annual cycle: department request → CIP committee → manager''s recommended budget → board
          adoption — and the windows when each phase is influenceable'
        - 'The CIP committee composition: finance, planning, manager, sometimes citizen members or council
          subcommittee — and how each composition shifts the politics'
      - heading: Ranking Criteria and Scoring Rubrics
        description: 'How projects move up or down the list — formally and informally.

          '
        bullet_points:
        - 'Common formal criteria: life-safety, mandate compliance, ROI, equity, growth-driven need; sometimes
          weighted, sometimes not'
        - 'The informal criteria nobody writes down: which commissioner''s district is overdue, which
          department head is most politically aligned with the chair, which project has external funding
          tied to it'
        - 'Why school capital almost always jumps the queue: state mandates, growth pressure, political
          salience, and a separate body (the school board) lobbying for it'
        - The 'every commissioner gets one' pattern in rural NC/SC/VA counties — and how it distorts technically-grounded
          ranking
      - heading: Geographic Equity and the Fire-Station Rotation
        description: 'The unwritten rules of capital allocation that shape every multi-station fire program.

          '
        bullet_points:
        - Geographic equity rules — formal and informal — in NC/SC/VA counties; the 'one project per district
          per cycle' pattern
        - 'The fire-station-rotation pattern: how stations get built in district sequence regardless of
          operational priority, and how that interacts with ISO ratings'
        - How a manager protects ranked priorities from late-stage political swaps — and the tools (capital-funding
          policy, scoring rubric, citizen committee) that build the protection
        - 'The insider truth: a CIP is about half analysis and half geography; a firm that pitches a project
          as ''analytically next'' without addressing the geography misreads the room'
      - heading: How Outside Advisors Plug In
        description: 'The four high-leverage moments to add value before adoption.

          '
        bullet_points:
        - 'Pre-request shaping: helping a department head prepare a CIP request that scores well under
          the rubric'
        - 'Ranking-rubric design: assisting the manager or CIP committee in updating the scoring methodology
          — defensibility work that builds trust'
        - 'Cost validation: independent cost estimates that survive the manager''s scrutiny and the council''s
          questions'
        - 'External review letters: a credentialed third-party letter that says the project is real, the
          cost is realistic, and the timing is necessary — political cover the manager needs'
      conclusion: 'The CIP is the most consequential document in municipal capital, and most pursuit firms
        treat it as a static reference. It is not. It is a political artifact, refreshed annually, shaped
        by the firms that engage early and ignored by the firms that engage late.

        '
      transition: 'Once a project is on the CIP, the next strategic question is whether the firm pitches
        project-by-project owner''s-rep services or program-management services covering the portfolio.
        The distinction is the conceptual hinge of the entire CivicDev offering, and the next chapter
        walks through it carefully.

        '
    - title: Program Management vs. Project Management — The Distinction That Changes Everything
      word_target: 1500
      description: 'This is the conceptual hinge of the entire CivicDev offering. Program management sits
        at the CIP level and is owner-side, multi-project, strategic, and financial; project management
        sits at the single-project level and is construction-phase, tactical, and operational. They are
        scoped differently, procured differently, priced differently, and require different teaming structures.

        '
      intro: 'Open with an analogy from professional cycling. The team director sits in the car — sees
        the whole race, manages the GC strategy, decides which rider to sacrifice, talks to the sponsors.
        The rider is on the bike — manages one stage, one breakaway, one sprint. Both wear the team jersey;
        neither can do the other''s job. Most owner''s-rep firms pitch the team director''s role with
        a rider''s resume, or vice versa, and lose the contract because the buyer is shopping for a different
        role than the firm is offering.

        '
      chapter_sections:
      - heading: Program Management — The Strategic Layer
        description: 'What program management actually is, scoped at the portfolio level.

          '
        bullet_points:
        - Portfolio prioritization across multiple CIP projects, with cross-project schedule and budget
          rollups
        - 'Funding strategy: matching projects to funding sources, sequencing referenda, sizing GO/LOB
          issuances'
        - A/E and CMR selection support across the portfolio, with owner standards that apply to every
          project in the program
        - 'Risk and reporting at the portfolio level: monthly rollups, cross-project risk register, executive
          dashboards'
      - heading: Project Management — The Operational Layer
        description: 'Single-project owner''s-rep work and what it actually entails day-to-day.

          '
        bullet_points:
        - OAC (owner-architect-contractor) chairing, RFI and submittal log management, schedule analysis
        - Pay-application validation, change-order discipline, contingency-burndown tracking
        - Construction-phase reporting to the manager, the chief, and the board
        - The week-one through close-out arc — visible, tactical, and labor-intensive
      - heading: Procurement and Pricing Differences
        description: 'How RFQs and fee structures differ between program and project work.

          '
        bullet_points:
        - Program RFQs are broader, longer-duration, often IDIQ; project RFQs are narrower and tied to
          a specific CIP line
        - 'Program management fees: typically 1–3% of total program construction value, often capped or
          hourly NTE'
        - 'Project owner''s-rep fees: 3–7% of construction value depending on size, scope, and delivery
          method'
        - 'The insider truth: a firm bidding program work with project-level pricing is leaving money
          on the table; a firm bidding project work with program-level pricing is overpriced and gets
          dropped'
      - heading: When to Pitch Each — and When to Pitch Both
        description: 'The decision rule for a small firm choosing between two related products.

          '
        bullet_points:
        - Pitch program management when the jurisdiction has 3+ active CIP projects and no in-house capital
          projects director
        - Pitch project management when there's a single high-value project and program-level scope is
          implausible for the firm's size
        - Pitch both when the jurisdiction is at an inflection point — a new manager, a new CIP, a new
          bond — and is open to thinking about capacity, not just projects
        - 'Firm-capacity implications: program management is sustainable on a small bench because the
          work is strategic; project management requires a body on site, which doesn''t scale the same
          way'
      conclusion: 'Program management is the higher-margin, more durable product. Project management is
        the easier sale and the more visible work. A small firm that wants to compound — to be the capital
        projects team for a small jurisdiction over a decade — sells program management. A small firm
        that wants the next project sells project management. Both are legitimate; the choice should be
        deliberate.

        '
      transition: 'Whether the engagement is program or project, no project gets built without funding.
        And funding readiness — bonds, pay-go, state programs, federal money, a budget document that actually
        has capacity — is the qualifying step that separates pursuits worth chasing from pursuits that
        will never close.

        '
    - title: Funding Mechanics, State Programs, and Reading the Budget
      word_target: 1900
      description: 'A pursuit without funding readiness is a pursuit that ends in a shelved CIP line.
        This chapter covers the public-sector capital stack a private developer must learn — GO, revenue,
        lease-revenue, COPs/LOBs, pay-go, capital reserves — and walks through the signature state programs
        in NC, SC, and VA. It closes with the practical skill of reading a budget document for funding
        readiness in thirty minutes, the way a private developer reads a pro forma.

        '
      intro: 'Open with an analogy from personal mortgage finance. Every private developer who has bought
        a house knows what a credit score means, what debt-to-income ratio looks like, what an escrow
        account does, what the difference between fixed and ARM is. A municipality has all of these —
        a credit rating, debt-service ratios, fund balance reserves, fixed-rate vs. variable debt — but
        the vocabulary is different. Translating private-side fluency into GO bonds, LOBs, and revenue
        bonds is mostly a vocabulary exercise. The math is familiar.

        '
      chapter_sections:
      - heading: The Public Capital Stack
        description: 'General obligation, limited obligation, revenue, pay-go, and reserves.

          '
        bullet_points:
        - General Obligation (GO) bonds and the referendum requirement; NC LGC pre-approval before any
          GO issuance; SC's council-resolution path; VA's referendum requirements by jurisdiction class
        - Limited Obligation Bonds (NC LOBs, formerly COPs/installment financings under GS 160A-20), SC
          certificates of participation, VA lease-revenue and Public Facility Revenue Bonds (PFRBs)
        - Revenue bonds for water/sewer and parking; pay-go capital and capital reserves as the boring-but-reliable
          funding sources
        - The NC Local Government Commission as a unique pre-approval gatekeeper — every NC local debt
          issuance ultimately runs through Raleigh, which is both a constraint and an information source
          for pursuit firms
      - heading: State-Specific Capital Programs Worth Knowing on Call One
        description: 'The signature programs in each state that an OR must be able to discuss fluently.

          '
        bullet_points:
        - 'North Carolina: Needs-Based Public School Capital Fund (NBPSCF), State Capital and Infrastructure
          Fund (SCIF), Public School Building Capital Fund (Lottery), the quarter-cent local sales tax
          option (Article 46)'
        - 'South Carolina: Capital Project Sales Tax (CPST), Local Option Sales Tax (LOST), 1% education
          sales tax referenda, ACQ (Anticipation of Capital Qualifications) financing for districts'
        - 'Virginia: VPSA pooled bonds, School Construction Assistance Program (SCAP), Literary Fund loans,
          the new School Construction Fund grants, regional 1% sales tax authority (recently expanded)'
        - Recognizing the program tells you the procurement constraints, the timeline, and often the architect
          already in the picture — every program comes with rules and a default vendor list
      - heading: Federal Capital and the ARPA Tail
        description: 'Federal sources that still matter and the ARPA money still working through the system.

          '
        bullet_points:
        - USDA Community Facilities (loan + grant) — the lifeline for small rural communities
        - FEMA BRIC and HMGP for hazard-mitigation infrastructure; EDA Public Works for economic-development-tied
          capital
        - Congressionally Directed Spending earmarks; DCIP/REPI for military-adjacent jurisdictions
        - 'ARPA tail: SLFRF ''obligated by 12/31/24, spent by 12/31/26'' deadlines are still shaping pursuits
          — projects with ARPA money are racing the clock and the OR who knows the deadlines is invaluable'
      - heading: Reading a Budget Document in Thirty Minutes
        description: 'The qualifying skill that separates a working pursuit from a wasted one.

          '
        bullet_points:
        - 'Where capital lives in a typical NC/SC/VA budget document: capital projects fund, debt service
          fund, special revenue funds — and which is which'
        - 'Funding-source columns and what ''TBD'' or ''future bond'' really mean (often: nothing identified,
          this won''t happen this cycle)'
        - Debt service coverage, legal debt margin, and assigned/unassigned fund balance as readiness
          signals
        - 'Red flags: chronic re-budgeting of the same project, ARPA dependency, declining fund balance,
          growing pension/OPEB liabilities — all signs that the CIP is aspirational, not actionable'
        - The gap between 'in the CIP' and 'appropriated' — why projects sit for years; appropriated is
          real, CIP-listed is intent
      conclusion: 'Funding readiness is the qualifier. A pursuit firm that can read a budget document
        the way a private developer reads a pro forma — and call out the funding gap on the discovery
        call — earns instant credibility with the finance director and protects its own pipeline from
        the projects that will never close. This is a thirty-minute skill that pays for itself every week.

        '
      transition: 'Funding tells you whether the project can happen. Procurement law tells you how it
        has to happen, and that law is different in each of the three states. The next part of the book
        walks through the QBS framework, the state codes, and the solicitation paths that govern every
        dollar of advisory work in NC, SC, and VA.

        '
- title: 'Part Three: Procurement Law and the RFQ/RFP Universe'
  description: 'The legal frame that governs every dollar of municipal advisory work in NC, SC, and VA.
    This part covers the qualifications-based selection regime that reshapes how proposals are written,
    the state-specific procurement codes a firm must speak fluently, the solicitation paths from RFQ to
    cooperative purchasing, and the registration-and-evaluation machinery where most pursuits are quietly
    won or lost.

    '
  sections:
  - title: The Legal Frame
    description: 'QBS, the state codes, and the solicitation paths — the rules of the game.

      '
    chapters:
    - title: Qualifications-Based Selection and the Mini-Brooks Acts
      word_target: 1500
      description: 'All three states require QBS for design professionals — and increasingly for related
        advisory services — meaning price cannot be the primary selection factor. This single legal principle
        reshapes how proposals are written, how fees are negotiated, and when fee discussions are even
        legal to have. Misunderstanding it is the most common rookie mistake of firms entering the public
        sector.

        '
      intro: 'Open with a specific historical moment — the federal Brooks Architect-Engineers Act, passed
        in 1972 in response to a generation of federal A/E procurement disasters where lowest-bid selection
        had produced bad buildings, blown budgets, and a procurement system nobody trusted. Brooks said:
        select on qualifications first, negotiate fee second. Every state that adopted a mini-Brooks did
        so reacting to its own scandals. The QBS regime is not a procedural quirk — it is a fifty-year
        national consensus that buying design like you buy paper towels destroys public buildings.

        '
      chapter_sections:
      - heading: The Brooks Lineage and Why It Exists
        description: 'The history, the rationale, and the practical consequence.

          '
        bullet_points:
        - The federal Brooks Act of 1972 and the procurement-reform movement it launched
        - 'Why QBS exists: the lowest-bid contractor is selected by price; the architect''s value is captured
          pre-bid, in scope and program decisions you can''t second-guess later'
        - The state mini-Brooks statutes as a national consensus — every QBS state is responding to the
          same set of failed projects
        - 'The practical consequence: in QBS solicitations, fee is negotiated post-shortlist, not submitted
          with the proposal — and a firm that submits fee anyway looks unprofessional'
      - heading: QBS in NC, SC, and VA
        description: 'The three state statutes and the shape they each take in practice.

          '
        bullet_points:
        - 'North Carolina: GS 143-64.31 — qualifications-only first, fee negotiation second; the exemption
          thresholds and the practice of staying inside or outside them'
        - 'South Carolina: §11-35-3220 of the Consolidated Procurement Code, with the Materials Management
          Office overlay'
        - 'Virginia: VPPA §2.2-4302.1 and §2.2-4301 definitions of ''professional services'' — VA''s slightly
          broader definitional scope'
        - 'How fee negotiation actually unfolds post-shortlist: scope agreement first, fee proposal second,
          walking-away rights for both sides — and the secondary-candidate fallback if negotiation fails'
      - heading: The Owner's-Rep Gray Zone
        description: 'Whether OR / program management / construction-management advisory falls under mini-Brooks
          — and how to position to be inside the QBS umbrella.

          '
        bullet_points:
        - Does owner's-rep advisory count as a 'professional service' under each state's mini-Brooks?
          The answer varies, and it shapes how the RFQ is written
        - 'When the buyer treats OR as QBS work: typically when the principal is a licensed architect
          or PE, or when the scope explicitly includes ''professional consulting'''
        - 'When the buyer treats OR as price-driven: typically when the scope is described as ''project
          management'' or ''construction management services'' without professional-license framing'
        - 'Positioning move: signal QBS framing in the firm description and the cover letter — ''professional
          consulting services in support of capital project delivery'' beats ''project management services''
          every time fee is at stake'
      - heading: What Changes Inside the QBS Frame
        description: 'How a proposal, an interview, and a fee conversation differ when QBS applies.

          '
        bullet_points:
        - Proposals lead with qualifications, references, and approach — fee is omitted or sealed and
          unopened until shortlist
        - Interviews are about the team, not the price; the firm that brings up fee in the interview signals
          it doesn't understand QBS
        - 'Post-shortlist fee negotiation: scope-then-fee, walking-away rights, the secondary-candidate
          fallback — the OR running this for the jurisdiction is doing core advisory work'
        - 'The insider truth: in QBS, price discipline happens on the buyer side, not at the proposal
          stage — and a buyer running their first QBS process needs an OR who knows what to do post-shortlist'
      conclusion: 'QBS is not a quirk. It is the single most consequential procedural rule in public-sector
        advisory, and a firm that internalizes it — knows when it applies, when it doesn''t, and how to
        position to be inside its protection — operates with a structural advantage over firms that treat
        fee like a private-sector negotiation.

        '
      transition: 'QBS is the federal-and-state principle that frames everything. The next chapter walks
        the actual code — GS 143 in NC, the Consolidated Procurement Code in SC, the VPPA in VA — that
        every pursuit firm has to speak fluently by the third meeting.

        '
    - title: State Procurement Codes — North Carolina, South Carolina, Virginia
      word_target: 2000
      description: 'NC''s GS Chapter 143 and the LGC overlay; SC''s Consolidated Procurement Code and
        the local-ordinance variation; VA''s VPPA and the eVA portal mandate. A firm pursuing three-state
        work has to speak all three by the third meeting, or it stops being taken seriously by the finance
        director and the procurement officer. This is the bilingual minimum.

        '
      intro: 'Open with an analogy from professional baseball. The American League, National League, and
        minor-league baseball all play the same game with three different rule books. The designated hitter,
        the strike zone interpretation, the bullpen rules — all slightly different. A pitcher who comes
        up from AAA and doesn''t know the DH rule embarrasses themselves on the first start. A firm that
        pitches a NC SOQ in a SC procurement, or vice versa, is making the same mistake.

        '
      chapter_sections:
      - heading: North Carolina — GS Chapter 143 and the LGC Overlay
        description: 'NC''s procurement framework, one of the more restrictive in the southeast.

          '
        bullet_points:
        - GS Chapter 143 Article 8 (formal bidding), Article 3D (mini-Brooks); thresholds of $500K formal
          construction, $90K informal, $30K small purchase as of last update
        - HUB (Historically Underutilized Business) goals and verification under NC OSHUB — the participation
          discipline that distinguishes NC pursuits
        - NC Interactive Purchasing System (IPS / eVP) at the state level, plus the rise of OpenGov and
          DemandStar at the local level — the duplication problem
        - LGC pre-approval for debt-financed projects (GS 159) — the unique NC overlay that means every
          debt-funded local project ultimately runs through Raleigh, which is both a procurement timing
          constraint and a public information source
        - E-Verify, Iran Divestment Act, and anti-BDS certifications required on NC contracts — the certs
          that disqualify firms that miss them
      - heading: South Carolina — The Consolidated Procurement Code
        description: 'SC''s centralized framework and the local-ordinance reality.

          '
        bullet_points:
        - Title 11 Chapter 35 architecture and the Materials Management Office's role as the state-level
          overseer
        - 'Local government adoption: which counties and cities adopt the state code by reference vs.
          their own ordinance — and how to tell which applies before you respond'
        - Indefinite delivery contracts, cooperative purchasing, and emergency procurement under SC law
          — the alternatives to a full RFQ cycle
        - The SC Procurement Review Panel and protest procedures — the appellate layer that shapes how
          solicitations are actually written
        - MWBE participation under SC's Small and Minority Business Contracting and Certification Act
      - heading: Virginia — VPPA and eVA
        description: 'The most commercial-feeling regime, and the eVA portal that gates VA pursuit access.

          '
        bullet_points:
        - VPPA architecture (Code of Virginia Title 2.2 Chapter 43) and how localities adopt or supplement;
          the mix of state-level rules and local discretion
        - eVA registration, fees, and the 'eVA-only' solicitation pattern — a firm not registered on eVA
          is invisible to a meaningful share of VA pursuits
        - Public-Private Education Facilities and Infrastructure Act (PPEA) and Public-Private Transportation
          Act (PPTA) — when they unlock alternative procurement paths a private developer's mindset is
          unusually well-suited to
        - Cone of silence rules and ex parte contact restrictions during active solicitations — VA's rules
          are stricter than NC and SC and trip up firms that don't track them
        - Virginia's SWaM (Small, Women-owned, Minority-owned) certification and DBE pass-through requirements
      - heading: What Multi-State Fluency Looks Like
        description: 'The recognition cues that signal you can play in all three leagues.

          '
        bullet_points:
        - 'Cite the right statute on the right call: GS 143-64.31 in NC, §11-35-3220 in SC, §2.2-4302.1
          in VA — and never confuse them'
        - 'Recognize the right portal: IPS/eVP for NC, SC Vendor Self Service for SC, eVA for VA — and
          the local-portal overlay (OpenGov, DemandStar, BidNet, Periscope)'
        - Use the right MBE/HUB/SWaM language for the right state — the certifications don't reciprocate
          cleanly and naming the wrong one signals you're new
        - 'The insider truth: most firms that try three-state work end up de facto specializing in one
          — three-state fluency is a real edge precisely because most peers don''t have it'
      conclusion: 'Three states, three codes, three sets of certs and portals. Most firms specialize in
        one and never really cross over. A CivicDev-style firm that treats three-state fluency as a one-time
        investment — built once, refreshed annually — operates a wider pursuit funnel than its peers and
        absorbs the geographic risk of any single state slowing down.

        '
      transition: 'Knowing the code tells you the rules. The next decision is what kind of solicitation
        the jurisdiction will run — RFQ, RFP, IFB, cooperative, or sole source — because the same firm
        capability gets procured three different ways with three different win economics.

        '
    - title: Solicitation Paths — RFQ, RFP, Cooperative, and Sole Source
      word_target: 1500
      description: 'The same firm capability can be procured through several different solicitation paths,
        each with different win economics and different rules of engagement. Recognizing which path a
        jurisdiction is on — and quietly steering toward the path that favors qualifications over price
        — is a craft skill that separates experienced firms from rookies.

        '
      intro: 'Open with an analogy from a multi-lane highway approaching a major city. The same destination
        has three different on-ramps — the express toll road, the regular interstate, and the surface-street
        alternate. Each takes you to the same place; each costs different amounts of time and money; each
        has its own traffic pattern. The procurement officer picks the lane. But a pursuit firm that knows
        which lane they''re in — and occasionally suggests a better one — gets there faster than the firm
        that just merges.

        '
      chapter_sections:
      - heading: RFQ for Qualifications-Based Selection
        description: 'The dominant path for OR work and how it actually runs.

          '
        bullet_points:
        - 'RFQ for QBS: qualifications, references, proposed team — fee negotiated post-selection, never
          with the proposal'
        - 'Typical timeline: issuance to shortlist 4–6 weeks, shortlist to interview another 2–4 weeks,
          contract award 30–60 days after'
        - 'Common evaluation criteria: relevant experience, key personnel, approach, references, local
          presence, MBE/HUB/SWaM participation'
        - 'The ''reverse-engineering the matrix'' discipline: an evaluation panel always has weights,
          sometimes published, often inferable from the RFQ language'
      - heading: RFP and Sealed Bids
        description: 'When price comes back into the equation.

          '
        bullet_points:
        - 'RFP for non-QBS advisory work: technical and price together, usually weighted (commonly 70/30
          or 80/20 technical/price)'
        - 'IFB / sealed bids: rarely applies to OR services but common adjacent for construction; the
          OR''s job is sometimes to help the buyer write the IFB'
        - Best-and-final offers (BAFOs) where allowed and where prohibited — varies by state and procurement
          type
        - 'The trap of being asked for a ''fee proposal'' on a project that should be QBS: surface the
          question early, ask the buyer to confirm the framework'
      - heading: Cooperative Purchasing — The Quiet Shortcut
        description: 'Piggyback contracts and when they avoid a full procurement.

          '
        bullet_points:
        - 'Cooperative purchasing vehicles: Sourcewell, OMNIA Partners, NCEPP, GSA cooperative — when
          a piggyback contract avoids a full procurement'
        - 'When a small jurisdiction loves a cooperative: when they have urgency, no procurement staff,
          and a project that fits an existing contract scope'
        - 'How a CivicDev-style firm gets onto a cooperative: typically through a partner relationship
          with a national OR firm or A/E that holds the contract'
        - 'The insider truth: cooperative purchasing is the most under-utilized small-jurisdiction tool
          — the firm that helps a manager piggyback rather than run a full RFQ saves them six months and
          earns the relationship'
      - heading: Sole Source and Emergency Procurement
        description: 'The narrow exceptions and how they get used (and abused).

          '
        bullet_points:
        - 'Sole source: when only one firm can provide the service — narrowly construed in all three states,
          and increasingly scrutinized by auditors'
        - 'Emergency procurement: requires a declared emergency; common after a building condemnation,
          fire-loss event, or natural disaster'
        - 'The reputational risk of sole-source advocacy: firms that aggressively push sole-source as
          a workaround develop a procurement-officer reputation that follows them'
        - 'The legitimate sole-source case: continuing services to an in-progress project, where switching
          firms would harm the public interest — defensible and common'
      conclusion: 'Five paths, each with its own economics. The firm that helps a manager pick the right
        path — the path that gets the right firm at the right fee with the right defensibility — is practicing
        program management before the program management contract has been signed.

        '
      transition: 'Knowing the path is one thing. Being eligible to walk it is another. The next chapter
        is about registrations, certifications, evaluation panels, and debriefs — the machinery that turns
        capability into actual contract awards.

        '
    - title: Registrations, Certifications, Evaluation, and the Debrief
      word_target: 1500
      description: 'Most lost pursuits at the small-firm level are lost on missing certs, missing registrations,
        and unread evaluation criteria — not on substance. Building the certification stack once, correctly,
        is a one-time project that unlocks every solicitation in the three-state footprint. And after
        every loss, the debrief is the most valuable free intelligence in the business.

        '
      intro: 'Open with an analogy from international travel and passport control. Most pursuits are lost
        at the border, not the destination. A missing visa stamp, an expired passport, a customs form
        filled out wrong — none of it has anything to do with whether you''d enjoy the country. The traveler
        who arrives at the gate with everything in order has done the boring part well. The traveler who
        shows up with a missing E-Verify cert is not getting on the plane, regardless of how much they
        paid for the ticket.

        '
      chapter_sections:
      - heading: The Registration Stack
        description: 'Build it once, refresh annually, and stop losing pursuits at the door.

          '
        bullet_points:
        - 'State portals: NC IPS / eVP, SC Vendor Self Service, VA eVA — registration mechanics, fees,
          and renewal cycles'
        - 'Local portals: OpenGov Procurement, DemandStar, BidNet, Periscope/mdf — the duplication problem
          and how to manage it'
        - 'HUB / SWaM / DBE / MBE / WBE certifications: when to pursue each, when to partner with a certified
          firm instead, and the reciprocity rules between states'
        - 'Insurance and bonding pre-qualification: COIs, professional liability, fidelity, performance/payment
          bonds — the standing package every procurement officer expects to see'
      - heading: Compliance Certs That Recur
        description: 'The list of one-page disclosures that disqualify you if you miss one.

          '
        bullet_points:
        - E-Verify certifications and the federal-contract overlay; required on virtually every state-funded
          project in NC and VA
        - Iran / Israel / anti-BDS divestment certifications, increasingly required across all three states
        - Drug-free workplace, conflict-of-interest disclosures, lobbying disclosures
        - 'The insider truth: a firm that builds a ''compliance binder'' once and updates it quarterly
          never loses a pursuit on a missing cert — but the firm that handles each cert ad hoc loses three
          a year'
      - heading: Evaluation Criteria and the Reverse-Engineered Matrix
        description: 'Behind every RFQ is a scoring matrix, and reading it before responding is the highest-
          leverage editing pass on any SOQ.

          '
        bullet_points:
        - 'Typical OR/PM evaluation criteria: relevant experience (25–35%), key personnel (20–30%), approach
          (15–25%), references (10–15%), local presence (5–15%), MBE participation (5–15%)'
        - Common weight distributions in NC/SC/VA and how to read them — the RFQ language tells you what
          the panel will weigh
        - Shortlisting and oral interviews — when the panel meets, how long, who attends, what the interview
          matrix looks like
        - 'The MBE/HUB/SWaM section: real participation vs. paper participation, and how panels detect
          the difference (named-firm involvement, scope detail, references for the partner)'
      - heading: The Debrief — Free Intelligence Most Firms Don't Ask For
        description: 'Post-loss debriefs are the highest-yield BD activity in the business.

          '
        bullet_points:
        - The written debrief request within five days of award notice — short, gracious, specific
        - 'What to ask: panel scoring relative to the winner, areas where the firm scored low, suggestions
          for next time'
        - In-person debrief preferred; phone if not — and the discipline of taking notes and filing them
          in the pursuit folder for the next pursuit in the same jurisdiction
        - 'The insider truth: most firms don''t request debriefs because they''re embarrassed to lose;
          the firms that always request them collect the intelligence that makes them harder to beat next
          time'
      conclusion: 'Registrations, certs, and evaluation matrices are the boring part of pursuit. They
        are also the part where small firms quietly hemorrhage opportunities. Build the stack once, refresh
        it annually, reverse-engineer every matrix before responding, and debrief every loss — and a firm
        with no national brand can still consistently shortlist against firms with hundreds of millions
        in revenue.

        '
      transition: 'Knowing the procurement law is necessary but not sufficient. The next part of the book
        moves from horizontal frameworks to vertical knowledge — fire, schools, public safety, courthouses,
        town halls, public works — because every vertical has its own users, its own standards, its own
        buyers, and its own conversations a pursuit firm must be able to hold.

        '
- title: 'Part Four: Vertical Knowledge'
  description: 'The buyer-side knowledge a pursuit firm needs to hold a credible conversation in each
    vertical: fire stations as the anchor vertical, K-12 schools as the largest single bucket of municipal
    capital, public safety campuses as the emerging high-value bundle, courthouses and detention as orientation-only
    specialty work, and town halls / public works / libraries / parks as the under-served sweet spot for
    a small firm building a portfolio.

    '
  sections:
  - title: The Verticals That Pay
    description: 'Each vertical has its own buyer, its own standards, its own conversations — and its
      own economics for a pursuit-phase firm.

      '
    chapters:
    - title: Fire Stations and the Fire-Service Buyer
      word_target: 1500
      description: 'Fire stations are CivicDev''s anchor vertical because of the partner''s credibility
        — a former Raleigh Fire Chief with seven stations built is the single most valuable asset in the
        firm, and it must be deployed deliberately. Understanding how fire chiefs think, what they fear,
        and what makes them pick up the phone is the conversion engine of the firm.

        '
      intro: 'Open with an analogy from surgical residency. The way a young surgeon learns is by shadowing
        a senior surgeon in the OR for years — watching, holding the retractor, eventually closing. The
        training is observational, hierarchical, and built on respect for what the senior knows that the
        resident doesn''t. The fire chief who built seven stations is the senior surgeon. The firm that
        learns alongside him — that doesn''t pretend to know what he knows — earns the trust that the
        firm-without-a-chief can never build, no matter how good its case studies are.

        '
      chapter_sections:
      - heading: The Career Arc of a Fire Chief
        description: 'How chiefs come up, how they think, and what credentials they read on a resume.

          '
        bullet_points:
        - 'The standard career arc in NC/SC/VA: company officer → battalion → assistant chief → chief;
          lateral chief moves between jurisdictions and how they map onto BD opportunities'
        - 'Professional credentials and what each signals: CFO (Chief Fire Officer), EFO (Executive Fire
          Officer), CTO; the fellowship of the credentialed chief'
        - 'Conferences and reading: IAFC, NCAFC, SCSFA, VFCA; Fire Engineering and FireRescue1; the IAFC
          Fire-Rescue International annual conference as the major industry gathering'
        - 'The chief''s daily pain: aging stations, apparatus lead times, staffing, ISO ratings, response
          times, decon/cancer compliance — name the pain in the cover letter and you''re already in the
          conversation'
      - heading: Why the Former-Chief Partner Is Decisive
        description: 'How to deploy the partner''s credibility without making him the only face.

          '
        bullet_points:
        - 'The credibility hierarchy in fire pursuits: former chief on the team beats $2B in private development
          by an order of magnitude'
        - 'Deployment economics: the partner''s calendar is the firm''s most constrained resource, and
          protecting it is a strategic discipline'
        - The 'I've already talked to your peer in [adjacent jurisdiction]' opener — the warm introduction
          that converts cold pursuits into discovery calls
        - 'How to position the partner without making him the only face: he opens the relationship, the
          principal carries the work, the firm builds the institutional knowledge'
      - heading: Volunteer, Combination, and Career Departments
        description: 'How the staffing model changes the project, the budget, and the political dynamics.

          '
        bullet_points:
        - 'Career departments: full-time staff, NFPA 1710 standards, larger budgets, more political scrutiny,
          more sophisticated procurement'
        - 'Volunteer departments: NFPA 1720 standards, smaller budgets, often run by elected fire commissioners,
          board dynamics that look more like a HOA than a city government'
        - 'Combination departments: career officers and volunteer line staff — the most common pattern
          in suburban NC/SC/VA, with the most complex governance'
        - 'How the model changes the project: a career department building a station with a 24/7 dorm
          program is a different building than a volunteer department building a ''social-hall-with-bays''
          station'
      - heading: First Calls and Discovery
        description: 'How to open a fire-chief conversation that earns a second meeting.

          '
        bullet_points:
        - 'The right introduction medium: a peer''s referral, a conference panel attendance, a credentialed
          letter — never a cold LinkedIn message'
        - 'The first-call agenda: ask about call volume, response times, current station inventory, planning
          horizon — and listen for ten minutes before saying anything substantive'
        - 'The ''free deskside review'' offer: the chief brings the data, the firm brings the analysis,
          neither party signs anything — the pre-engagement engagement'
        - 'The insider truth: a fire chief gets one or two cold pitches a week and ignores all of them;
          the firms that get a return call are the ones with a peer-introduced opener and a non-pitchy
          first ask'
      conclusion: 'Fire is the anchor vertical because the partner''s credibility makes the firm decisively
        credible in every fire pursuit it enters. The discipline is to deploy that asset strategically
        — not to try to win every fire pursuit in the southeast, but to win the right ones in the right
        places, with the right relationships in place to compound.

        '
      transition: 'Once a chief is interested, the conversation immediately turns to standards — ISO ratings,
        NFPA response times, accreditation, cancer-prevention design. A pursuit firm that can''t speak
        fluent fire-service standards loses the second meeting. The next chapter is the working vocabulary.

        '
    - title: Fire-Service Standards, Accreditation, and Station Program
      word_target: 1700
      description: 'A pursuit conversation about a fire station is incoherent without fluency in PPC,
        NFPA 1710/1720, and CFAI accreditation. These standards drive station siting, staffing, and program
        — and chiefs use them as the rationale to defend capital requests to councils. On the program
        side, a firm should be able to walk into any chief''s office and discuss bay depth, apparatus
        lead time, and prototype economics in concrete terms.

        '
      intro: 'Open with an analogy from kitchen design. A working professional kitchen is engineered around
        flow — clean food in one direction, dirty dishes in another, raw meat never crossing cooked. A
        station is the same: the dirty zone (apparatus bay, turnout gear, decon) and the clean zone (dorms,
        kitchen, day room) cannot cross, or the firefighters who live there will get cancer in a decade.
        The chief who walks a building plan looks for the flow lines. The firm that doesn''t understand
        them loses the room.

        '
      chapter_sections:
      - heading: ISO and the Public Protection Classification
        description: 'The single most consequential rating in municipal fire service — and the political
          pressure it creates.

          '
        bullet_points:
        - ISO Public Protection Classification (PPC) — Class 1 (best) through Class 10 (no recognized
          service); how the rating drives insurance premiums for every property in the jurisdiction
        - 'How the rating is calculated: 50% fire department (equipment, staffing, training, deployment),
          40% water supply, 10% communications and dispatch'
        - 'The political trigger when a community''s PPC rating drops: insurance premiums spike, homeowners
          call city hall, and the next CIP cycle has a new fire-station line'
        - How a coverage gap (an area more than 5 miles from a station) becomes a station-justification
          document on the chief's desk
      - heading: NFPA 1710, 1720, and CFAI Accreditation
        description: 'The national standards that frame every staffing and response-time argument.

          '
        bullet_points:
        - NFPA 1710 (career) and 1720 (volunteer) response-time and staffing standards — turnout time,
          travel time, total response time
        - 'The flashover science: room-and-contents fires reach flashover in 5–8 minutes, and cardiac
          arrest survival drops 10% per minute without intervention — the data that drives the standards'
        - CPSE/CFAI accreditation and the Standards of Cover document — the credentialing process that
          turns a department into a peer-reviewed institution
        - 'How chiefs use the standards as council-defense material: ''we are out of compliance with NFPA
          1710 in this district'' is a sentence that moves a CIP line'
      - heading: Station Program and the Apparatus Constraint
        description: 'The standard program elements every pursuit firm should know cold.

          '
        bullet_points:
        - Apparatus lead times (currently 3–4 years for engines and ladders) and how they drive station
          scheduling — the building has to be ready when the truck arrives, not before, not after
        - 'Standard program elements: apparatus bays (drive-through vs. back-in, depth and height), day
          room, dorms (gender-neutral trends), kitchen, decon room, turnout storage, EOC/conference, PT/training,
          generator and tower'
        - 'Cancer-prevention design as a current capital driver: hot/warm/cold zones, decon transfer rooms,
          diesel exhaust capture, sealed ventilation between dirty and clean — and the IAFC and NIOSH
          guidance behind each'
        - 'Training facilities: burn buildings (Class A vs. gas-fired), towers, search/rescue props, classrooms
          — the cost ranges and the cost overruns'
      - heading: Prototype and Repeatable Design Programs
        description: 'How sophisticated jurisdictions amortize design across multiple stations.

          '
        bullet_points:
        - 'Prototype programs in the southeast: Chesterfield County VA, Stafford County VA, Raleigh''s
          prototype, Mecklenburg''s standardization, Henrico''s prototypes — what works and what doesn''t'
        - 'The pros: faster delivery, predictable cost, cumulative design refinement; the cons: site adaptation
          overhead, rigidity in non-standard sites, the ''every station looks the same'' political pushback'
        - EMS-only stations and combined fire/EMS — programmatic differences and the staffing-model implications
        - 'The insider truth: a prototype is only as good as the first station built from it; the second
          one fixes the first one''s mistakes, and the third one is finally efficient — most jurisdictions
          stop at one and never realize the savings they were promised'
      conclusion: 'Fluency in PPC, NFPA, CFAI, and station program is the table-stakes vocabulary of fire
        pursuit. A firm that can hold a thirty-minute station-program conversation with a chief — bay
        depth, decon flow, apparatus lead time, prototype trade-offs — has earned the second meeting.
        A firm that can''t holds the first meeting and never the second.

        '
      transition: 'Fire is the anchor. K-12 schools are the largest single bucket of municipal capital
        in the three target states, and the governance is uniquely bifurcated in a way that consistently
        traps unprepared firms. The next chapter walks that bifurcation.

        '
    - title: K-12 Schools — Governance, Funding, and Procurement
      word_target: 1700
      description: 'Schools are the largest single bucket of municipal capital in NC/SC/VA, and the governance
        is uniquely bifurcated: an elected board hires a superintendent who runs the operation, but the
        county or state often controls the capital purse. School capital has its own funding programs,
        its own demographic data, and its own procurement quirks — including statutory design-build authority
        that shifts more scope-definition burden onto the owner, the exact place an OR adds the most value.

        '
      intro: 'Open with an analogy from family finance — the divorced parents paying for college. Mom
        decides which college, applies on the kid''s behalf, signs the FAFSA. Dad signs the check and
        demands itemized invoices. Neither one fully owns the decision; both have veto power over different
        parts of it. The school district is the kid; the school board (often backed by Mom-style elected
        representation) decides the program; the county (Dad) writes the check; nobody fully owns the
        project. The Chief Facilities Officer is the accountant who reads both bank statements and is
        the only one who knows where the money actually went.

        '
      chapter_sections:
      - heading: The Funding Bifurcation by State
        description: 'The split that traps unprepared firms.

          '
        bullet_points:
        - 'North Carolina: county funds capital, district operates; the county-district MOU pattern; LGC
          review of LOBs; the quarter-cent sales tax option (Article 46) and the lottery fund'
        - 'South Carolina: districts can issue 8% debt without referendum; ACQ (Anticipation of Capital
          Qualifications) financing; 1% sales tax referenda for capital'
        - 'Virginia: county funds capital but uses VPSA pooled bonds, SCAP grants, and Literary Fund loans;
          the new School Construction Fund; regional 1% sales tax authority (recently expanded)'
        - 'The insider truth: a pursuit firm that can explain the funding bifurcation in the first meeting
          has already differentiated from 90% of competitors — most pitches treat the school board as
          the buyer, when the county is'
      - heading: The Buyer Is Often the CFO
        description: 'The chief facilities (or chief operations) officer is the actual capital buyer for
          most school advisory work.

          '
        bullet_points:
        - 'The CFO ambiguity: ''Chief Financial Officer'' and ''Chief Facilities Officer'' often share
          the acronym, and a pursuit letter that addresses the wrong one looks careless'
        - 'The facilities CFO''s career path: usually came up through facilities/operations, sometimes
          from facilities engineering, occasionally from the architectural side'
        - 'Conferences and credentials: CASBO/ASBO; NCSBA, SCSBA, VSBA at the board level; NCSSA, SCASA,
          VASS for superintendents'
        - 'Educational specifications (''ed specs''): the program document that determines square footage
          by space type — written by educators, refined by facilities staff, and ignored by architects
          at their peril'
      - heading: Demographics, Capacity, and Redistricting
        description: 'The data that drives every school capital decision.

          '
        bullet_points:
        - Demographic study firms (Cropper GIS, MGT, Western Demographics) and how districts use them
          — the consultants who frame the question before the architect frames the building
        - 'Capacity analysis: building utilization, classroom counts, redistricting risk, the politics
          of consolidating schools'
        - 'Growth-driven capital: the suburban-county pattern of ''we need three new elementaries by 2030''
          that drives the largest single-district pursuit dollars'
        - 'The redistricting trap: a project sized for current attendance zones may be wrong-sized after
          the next redistricting — and redistricting is the politically hardest decision a board makes'
      - heading: Procurement Paths and the Design-Build Trap
        description: 'Why school design-build is more OR opportunity, not less.

          '
        bullet_points:
        - Architect-of-record vs. design-build vs. CMR for schools — when each is statutorily allowed
          in NC/SC/VA
        - Why design-build is being marketed as the faster path — and why it actually shifts more scope-definition
          burden onto the owner
        - 'The OR''s value in design-build: the owner''s voice during pre-RFP scope development, where
          the building is half-defined and the owner has no internal capacity to define the other half'
        - LEED/CHPS/Energy Star, prototype reuse (e.g., Wake County prototypes), and the modular/permanent-modular
          question — the sustainability and economy levers that real school CFOs actually use
      conclusion: 'Schools are bigger, more bifurcated, and more politically charged than fire — and they
        are also the largest single bucket of municipal capital in the three-state footprint. A pursuit
        firm that learns the funding bifurcation, addresses the right CFO, and treats design-build as
        an opportunity rather than a threat operates inside the largest market in the practice.

        '
      transition: 'Fire and schools are the anchor verticals. The next layer up — public safety campuses,
        courthouses, and detention — is where projects get bigger, more politically charged, and more
        dependent on specialty firms. The next chapter is orientation enough to hold a conversation and
        recognize when to pursue and when to subcontract.

        '
    - title: Public Safety Campuses, Courthouses, and Detention
      word_target: 1500
      description: 'Combined public safety campuses are an emerging vertical that bundles fire, police,
        EMS, and emergency management into a single project — bigger, more complex, more politically charged
        than single-use stations. Courthouses and detention are technically demanding, politically sensitive,
        and dominated by specialty firms; CivicDev should pursue them selectively but understand the landscape
        to avoid being out-positioned when an adjacent fire pursuit grows into a public-safety-plus-courthouse
        program.

        '
      intro: 'Open with an analogy from Frankenstein''s laboratory. A combined public safety campus is
        stitched together from four different user groups (fire, police, EMS, emergency management), each
        with its own culture, its own program, its own union, and its own capital priorities. The bolts
        always show. The firm that can speak to all four user groups credibly — and the partner who''s
        already been chief in the largest of them — has an unusual advantage. The firm that pretends it''s
        all one program is the one that produces the disaster.

        '
      chapter_sections:
      - heading: Public Safety Campus Economics
        description: 'Why these projects are growing, what they bundle, and where they start.

          '
        bullet_points:
        - 'Co-location economics: shared training facilities, shared apparatus maintenance, shared admin
          space — the bundle saves capital and operations dollars over a 30-year horizon'
        - 'How these campuses often start as fire pursuits and grow: a fire-station discussion expands
          into ''while we''re at it, can we relocate dispatch?'' — and the project doubles in scope'
        - EOC design (NIMS-compliant, hardened, dual-use) and federal funding pathways — FEMA hazard-mitigation
          grants, EDA economic-development grants, sometimes USDA
        - 911 PSAP standards (NENA i3), redundancy, and the regional consolidation trend that's driving
          multi-jurisdiction PSAP projects in NC and VA especially
      - heading: The Police and Sheriff Side
        description: 'How police capital differs from fire — and why VA''s constitutional sheriff is its
          own buyer class.

          '
        bullet_points:
        - 'Police/sheriff capital programmatic elements: evidence storage, sally ports, holding cells,
          armory, briefing rooms, locker and decon, K-9 facilities'
        - The sheriff vs. chief authority difference, especially in VA where the sheriff is constitutionally
          independent and reports to no one in the local executive chain
        - 'The political weight of sheriff capital projects: a sheriff with a public safety building is
          a sheriff who runs unopposed for re-election'
        - 'The teaming reality: police facilities often involve specialty subs (security consultants,
          evidence-storage specialists) the OR coordinates rather than provides'
      - heading: Courthouses and Jails — The Specialty Lane
        description: 'The technically demanding work dominated by specialty firms.

          '
        bullet_points:
        - NC AOC, SC Court Administration, and VA OES involvement in local courthouses; state-level space
          standards and review authority
        - 'Jail design standards: ACA accreditation, DOJ guidance, NC Jail Standards (10A NCAC 14J), SC
          Jail and Prison Inspection Office, VA Board of Local and Regional Jails'
        - Why specialty firms (DLR, Moseley, HOK Justice, Mosely Architects) dominate — they have the
          security-design expertise, the accreditation experience, and the references
        - Regional jail authorities in VA as a distinct buyer class — multi-county boards with their own
          procurement and their own funding
      - heading: When to Pursue and When to Subcontract
        description: 'The decision rule for selective pursuit in this space.

          '
        bullet_points:
        - 'Pursue when: the project starts as a fire/EMS or PSAP component and the OR can credibly cover
          the program-management layer over multiple specialty subs'
        - 'Subcontract or pass when: the core program is jail or courthouse and the firm doesn''t have
          specialty experience — credibility deficit can''t be papered over'
        - 'The ''small-firm subcontracting opportunity'' under a specialty prime: doing the local owner-coordination
          work for a national specialty firm that doesn''t have feet on the ground'
        - 'The insider truth: courthouse and jail projects are higher-margin but lower-volume than fire
          and schools — for a small firm, they should be opportunistic adds, not a vertical strategy'
      conclusion: 'Public safety campuses are a growth bundle worth pursuing. Courthouses and detention
        are specialty work to be approached selectively, with awareness of where the firm adds value and
        where it would over-extend. Knowing the landscape — even when not pursuing — is the difference
        between losing a fire pursuit because it grew, and winning the bigger pursuit because the firm
        was already credibly positioned for the larger scope.

        '
      transition: 'Fire, schools, public safety. The remaining verticals — town halls, public works, libraries,
        parks — are smaller, less competitive, and exactly suited to a small OR firm building a portfolio.
        The next chapter is the survey of those under-served pursuits and how to win them on responsiveness
        rather than scale.

        '
    - title: Town Halls, Public Works, Libraries, and Parks
      word_target: 1500
      description: 'These verticals are smaller, less competitive, and well-suited to a small OR firm
        building a portfolio. They are also the projects most likely to be under-served by big consultants
        and most likely to be won on relationship and responsiveness rather than scale. A firm that builds
        a steady book in these verticals over five years has compounding case studies and references that
        no national OR firm can match in the same geography.

        '
      intro: 'Open with an analogy from independent filmmaking. A small jurisdiction''s $4M town hall
        is a $4M indie. It will never go to Cannes. The big consultants don''t bid on it; their overhead
        alone exceeds the OR fee. But indie auteurs build their reputations on indies, and small OR firms
        build their books on town halls and library expansions. Three indies in three years is what gets
        you a real Hollywood meeting — three town halls in three years is what gets you the county''s
        $40M public safety campus.

        '
      chapter_sections:
      - heading: Town Halls and Administrative Buildings
        description: 'The political gravity of the room where the council meets.

          '
        bullet_points:
        - 'Programmatic elements: council chambers (with public-meeting AV), clerk and finance space,
          manager''s suite, planning and inspections counters, secure circulation, public-access security'
        - 'The political weight: every council member spends hours per week in this building, and every
          design choice is read as a personal endorsement of someone''s preferences'
        - 'Public-meeting AV and broadcast: the post-COVID upgrade cycle that drove a generation of town
          hall renovations — and continues to drive them'
        - 'The insider truth: a town hall pursuit is a relationship pursuit, not an analytical one — the
          firm that''s been at every council meeting for the prior six months has won before the RFQ issues'
      - heading: Public Works and Maintenance Facilities
        description: 'The unglamorous projects with predictable economics and operationally-focused buyers.

          '
        bullet_points:
        - 'Programmatic elements: vehicle bays (heated/unheated, drive-through), salt and sand storage,
          fuel islands, fleet wash, mezzanines for parts and storage'
        - 'Site requirements that drive cost: site drainage, environmental compliance for fueling, neighbor
          impacts (truck circulation, lights, noise)'
        - 'The buyer: public works director or fleet manager — operations-minded, not glamour-minded,
          and rewarding firms that show up with operations experience'
        - 'Why these projects are under-served: small budgets, technical scope, low political visibility
          — the big firms don''t bother, and the small firm that builds two or three becomes the regional
          specialist'
      - heading: Libraries and the Post-COVID Program Shift
        description: 'Why libraries are not what they were ten years ago — and what that means for capital
          programs.

          '
        bullet_points:
        - 'The post-COVID program shift: makerspaces, broadband-equipped study rooms, community-event
          venues, food-and-beverage policies — libraries have become public-living-room infrastructure'
        - 'Funding sources: state library funding (NC LSTA, SC SCSL, VA LVA grants), local pay-go capital,
          and increasingly federal CDBG money'
        - 'The buyer: library director, often with a strong programmatic vision and limited construction
          experience — exactly the buyer who needs an OR'
        - How a library renovation becomes the entry point to a town's broader capital program — the library
          director knows the manager, and a successful library project becomes a reference call
      - heading: Parks, Recreation, and the Aquatics Question
        description: 'The community-facing capital with the highest visibility per dollar.

          '
        bullet_points:
        - 'Programmatic categories: rec centers, aquatics (the highest cost-per-square-foot of any common
          municipal building type), athletic complexes, greenway and trail infrastructure'
        - 'Grant funding: PARTF (NC), PARD (SC), VLCF (VA) — the dedicated parks funds that shape what
          gets built and where'
        - 'The political visibility: parks projects are the most photographed, most visited, most defended
          public buildings — and the most carefully programmed by elected officials'
        - Water/wastewater plants — flagged here as a different procurement universe (engineering-led,
          SRF-funded) and largely out of scope for an OR firm without an engineering practice
      conclusion: 'Town halls, public works, libraries, and parks are the steady book that builds a portfolio.
        They are smaller, less competitive, and won on responsiveness — exactly where a small, embedded
        OR firm has the structural advantage. The firm that wins three of these in a county over five
        years has the relationships and case studies to win the county''s bigger project when it comes.

        '
      transition: 'Vertical knowledge tells you what to talk about. The pursuit motion is how to actually
        win the work — building the pipeline, qualifying leads, attending the right conferences, writing
        the cold letter, running the discovery call, and turning a shortlist into a signed contract. The
        next part of the book is the operating manual.

        '
- title: 'Part Five: The Pursuit Motion'
  description: 'How to actually win the work — the operating manual for a pursuit-phase firm. This part
    covers lead-pipeline construction, qualification rubrics, the association BD circuit, the cold pursuit
    letter as the firm''s most important written artifact, the first call, the SOQ as the panel-scored
    deliverable, and the references-and-interview discipline that converts shortlisting into a signed
    contract.

    '
  sections:
  - title: Pipeline Through Contract
    description: 'The end-to-end pursuit motion, from the first scrape of a CIP to the post-award debrief.

      '
    chapters:
    - title: Building the Pipeline and Qualifying Leads
      word_target: 1500
      description: 'Pursuit volume is the leading indicator of revenue 18 months out. A disciplined lead-generation
        system — scraping CIPs, tracking bond passages, monitoring RFQ portals across the three-state
        footprint — is the operational backbone of the firm. And a disciplined qualification rubric, applied
        within an hour of identifying a lead, separates pursuits worth a deep-research file from those
        worth only an alert.

        '
      intro: 'Open with an analogy from oil exploration. The reserves under your feet today were laid
        down a hundred million years ago. The reserves you''ll drill in 2027 are visible today in CIPs
        adopted in 2025 and bond referenda passed in 2026. Most firms drill where there''s oil today and
        complain when the well runs dry. The firms that compound run seismic surveys eighteen months out
        — CIP scraping, bond tracking, RFQ alerts — and pull core samples before anyone else has noticed
        the formation.

        '
      chapter_sections:
      - heading: The Sources That Feed the Pipeline
        description: 'Where leads actually come from in NC, SC, and VA.

          '
        bullet_points:
        - 'CIP scraping: which jurisdictions publish, where, and how often they update — most NC counties
          post annually, most VA jurisdictions twice a year, SC varies by ordinance'
        - 'Bond referendum tracking: NC LGC agendas (every debt issuance reviewed in Raleigh), SC State
          Election Commission results, VA bond election calendars'
        - 'RFQ alerts: state portals (IPS/eVP, SC VSS, eVA), local-portal aggregators (OpenGov, DemandStar,
          BidNet, Periscope) — each has gaps the others fill'
        - 'News and Google Alerts: ''capital improvement,'' ''fire station,'' ''school bond,'' ''needs
          assessment,'' ''[county] courthouse'' — the boring keyword discipline that surfaces leads competitors
          miss'
      - heading: The Five-Question Qualifier
        description: 'The disciplined rubric that turns a lead into either a pursuit file or a calendar
          reminder.

          '
        bullet_points:
        - 'Phase: where in the lifecycle is the project, and is it the phase where an OR adds value? (Pre-architect
          = green, post-CD = red)'
        - 'Funding readiness: is money identified, appropriated, or just CIP-listed? (Appropriated = green,
          CIP-listed with TBD source = yellow, no CIP entry = red)'
        - 'In-house capacity: does the jurisdiction have a capital projects manager already? (No = green,
          yes but overloaded = yellow, yes and capable = red)'
        - 'Leadership stability: how long has the manager or chief been there, is a transition imminent?
          (Stable = green, just-arrived or about-to-leave = yellow, vacancy = red+green simultaneously
          — high risk, high opportunity)'
        - 'Fit to firm: project type, size, geography (within 150 mi of Raleigh), competitive landscape
          — the final filter that''s about firm strategy, not project quality'
      - heading: The Pursuit Pipeline Rating System
        description: 'How to score 50 leads in an afternoon and decide which get attention this month.

          '
        bullet_points:
        - 'Tier 1 (real fee plays): in-phase, funded, no in-house capacity, stable leadership, fits firm
          — these get a deep-research file and outreach this week'
        - 'Tier 2 (case-study acquisitions): in-phase but smaller fee, fits firm, strategic geography
          or vertical — these get a watch on the calendar and a measured outreach'
        - 'Tier 3 (skip): out of phase, no funding, in-house capacity, or wrong geography — these get
          filed and revisited only on a trigger (transition, bond, RFQ)'
        - 'The insider truth: most firms have no Tier 3 because they pursue everything; the firms that
          compound are the ones who say no to Tier 3 and put that hour into Tier 1'
      - heading: Pipeline Hygiene as a Daily Discipline
        description: 'The maintenance that keeps the pipeline from going stale.

          '
        bullet_points:
        - 'Weekly review: every Tier 1 and Tier 2 lead gets a five-minute touch — what changed, who moved,
          what''s the next action'
        - 'Monthly purge: leads that haven''t moved in 90 days drop a tier or get filed; the pipeline
          shouldn''t bloat'
        - 'CRM hygiene: every meaningful interaction logged within 24 hours, with notes that the next
          person on the file can read in three minutes'
        - 'The first hour of every Monday: pipeline review, before email, before client work — the discipline
          that separates compounding firms from year-to-year ones'
      conclusion: 'A pipeline is not a list. It is a living system fed by sources, filtered by a qualifier,
        ranked by tier, maintained by weekly discipline. A two-person firm with a real pipeline system
        out-performs a ten-person firm with a list of names. The work is boring. The compounding is enormous.

        '
      transition: 'The pipeline brings leads in. The association BD circuit is where leads turn into relationships
        — and where a small firm that shows up consistently for two years out- punches its weight class.
        The next chapter is the conference and sponsorship strategy.

        '
    - title: The Association BD Universe — Conferences, Sponsorships, and Speaking
      word_target: 1500
      description: 'The NC/SC/VA municipal association ecosystem is the most efficient BD platform in
        the business — every relevant buyer attends one or two of these conferences a year, and the sponsorship
        economics are favorable for a small firm willing to commit. The reader should be a known face
        at six events a year within 18 months. Sponsorship without a relationship strategy is wasted money;
        speaking and panel slots convert better than booths.

        '
      intro: 'Open with an analogy from a hometown bar. The first time you walk in, nobody nods. The third
        time, the bartender recognizes you. The third year, your usual is poured before you order. The
        NCLM annual conference, the VML conference, the SCAC summer meeting — these are hometown bars
        for managers and chiefs. The firm that shows up once is invisible. The firm that shows up six
        events a year for two years has a reputation before any pursuit opens.

        '
      chapter_sections:
      - heading: The Three-State Association Map
        description: 'The associations every CivicDev pursuit firm should know by acronym.

          '
        bullet_points:
        - 'North Carolina: NCLM (League of Municipalities), NCACC (Association of County Commissioners),
          NCCCMA (City/County Management Association)'
        - 'South Carolina: MASC (Municipal Association of SC), SCAC (SC Association of Counties), SCCCMA'
        - 'Virginia: VML (Municipal League), VACo (Association of Counties), VLGMA (Local Government Management
          Association)'
        - 'Cross-state and national for senior-buyer relationships: ICMA, GFOA, APWA, NACo — fewer pursuits
          per dollar of conference attendance, but higher-level relationships'
        - 'Vertical-specific (often higher-converting than the general associations): NC/SC/VA fire chiefs''
          associations, school boards'' associations, school superintendents'' associations'
      - heading: Sponsorship vs. Exhibit vs. Speaking
        description: 'The relative cost and conversion of each tier.

          '
        bullet_points:
        - 'Sponsorship: highest cost, highest visibility, lowest direct conversion — a logo on the conference
          materials creates brand familiarity but rarely a pursuit'
        - 'Exhibit booth: middle cost, moderate visibility, depends entirely on whether the principal
          works the floor for two days straight'
        - 'Speaking and panel slots: lowest direct cost (often free), highest conversion — a thirty-minute
          presentation positions the firm as authoritative in front of exactly the audience it wants'
        - 'The sequence that works: sponsor first to get on the radar, exhibit to get face time, speak
          to convert — and the firms that try to skip from sponsor to speak in year one usually fail to
          land the slot'
      - heading: Strategic Partner Programs
        description: 'The annual relationship buys that some associations sell.

          '
        bullet_points:
        - Strategic partner / corporate partner programs (NCLM, VML, ICMA) — annual commitments that buy
          year-round access, not just conference visibility
        - 'What they actually unlock: introductions to incoming officers, invitations to closed-session
          events, listings in the membership directory, sometimes private dinners with the association
          leadership'
        - 'Pricing tiers: $5K to $50K depending on association and tier — and the discipline of evaluating
          against pursuit conversion at the end of each year'
        - 'The insider truth: strategic-partner ROI is hard to measure on a single pursuit but compounds
          over years; treat it as a brand investment, not a lead-gen line item'
      - heading: Speaking and Panel Strategy
        description: 'How to land a slot and how to use it.

          '
        bullet_points:
        - Co-presenting with a manager or chief — the most reliable way onto a panel; the manager gets
          a national platform, the firm gets a credentialed introduction
        - 'Case-study sessions: pitch the program committee a specific story (a station, a school, a campus),
          not a generic firm overview'
        - 'Lead with the partner: a former-Raleigh-fire-chief panelist gets accepted; a generic OR firm
          doesn''t'
        - The off-program social events (golf tournaments, evening receptions, after-hours dinners) —
          where deals actually move; the conference is the cover, the social is the conversion
      conclusion: 'Six conferences a year for two years is the discipline that turns a pursuit firm into
        a known name. Sponsorship gets you on the radar; speaking gets you the introduction; the social
        events convert the introduction into a relationship. Every dollar spent without a relationship
        plan is a wasted dollar — and every dollar spent with one is a multi-year compounding asset.

        '
      transition: 'The association circuit creates the relationships. The cold pursuit letter is what
        converts a relationship — or a cold lead — into a discovery call. It is the highest- leverage
        written artifact in the entire business, and the next chapter is treated in extended depth.

        '
    - title: The Cold Pursuit Letter — The Firm's Most Important BD Artifact
      word_target: 2000
      description: 'For a small advisory firm with a slow B2G sales cycle, the cold pursuit letter is
        the highest-leverage written artifact of the entire business. A well-calibrated letter to a manager
        or chief can open a 12-month conversation; a generic one is deleted in fifteen seconds. This chapter
        walks the five-paragraph anatomy, the tone calibration by recipient role, the customization research
        discipline, and the templates by recipient type.

        '
      intro: 'Open by laying two real letters side by side — one generic, one localized to a specific
        council vote from the prior month. The generic one starts: "Our firm has extensive experience
        in municipal capital projects across the southeast." The localized one starts: "I noticed your
        council adopted the FY26 CIP at the September 17th meeting, and the new Station 7 line moved up
        two years from the prior plan." The first gets deleted in fifteen seconds. The second gets read
        to the end. Everything else in this chapter is the discipline that produces the second letter
        and never the first.

        '
      chapter_sections:
      - heading: The Five-Paragraph Anatomy
        description: 'The structure that converts cold letters into return calls.

          '
        bullet_points:
        - 'Paragraph 1 — Localization: a specific reference to a recent council action, a CIP line, a
          chief''s announcement — proof you read what they read'
        - 'Paragraph 2 — Recognition of their problem: the specific challenge their jurisdiction faces,
          named in their language, not yours'
        - 'Paragraph 3 — Our specific relevance: not ''we have experience,'' but ''our partner ran your
          peer department in [adjacent jurisdiction] and built seven stations there'''
        - 'Paragraph 4 — Proof: one named project, one named reference, one number (dollar value, schedule,
          or outcome)'
        - 'Paragraph 5 — The ask: a small, low-commitment ask — a fifteen-minute call, a deskside review,
          a meeting at the next conference — never a meeting to discuss a proposal'
      - heading: Tone Calibration by Recipient Role
        description: 'Same firm, four different letter voices.

          '
        bullet_points:
        - 'Manager: deference and brevity; signal that you respect their time and understand they aren''t
          the technical buyer; offer to bring information they can use without endorsement'
        - 'Chief: peer-to-peer credibility, especially with the partner''s name in the second sentence;
          chief-to-chief language, NFPA references, and operational understanding'
        - 'Finance director: numerical precision; specific dollar references, comparable-jurisdiction
          benchmarks, debt-capacity sensitivity; never operational language'
        - 'Elected official: constituent framing; the project''s relevance to the official''s district,
          voters, or stated priorities — and shorter than any other letter type'
      - heading: The Thirty-Minute Customization Research
        description: 'The pre-letter discipline that produces every localization in paragraph one.

          '
        bullet_points:
        - 'Last 6 council meetings: scan the agendas, watch the relevant clips, note any vote that touched
          capital, public safety, or infrastructure'
        - 'Last CIP and current budget: identify the specific project line and its history; note when
          it appeared, when it moved, and what funding source is attached'
        - 'Last newsletter or annual report: pull two phrases the manager or chief uses to describe the
          jurisdiction''s priorities — and use one of them in the letter'
        - 'LinkedIn check: confirm tenure, identify mutual connections, check for recent posts that signal
          current preoccupation'
        - 'The insider truth: thirty minutes of research per letter beats thirty letters of generic outreach
          — measured by return-call rate, the math is not even close'
      - heading: Addressee, Copy List, and Delivery
        description: 'The mechanical decisions that decide whether the letter gets read at all.

          '
        bullet_points:
        - Title-not-name when uncertain ('Dear Manager Smith' or 'Dear Chief Garcia'); name-not-just-title
          when confident in the spelling and current incumbency
        - 'Whom to copy: usually nobody — a manager who sees a copy line to the mayor reads it as a power
          play; rare exceptions only when the introduction is jointly initiated'
        - 'Delivery medium: physical mail beats email by a wide margin for first-touch; email is for follow-up;
          LinkedIn is rarely the right channel for a substantive cold letter'
        - 'The signature block: full name, credential or role, firm, address, phone, email, website —
          and never a generic ''CivicDev Team'' signature on a substantive letter'
      - heading: Red-Flag Research Before Sending
        description: 'The five-minute check that prevents a letter from landing during a scandal or in
          a cone of silence.

          '
        bullet_points:
        - 'Active procurement: a letter sent during a cone of silence on a related solicitation is an
          ethics violation in some states — check the procurement portal first'
        - 'Ongoing litigation, recent scandal, pending recall: a letter that ignores the front-page story
          sounds tone-deaf; either acknowledge it tactfully or wait'
        - 'Recent leadership transition: if the addressee just left or just arrived, the letter has to
          be rewritten with that fact at the top'
        - 'The insider truth: more cold letters fail because of bad timing than because of bad writing
          — five minutes of news search before sending prevents almost all of those misfires'
      conclusion: 'The cold pursuit letter is the firm''s highest-leverage artifact, and the discipline
        of writing it well is the highest-leverage skill the principal can develop. Templates by recipient
        role get the structure right; thirty-minute customization research gets the localization right;
        red-flag research gets the timing right. Get all three right and the return-call rate climbs from
        2% to 15%, and the firm''s pipeline transforms.

        '
      transition: 'A return call is not a contract; it is a discovery call, and the discovery call is
        its own discipline. The next chapter is what to do once the manager or chief actually picks up
        the phone.

        '
    - title: The First Call, Discovery, and Shaping the RFQ
      word_target: 1700
      description: 'A first call that is treated like a private-developer pitch will lose every time.
        The discovery call is a listening exercise designed to surface the buyer''s framing of the problem,
        the political map, and the unspoken decision criteria — and to earn a second meeting, not a contract.
        And the firms that win RFQs are usually the firms that helped scope them — pre-RFQ engagement
        is legal in all three states under specific conditions and converts at multiples of cold response.

        '
      intro: 'Open with an analogy from journalism. The first interview with a source isn''t where you
        file the story — it''s where you let the source tell you what their story is. The reporter who
        walks in with a thesis and steers every question is a reporter who never gets a second call. The
        reporter who listens for thirty minutes, takes notes, and asks one good follow-up gets the source''s
        number and the next exclusive. The pursuit firm''s first call is the first interview — and the
        70/30 listen-talk ratio is journalism''s first rule and pursuit''s, too.

        '
      chapter_sections:
      - heading: The 70/30 Listen-Talk Ratio
        description: 'The fundamental discipline of the discovery call.

          '
        bullet_points:
        - 'Open with an open-ended question, not a pitch: ''Where are you in the CIP cycle?'' or ''How
          are you thinking about the [station/school/campus] right now?'''
        - Spend the first twenty minutes listening, taking notes, asking clarifying questions — never
          offering solutions
        - 'Read the org chart in real time: who else does the buyer mention, who do they defer to, who
          do they frame as a problem — these are clues to the next conversation'
        - 'The insider truth: the firm that wins the second call is the firm whose first call ended with
          the buyer saying ''this was useful'' — never the firm whose first call ended with a proposal'
      - heading: The Opener and the Soft Offer
        description: 'How to position credibility without leading with a sales pitch.

          '
        bullet_points:
        - The 'tell me where you are in the CIP cycle' opener — and the four or five things the answer
          reveals (phase, funding, timeline, in-house capacity, political map)
        - 'The credentialing without pitching: ''I work with [partner] who ran [department] for [years];
          we focus on [type of project] in [region]'' — fact, not promotion'
        - 'The soft offer: a free desk-top review, a memo, a benchmarking conversation — never a proposal
          on call one'
        - 'The ''who else should be in the next conversation'' close: signals respect for the org chart
          and creates the second meeting'
      - heading: Note Discipline and the Post-Call Memo
        description: 'What you do in the hour after the call decides whether you ever get a second one.

          '
        bullet_points:
        - 'Note discipline during the call: full names, dates, dollar figures, project names — quoted
          verbatim, not paraphrased'
        - 'The post-call thank-you within two hours: short, gracious, with one specific reference to something
          the buyer said and a small follow-up commitment (a memo, a peer reference, an article)'
        - 'CRM hygiene: log the call, the next action, the next-action date, and any names that need to
          be added to the contact roster'
        - The 14-day re-touch with the promised follow-up — discipline that converts buyer interest into
          a calendar slot for the second meeting
      - heading: Pre-RFQ Engagement and the Legal Line
        description: 'How to help shape an RFQ without crossing into improper influence.

          '
        bullet_points:
        - 'The legal line in NC, SC, and VA: pre-RFQ engagement is legal until a solicitation is open
          or a cone-of-silence rule is triggered — different in each state, and worth knowing precisely'
        - 'Helpful pre-RFQ artifacts you can offer: scope memos, peer-jurisdiction example RFQs, evaluation-criteria
          suggestions, fee benchmarks — all of which are useful to the buyer and none of which are improper
          if shared in the open-discovery phase'
        - The 'we can help you write the scope' offer — framed as a public-service contribution to a buyer
          who has never written one of these RFQs before
        - Cone-of-silence triggers and when to back away — the moment the RFQ is published, conversations
          end except in formally-noticed pre-bid meetings
        - 'Documenting pre-RFQ contact for later transparency: a note in the file, a copy of the memo
          shared, the date and attendees — protects the firm and the buyer if questions arise later'
      conclusion: 'The first call is a listening exercise; the second call is a credentialing exercise;
        the pre-RFQ engagement is a scope-shaping exercise. None of them is a pitch. A firm that treats
        the discovery process as listening-and-helping rather than selling-and-closing wins more pursuits
        at lower acquisition cost than any firm that treats every call as an opportunity to close.

        '
      transition: 'Eventually, the discovery becomes an RFQ, and the RFQ requires a written response.
        The SOQ is the artifact the evaluation panel actually scores — and a craft-level SOQ is the difference
        between shortlisted and discarded.

        '
    - title: The SOQ and Proposal Package
      word_target: 1500
      description: 'The SOQ is the artifact the evaluation panel actually scores. Every formatting choice,
        every key-personnel sheet, every project sheet, every fee structure is downstream of the evaluation
        matrix. A craft-level SOQ is the difference between shortlisted and discarded, and the discipline
        of producing one consistently is what separates a pursuit firm from a firm that occasionally bids.

        '
      intro: 'Open with an analogy from a college application. An admissions officer reads two hundred
        applications a week. Every application has the same components — transcript, test scores, recommendations,
        essays, extracurriculars, the cover letter. The applicants who get in are not the ones with the
        most prestigious credentials; they are the ones whose packets cohere — whose essays match their
        extracurriculars, whose recommendations reinforce their narrative, whose transcript is the predictable
        result of the story the cover letter tells. The SOQ is a college application. The panel is the
        admissions officer. The components are the same. The discipline is in the coherence.

        '
      chapter_sections:
      - heading: The Standard SOQ Structure
        description: 'The components every public-sector SOQ contains and why each matters.

          '
        bullet_points:
        - Cover letter, executive summary, firm profile, team and key personnel, relevant experience,
          approach, references, fee (where allowed), required forms
        - 'Cover letter as the panel''s first impression: localized, specific, signed by the principal,
          never longer than one page'
        - 'Executive summary as the second impression: three to five sentences naming the project, the
          firm''s specific relevance, and the team''s specific qualifications'
        - 'Forms section: the boring required disclosures and certifications — but the section that disqualifies
          firms that miss one'
      - heading: Project Sheets and the One-Page Architecture
        description: 'The page that does more SOQ work than any other.

          '
        bullet_points:
        - 'The one-page project sheet structure: project name and location, the firm''s specific role,
          dollar value, dates, photographs, named references, outcome metrics'
        - 'Photographs vs. data: a photograph anchors recognition, but the data — square footage, schedule,
          cost-per-SF — does the credentialing'
        - 'Role specificity: ''we managed the OAC, the GMP negotiation, and the closeout'' beats ''we
          provided owner''s-rep services'''
        - 'The insider truth: panels read project sheets first, before the approach narrative; a firm
          with three good project sheets out-performs a firm with two great ones and four mediocre ones'
      - heading: Key Personnel and the Public-Sector Resume
        description: 'How to write a resume that signals public-sector experience.

          '
        bullet_points:
        - 'The public-sector resume style: project list with role, dollar value, and dates — chronological,
          dense, fact-based, no narrative'
        - 'Credential ordering: licenses, certifications, professional memberships — in the order the
          panel will read them'
        - 'Education and prior employment: brief; the panel cares about projects delivered, not academic
          credentials'
        - 'How the partner''s resume should look: every fire station built, with year, jurisdiction, and
          dollar value — the asset list as the credential'
      - heading: Approach, References, and MBE/HUB/SWaM
        description: 'The narrative sections that signal practitioner depth.

          '
        bullet_points:
        - 'Approach narrative: phase-by-phase methodology specific to the project at hand, never boilerplate;
          the panel detects boilerplate in three sentences'
        - 'References: cultivated relationships, not just names — the panel often calls, and an unprepared
          reference is worse than no reference'
        - 'MBE/HUB/SWaM section: real participation vs. paper participation; named partner firms with
          specific scope, not ''we will identify a partner'' filler'
        - 'The insider truth: the approach narrative is where most SOQs lose — generic, buzzword-laden
          text that any firm could have written; a specific, opinionated, project-grounded approach narrative
          wins shortlist slots'
      conclusion: 'The SOQ is the panel''s primary input. Every component should reinforce the others;
        every page should signal that the firm has done this work before; every project sheet should answer
        a question the panel is about to ask. Coherence wins. Boilerplate loses. The discipline of producing
        coherent SOQs consistently is what builds a shortlist record.

        '
      transition: 'The SOQ gets you shortlisted. References and the interview win the contract. The next
        chapter is the discipline of converting a shortlist into a signed contract — and the debrief discipline
        that turns every loss into the next win.

        '
    - title: References, the Interview, and the Debrief
      word_target: 1500
      description: 'Shortlisting gets you in the room; references and the interview win the contract.
        Reference quality is a leading indicator of firm health, and interview craft is a separate skill
        from proposal writing. Post-decision debriefs are the most valuable free intelligence in the business,
        and a firm that systematically debriefs every decision — win or loss — compounds its win rate
        over years.

        '
      intro: 'Open with an analogy from a Broadway audition. The first round is the open call — the SOQ.
        The second round is the callback — the interview. By the callback, everyone in the room can sing;
        the question is whether you can take direction, work with the ensemble, and bring something the
        casting director hasn''t seen yet today. Most firms prepare the SOQ obsessively and walk into
        the interview underprepared. The firms that win do the opposite.

        '
      chapter_sections:
      - heading: Reference Cultivation
        description: 'How references are made and maintained — long before any panel calls.

          '
        bullet_points:
        - 'When to call your references: the day the SOQ is submitted, never sooner — and brief them on
          the specific project, the panel composition, and the questions likely to come'
        - 'What to brief them on: the firm''s specific role on the prior project, the outcome you want
          them to remember, the named questions to expect'
        - 'How often to rotate them: every reference call is a depletion of goodwill; rotate so no single
          reference gets called more than three times a year'
        - 'The insider truth: a great reference talks for ten minutes about a specific moment on a specific
          project; a generic reference says ''they were professional and we were happy'' — panels detect
          the difference instantly'
      - heading: Interview Preparation
        description: 'The discipline that separates rehearsed teams from improvising ones.

          '
        bullet_points:
        - 'Panel composition research: who is in the room, what do they care about, what is each panelist''s
          likely concern — the 30-minute pre-interview audit'
        - Room layout, AV expectations, opening and closing statements — and the discipline of practicing
          the opening out loud the morning of the interview
        - The 'what would you do week one?' question and how the principal should answer it (covered in
          detail in the Week One chapter)
        - 'Q&A discipline: who answers what, when to defer to the SME, how to recover from a missed question
          — and the discipline of ending each answer on time, not running long'
      - heading: The Interview Itself
        description: 'The room dynamics, the body language, and the closing question.

          '
        bullet_points:
        - 'Opening statement: 90 seconds, principal-led, names every panelist''s likely concern in the
          first sentence'
        - 'Body language and seating: the partner sits on the principal''s right; the SME on the left;
          the analyst takes notes and never speaks unless directly asked'
        - The closing question — 'What would make us your top choice?' — and how to read the answer in
          real time
        - 'The send-off: a single specific commitment (''I''ll send the references'' contact info by 5pm'')
          and a thank-you within an hour'
      - heading: The Debrief — Every Decision, Every Time
        description: 'The free intelligence most firms don''t ask for.

          '
        bullet_points:
        - The written debrief request within five days of decision — short, gracious, specific, regardless
          of win or loss
        - 'What to ask: scoring relative to the winner, areas where the firm scored low, suggestions for
          next time, panel composition for the next pursuit'
        - In-person preferred, phone if not — and the discipline of taking notes and filing them in the
          firm's pursuit-research system for the next pursuit in the same jurisdiction or with the same
          panel members
        - 'The insider truth: debriefing wins is as valuable as debriefing losses — the panelists tell
          you what you did right, and that''s the playbook for the next pursuit'
      conclusion: 'Shortlisting is a writing exercise; the interview is a performance exercise; the debrief
        is an intelligence exercise. A firm that masters all three converts shortlist slots into contracts
        at a noticeably higher rate than peers and compounds its institutional knowledge with every decision,
        win or loss.

        '
      transition: 'The pursuit motion ends with a signed contract. But before any of this works as a business,
        the firm has to know how to price, how to position, and how to staff itself. The next part of
        the book is about the firm — the pricing economics, the credibility hierarchy, the staffing order,
        and the infrastructure that makes a small firm look like the right firm.

        '
- title: 'Part Six: Pricing, Positioning, and the Firm'
  description: 'The economics and architecture of a CivicDev-style firm — how municipalities expect to
    see fees, how to position credibility against bigger competitors, how to convert early wins into the
    next pursuit, who to hire in what order, and the research and credibility infrastructure that makes
    a two-person firm look like the right firm. This part is about the business behind the pursuits.

    '
  sections:
  - title: The Firm Behind the Pursuits
    description: 'Fees, positioning, case studies, staffing, and infrastructure — the operating reality
      of a firm built to compound.

      '
    chapters:
    - title: Fee Structures and Benchmarks
      word_target: 1500
      description: 'Municipalities expect fees in formats they recognize, and a fee proposal that doesn''t
        match the buyer''s mental model creates friction even when the number is right. This chapter walks
        the four canonical fee formats, the QBS rules about when fee can even be discussed, the reimbursable
        conventions, and the benchmarks for needs assessments, program management, CM advisory, and full
        owner''s-rep work in NC/SC/VA.

        '
      intro: 'Open with an analogy from a restaurant menu. A prix fixe with three courses, an à la carte
        with everything separately priced, a tasting menu with a chef-decides number — all describing
        the same kitchen, all signaling something different about what kind of meal you''re about to have.
        A confusing menu loses the table before the food arrives. A fee proposal in the wrong format loses
        the contract before the panel reads the substance. The format is the menu; the format has to match
        what the buyer is used to ordering.

        '
      chapter_sections:
      - heading: The Four Canonical Fee Formats
        description: 'What public buyers expect to see and when each format fits.

          '
        bullet_points:
        - Percentage of construction value — the dominant format for full-scope owner's-rep on a defined
          project; familiar to the panel, easy to compare across firms
        - Lump sum by phase — common for needs assessments and pre-design advisory; familiar to finance
          directors who like a fixed line item in the budget
        - Hourly with not-to-exceed (NTE) — the format procurement officers prefer for indefinite-scope
          work; favored on smaller advisory engagements where scope is genuinely uncertain
        - Hybrid (fixed + hourly + reimbursable) — the format for complex multi-phase contracts where
          some scope is well-defined and some is not; the most common shape for program management contracts
      - heading: QBS and the Timing of Fee Conversations
        description: 'When fee can be discussed, when it can''t, and the post-shortlist negotiation reality.

          '
        bullet_points:
        - Under mini-Brooks QBS, fee is negotiated post-shortlist — the proposal contains qualifications,
          the negotiation contains fee
        - 'The ''sealed fee envelope'' practice in some jurisdictions: fee submitted with the SOQ but
          not opened until shortlist; signals procurement-officer caution and rewards format compliance'
        - 'The fee-negotiation choreography: scope agreement first, then fee proposal, then walking-away
          rights for both sides — and the secondary-candidate fallback if negotiation fails'
        - 'The insider truth: a firm that volunteers fee mid-pursuit on a QBS solicitation telegraphs
          that it doesn''t understand the framework — even if the buyer asks, the right answer is to defer
          until the post-shortlist conversation'
      - heading: Reimbursable Conventions
        description: 'The line items that get marked up, the ones that don''t, and the boundary cases.

          '
        bullet_points:
        - Mileage at the IRS rate, lodging at GSA per diem, meals at the GSA M&IE rate — the public-sector
          defaults a private developer rarely thinks about
        - 'What''s typically reimbursable: travel, printing, third-party services explicitly authorized,
          specialty consultants beyond the named team'
        - 'What''s typically not: standard office overhead, internal printing, principal-level travel
          within the home region, technology fees beyond a defined cap'
        - 'Markup conventions: 0% on direct expenses is the public-sector default; 10% is the upper limit
          most jurisdictions accept; anything above signals an unsophisticated proposal'
      - heading: Benchmarks by Service Type
        description: 'The numbers a finance director will compare against — written here so they aren''t
          a surprise on the negotiation call.

          '
        bullet_points:
        - 'Needs assessments: $30K–$150K lump sum depending on project type, geography, and depth of stakeholder
          engagement'
        - 'Program management: 1–3% of total program construction value, typically capped or hourly NTE
          structured'
        - 'CM advisory and pre-construction support: 3–5% of construction value, depending on whether
          the firm runs the GMP process'
        - 'Full owner''s-rep through occupancy: 4–7% of construction value, with smaller-project floors
          (typically a $50K–$100K minimum on projects under $10M)'
        - 'The insider truth: most jurisdictions have one or two prior fee data points they compare against;
          a finance director who saw 4.5% on a comparable project will negotiate against that anchor regardless
          of scope differences'
      conclusion: 'Format matches the menu the buyer is used to ordering from. QBS rules govern when fee
        can be discussed at all. Reimbursable conventions are public-sector defaults a private developer
        has to learn. And benchmarks are anchors the buyer brings to the negotiation before the firm has
        said a word. A firm that knows all four wins fee negotiations on substance, not on bluffing.

        '
      transition: 'Pricing is one half of the firm''s external face. Positioning — how the firm explains
        who it is and why it should be hired — is the other. The next chapter is about the credibility
        hierarchy and the structural challenge of convincing a public buyer that a private developer''s
        credentials are relevant at all.

        '
    - title: Positioning and the Credibility Hierarchy
      word_target: 1500
      description: 'CivicDev''s positioning challenge is structural: a private developer with $2B in private
        construction is less credible to a public buyer than a former assistant city manager with none.
        This chapter walks the credibility hierarchy as municipal buyers actually rank it, the ''we are
        your capital projects team'' frame that converts the firm''s actual capability into language the
        buyer recognizes, and the counter-positioning moves against the bigger owner''s-rep firms and
        against architects encroaching on the same scope.

        '
      intro: 'Open with an analogy from medical credentialing. A surgeon who''s done a thousand procedures
        at a private hospital does not have privileges at the next hospital simply because the procedures
        were the same. Credentials don''t transfer; the hospital''s committee re-evaluates against the
        standards of its own institution. CivicDev is a private surgeon applying for public-hospital privileges.
        The $2B portfolio is the private-hospital case log. The committee — the manager, the chief, the
        procurement officer — wants to see public credentials. The partner is the public credential.

        '
      chapter_sections:
      - heading: The Credibility Hierarchy as Buyers Actually Rank It
        description: 'The order public buyers trust, ranked from highest to lowest credibility.

          '
        bullet_points:
        - 'Tier 1: former public-sector executives (city manager, fire chief, superintendent) — highest
          credibility, directly transferable, panel-defensible'
        - 'Tier 2: long-time public-sector consultants with named projects in the geography — credible,
          with the right references, especially in the same vertical'
        - 'Tier 3: private-sector developers and contractors with public-sector experience — credible
          only if the public-sector experience is named and recent'
        - 'Tier 4: private-sector experts with no public-sector resume — credible only when introduced
          by a Tier 1 or Tier 2; standing alone, panels discount the experience as ''not applicable'''
        - 'The insider truth: $2B in private development is a fact the firm should reference, but it should
          never be the headline credential — the headline is always the partner''s public-service career'
      - heading: The 'We Are Your Capital Projects Team' Frame
        description: 'The positioning sentence that replaces ''we provide owner''s-rep services'' in every
          pursuit conversation.

          '
        bullet_points:
        - 'The frame: ''We are the capital projects team you would have hired if you had the budget for
          one full-time'' — a frame that names the buyer''s actual gap'
        - 'Why this beats ''owner''s-rep services'': it positions the firm as in-house capacity, not vendor;
          the buyer hears it as ''staff,'' not ''consultant'''
        - 'How the frame translates into scope: program management, A/E selection, GMP review, OAC chairing,
          board reporting — the work an in-house director would do'
        - 'Why small jurisdictions especially respond to this frame: they actually need the capacity,
          can''t afford to hire it, and have been told by big consultants they''re too small to matter'
      - heading: Counter-Positioning Against Bigger OR Firms
        description: 'How to win against the national OR firms in jurisdictions where they bid.

          '
        bullet_points:
        - 'Local presence and responsiveness: the principal who can be at city hall in 90 minutes vs.
          the national PM who flies in monthly'
        - 'Cost: a 1.5% program management fee is a meaningful saving against a 2.5% national-firm fee
          on a $30M program'
        - The 'one client at a time' commitment vs. the national firm running multiple programs simultaneously
          — and the implicit risk that comes with shared attention
        - 'The insider truth: national OR firms have a hard time pretending to care about a $4M small-jurisdiction
          project; the small firm that genuinely cares — and shows up to every council meeting — wins
          on signal'
      - heading: Counter-Positioning Against Architects on Adjacent Scope
        description: 'How to compete with A/E firms expanding into needs-assessment and program-management
          scope.

          '
        bullet_points:
        - Architects are increasingly pitching needs assessments and program management as part of their
          A/E scope — a real competitive threat to a CivicDev pursuit
        - 'The owner-side independence argument: an architect''s needs assessment is the architect''s
          program; an owner-side assessment is the owner''s program — different documents, different politics'
        - 'The ''we are not the architect of record'' framing: the firm provides oversight without the
          conflict of interest of the firm that designed the building'
        - 'Why this matters most on QBS-procured A/E selections: an owner-side OR running the A/E selection
          process is a different kind of credibility than an OR who is also bidding on the design'
      conclusion: 'CivicDev''s positioning challenge is structural and durable: public buyers rank credibility
        by public-sector resume, not portfolio dollar value. The firm wins by leading with the partner''s
        career, framing the offering as ''in-house capacity,'' counter-positioning on local presence and
        independence, and never confusing private-sector credentials with public-sector credentials. Get
        the positioning right and the rest of the pursuit motion gets easier; get it wrong and every pursuit
        is uphill.

        '
      transition: 'Positioning explains who the firm is. The case study explains what it has done — and
        in the early years of the firm, the case study problem is acute, because the firm''s most relevant
        work hasn''t happened yet. The next chapter is the case-study and first-win economics that bridge
        the early-firm credibility gap.

        '
    - title: Proof Points, Case Studies, and First-Win Economics
      word_target: 1500
      description: 'In a small new advisory firm, every public-sector engagement is two products: the
        service, and the case study that makes the next pursuit easier. The first three to five wins are
        disproportionately valuable because they convert the firm from ''pre-revenue startup'' to ''firm
        with public-sector references.'' This chapter walks the public-sector one-pager case study, the
        reference cultivation discipline, and the first-win pricing math — and the thought-leadership
        substitutes that bridge the gap before the first public-sector reference exists.

        '
      intro: 'Open with an analogy from acting. A first credit on IMDb is worth more than a last twenty
        in another genre — the casting director who pulls up your page reads the credits chronologically
        by relevance, and one named role in a real production beats two decades of regional theater. Three
        small public-sector wins are worth more than $2B in private development for the next pursuit.
        The asymmetry is brutal in year one, because the first public credit hasn''t happened yet; that''s
        why the first win, regardless of fee, is the most valuable contract the firm will ever sign.

        '
      chapter_sections:
      - heading: The Public-Sector One-Pager
        description: 'The case-study format that anchors every future SOQ.

          '
        bullet_points:
        - 'Anatomy of the case-study one-pager: project name and jurisdiction, dollar value, dates, role
          specificity, photographs, named references, outcome metrics'
        - 'Photographs vs. data: a photograph anchors recognition, but the data — square footage, schedule,
          cost-per-SF, contingency-burndown rate — does the credentialing'
        - 'Role specificity: the panel detects vague language (''we provided services'') in three sentences;
          specific verbs (''we ran the OAC, negotiated GMP, managed the closeout'') signal practitioner
          depth'
        - 'Outcome metrics worth naming: schedule (delivered Q3 vs. Q4 plan), budget (under by 3.2%),
          contingency (returned 1.8% to the owner) — numbers the next panel will recognize'
      - heading: Reference Cultivation as a Multi-Year Asset
        description: 'How references are made and maintained beyond the contract.

          '
        bullet_points:
        - Cultivation begins on day one of the engagement, not at closeout — every interaction with the
          buyer is a deposit in the reference account
        - 'The 30-60-90 cadence post-occupancy: a thank-you at 30 days, a check-in at 60, a ''how''s the
          building performing'' at 90 — and a transition to alumni tracking after that'
        - 'Alumni tracking: where did the manager / chief / superintendent go next? — because the reference
          travels with them, and the next jurisdiction is the next pursuit'
        - 'Reference rotation: every reference call is a depletion of goodwill; rotate so no single reference
          is called more than three times a year'
      - heading: First-Win Pricing Math
        description: 'The discipline of discounting fee without discounting product.

          '
        bullet_points:
        - 'What to discount: schedule (faster delivery), scope (deeper engagement), payment terms (later
          milestones), travel (absorbed) — anything that doesn''t visibly degrade the work product'
        - 'What never to discount: fee billed against the construction-value benchmark, which the next
          jurisdiction will see and anchor against; once a 1.5% fee is in the public record, it''s the
          new ceiling'
        - 'The first-win contract clause: a publicity-and-reference clause that obligates the buyer to
          be a reference for two years and allows the firm to publish the case study'
        - 'The insider truth: the first contract should be priced for case-study-acquisition, not for
          cash flow; the math justifies a 30–50% effective discount in year one if it produces three referenceable
          wins'
      - heading: Thought Leadership as the Pre-Reference Bridge
        description: 'What a firm publishes, presents, and writes when the case studies haven''t happened
          yet.

          '
        bullet_points:
        - Articles in trade publications (American City and County, the state-association magazines, Fire
          Engineering for the partner) — credentialing without a reference
        - Conference presentations and panels — covered in the BD chapter, but worth noting again as a
          case-study substitute in year one
        - 'Open-source publications: a ''state of municipal capital in the southeast'' annual report,
          distributed free, that positions the firm as a resource'
        - 'LinkedIn discipline: substantive posts that get shared by managers and chiefs the firm has
          met — the credentialing layer that operates between conferences'
      conclusion: 'The first three to five contracts are worth more for what they produce than for what
        they pay. A firm that prices accordingly — that treats the first wins as case-study acquisitions,
        that cultivates references like multi-year assets, and that publishes thought leadership in the
        gap before the references exist — escapes the first-year credibility trap and starts compounding
        by year two. A firm that prices the first wins like the tenth wins gets stuck.

        '
      transition: 'Case studies and references are the firm''s external face. The team behind that face
        is what actually delivers the work, and the order in which a small firm hires defines what it
        can credibly pursue. The next chapter is the staffing economics of the pursuit-phase firm.

        '
    - title: Staffing the Pursuit-Phase Firm
      word_target: 1500
      description: 'The pursuit-phase firm has different staffing economics than a project-phase firm.
        Hiring order, 1099 vs. W2 calculus, and the scarcity of practitioners willing to leave public
        service for private advisory all shape what a firm can credibly pursue and at what scale. This
        chapter walks the canonical roles and the order in which a firm should fill them.

        '
      intro: 'Open with an analogy from a pre-revenue startup. The first hire at a pre-revenue startup
        is the salesperson, not the engineer — because there''s nothing to engineer until there''s a customer
        to serve. The first hire at a pursuit-phase advisory firm is the originator, not the project manager
        — because there''s nothing to manage until there''s a contract to deliver. Most professional-services
        firms invert this order, hire delivery talent first, and then wonder why the pipeline is empty
        in year two.

        '
      chapter_sections:
      - heading: The Five Canonical Roles
        description: 'The roster of the pursuit-phase firm and the function each performs.

          '
        bullet_points:
        - 'Principal / originator: the firm''s face on first calls, primary author of pursuit letters,
          the relationship owner — the one role that can''t be outsourced'
        - 'Technical project lead / construction expert: the practitioner who can hold a credible OAC,
          talk GMP economics with a CMR, and ground the firm''s pursuit claims in delivery experience'
        - 'Subject-matter expert / partner: the credentialed former public-sector executive — fire chief,
          manager, superintendent — whose name opens doors the principal can''t open alone'
        - 'Schedule and cost analyst: the role that produces every estimate, schedule, and financial deliverable
          — often a long-tenured analyst, sometimes a 1099 specialist'
        - 'Pursuit research analyst: the role that maintains the pipeline, runs the qualification rubric,
          drafts the deep-research files, and feeds every pursuit letter — often a younger generalist,
          increasingly LLM-augmented'
      - heading: The Hiring Order
        description: 'Who joins first, who can be 1099, who has to be W2.

          '
        bullet_points:
        - Principal and partner first — the firm doesn't exist without them, and they should never be
          1099
        - Pursuit research analyst second — the highest-leverage hire after the founders; produces the
          pipeline that justifies every later hire
        - Technical project lead third — typically W2 once recurring revenue covers the salary, often
          1099 in the bridge period
        - Schedule and cost analyst as a 1099 specialist — the role with the most clearly defined deliverables
          and the easiest to engage flexibly
        - 'The insider truth: most small firms hire delivery talent first because it''s familiar; the
          firms that compound hire pursuit talent first because it builds the engine'
      - heading: 1099 vs. W2 Calculus
        description: 'The economics that shape the team''s actual structure.

          '
        bullet_points:
        - '1099 advantages: variable cost, specialized expertise on demand, no long-term commitment —
          fits the irregular cadence of pursuit work'
        - '1099 risks: shared attention with other clients, IP and confidentiality concerns, perception
          by buyers who want to know ''is this person actually on your team'''
        - 'W2 advantages: dedicated capacity, brand alignment, easier panel-facing presentation — and
          the IRS line that treats consistent work as employment'
        - 'The decision rule: anyone whose name appears on an SOQ as ''key personnel'' should ideally
          be W2 by the second pursuit; 1099 is fine for analysts, specialists, and named subs but creates
          panel skepticism for principals'
      - heading: The Scarcity Problem
        description: 'Why the right hires are hard to find, and what to do about it.

          '
        bullet_points:
        - 'The talent pool: former public-sector practitioners willing to leave pension-track careers
          for private advisory is small, and the small firm competes for them with national OR firms'
        - 'The 1099 retired-executive pattern: many credentialed practitioners want flexible engagements,
          not full employment — and a 1099 chief or assistant manager can still anchor an SOQ'
        - 'The MPA fellowship pathway: hiring directly from MPA programs (UNC, VCU, Clemson) for the pursuit
          research role — younger, hungrier, public-administration-fluent'
        - 'The insider truth: the firm''s bench is its long-term competitive moat; a year spent recruiting
          one good hire is a year better spent than a year of pursuit volume'
      conclusion: 'A pursuit-phase firm hires for pursuit before it hires for delivery, treats the partner
        as a non-negotiable Tier 1 credential, leans on 1099 specialists where the work is clearly bounded,
        and converts to W2 when the recurring revenue justifies it. The bench is the moat. The order matters.

        '
      transition: 'Staffing tells you who is on the team. The infrastructure — research operations, the
        office address, the COIs, the website, the LinkedIn presence — tells the buyer whether the team
        is real. The next chapter is the credibility infrastructure that does the quiet work of making
        a small firm look like the right firm.

        '
    - title: Research Operations and Credibility Infrastructure
      word_target: 1700
      description: 'The practical infrastructure that makes a small firm look like a real firm: the LLM-
        assisted research workflow that lets a two-person team match the pursuit volume of a ten-person
        team, the file system that stores every CIP and budget summary in retrievable form, the Raleigh
        address that anchors regional credibility, the COIs and standing package every procurement officer
        expects, and the website-and-LinkedIn hygiene that survives a panel''s pre-interview Google search.

        '
      intro: 'Open with an analogy from baseball analytics. The Moneyball-era Oakland A''s outworked their
        budget by industrializing scouting — sabermetrics turned amateur observation into a system. CivicDev''s
        pursuit research is the firm''s Moneyball edge: LLM-assisted CIP-and-budget summarization, deep-research
        files on every Tier 1 lead, rating systems that turn fifty leads in an afternoon into ranked priorities.
        The Raleigh address, the standing COIs, the website with full bios — those are the uniforms. They
        don''t win games, but you can''t take the field without them.

        '
      chapter_sections:
      - heading: LLM-Assisted Research as the Volume Multiplier
        description: 'How a two-person firm matches a ten-person firm''s pursuit volume.

          '
        bullet_points:
        - 'CIP and budget summarization: structured prompts that turn a 200-page budget document into
          a five-bullet readiness summary in fifteen minutes'
        - 'FOIA request drafting and response review: templates by state, fast turnaround on records-request
          mechanics, structured extraction from response packets'
        - 'Deep-research file template: a one-page-per-jurisdiction structure (form of government, leadership,
          CIP, recent council actions, fiscal posture) refreshed quarterly'
        - 'Pursuit letter localization: the thirty-minute customization research compressed to ten minutes
          with structured prompts feeding the principal''s draft'
        - 'The insider truth: LLM-assisted research is not a replacement for the partner''s judgment —
          it''s a multiplier on the partner''s time, freeing the principal to spend hours on the pursuits
          that matter rather than minutes on the ones that don''t'
      - heading: The Pursuit Operations System
        description: 'The internal operating discipline that keeps the pipeline coherent.

          '
        bullet_points:
        - 'Pipeline rating system in a CRM: tier (1/2/3), phase, funding, leadership, fit — refreshed
          weekly, archived quarterly'
        - 'Pursuit folders: one folder per Tier 1 and Tier 2 lead, with deep-research file, RFQ tracker,
          draft letter, post-call notes, and decision log'
        - 'The weekly pipeline review: every Monday, before email, before client work — the ritual that
          protects strategic time'
        - 'The monthly purge: leads that haven''t moved drop a tier or get filed; the system stays manageable
          rather than bloating'
      - heading: The Raleigh Address and Regional Identity
        description: 'The physical credibility infrastructure that operates whether or not the firm is
          there in person.

          '
        bullet_points:
        - 'Why a Raleigh address matters: it signals NC commitment, anchors the firm in the LGC''s home,
          and centers the 150-mile geographic footprint'
        - 'Office options: shared workspace (typically $400–$1500/month), virtual mail and registered-agent
          services for compliance with bidding rules, or a small dedicated suite'
        - Compliance with state bidding rules that require a physical address — and why a P.O. box is
          rarely sufficient
        - 'The ''where are you based'' first-call question: a Raleigh answer earns a five-second pass;
          a non-Raleigh answer requires a ninety-second explanation'
      - heading: COIs, Bonding, and the Standing Package
        description: 'The boring documents that decide whether the firm is even eligible to bid.

          '
        bullet_points:
        - Certificates of Insurance with the typical limits ($1M/$2M E&O minimum, $1M GL, auto, WC, $5M
          umbrella) and the named-insured / additional-insured language buyers expect to see
        - Professional liability E&O scope and the cyber-liability rider that's increasingly required
        - Performance and payment bonding capacity — usually irrelevant for OR scope but occasionally
          requested on broader engagements
        - 'The standing package binder: every COI, every cert (E-Verify, Iran, anti-BDS, drug-free), every
          form, refreshed quarterly — the discipline that prevents ''we lost this pursuit on a missing
          form'' moments'
      - heading: Website, LinkedIn, and the Pre-Interview Google Search
        description: 'The online presence that survives the panel''s research before the interview.

          '
        bullet_points:
        - 'Website essentials: full bios with credentials, project list, named references, the partner''s
          career arc, the firm''s approach narrative, contact information that''s not a generic Gmail'
        - 'The ''no Gmail'' rule: a [name]@firmname domain is non-negotiable; firmname@gmail.com on a
          $20M pursuit looks unserious in a way no other detail does'
        - 'LinkedIn presence: the principal posts substantively (monthly minimum), comments on manager
          and chief posts, signals active practice rather than passive directory listing'
        - 'Google search hygiene: ego-search the firm and the partner monthly; address negative or stale
          results before a panel does'
        - 'The insider truth: panels Google every shortlisted firm before the interview; a firm whose
          first three Google results are a Gmail address, an outdated bio, and a stale LinkedIn page is
          at a disadvantage the SOQ can''t recover from'
      conclusion: 'Research operations are the firm''s volume multiplier; the standing package is its
        ticket to bid; the Raleigh address, website, and LinkedIn presence are the credibility surface
        that operates whether or not the firm is in the room. Build the infrastructure once, with discipline,
        refresh it on a calendar, and a two-person firm presents to a panel like a ten-person firm. Skip
        any layer of it and the firm operates with a permanent handicap.

        '
      transition: 'Pricing, positioning, staffing, infrastructure — the firm''s external machinery is
        now built. The next part of the book is about what could destroy it: the insurance, ethics, FOIA,
        and partnering questions that, if mishandled, end firms in months. Public-sector advisory has
        a higher reputational floor than private development, and a single error in the next domain can
        outweigh a decade of careful pursuit work.

        '
- title: 'Part Seven: Risk, Ethics, Insurance, and Partnering'
  description: 'What could sink the firm. Owner''s-rep advisory operates on a higher reputational floor
    than private development, and a single error in insurance scope, contract terms, ethics compliance,
    or partner selection can outweigh a decade of careful pursuit work. This part walks the insurance
    and liability landscape, the public-contract terms a private developer''s reflexes mishandle, the
    ethics and scandal pathology that ends careers, the FOIA and open-meetings regime that turns transparency
    into BD intelligence, and the teaming and MBE/HUB/SWaM partnerships that decide whether the firm primes
    or subs.

    '
  sections:
  - title: What Could Sink the Firm
    description: 'The five domains where a single mistake can cost more than the firm has earned in years.

      '
    chapters:
    - title: Insurance and Liability for Owner's-Rep Firms
      word_target: 1500
      description: 'An owner''s-rep firm sits at a specific liability node: it advises but does not build,
        recommends but does not stamp, and yet is named on contracts and pulled into disputes along with
        the parties that do. This chapter walks the insurance scope every CivicDev engagement requires,
        the limits buyers expect to see, the contract clauses that protect or expose the firm, and the
        indemnification and limitation-of-liability language that should be in every owner-consultant
        agreement.

        '
      intro: 'Open with an analogy from a building inspector. The inspector advises, points out the cracked
        beam, signs off on the framing — but doesn''t build. When a wall fails, the builder is sued first,
        then the architect, then sometimes the inspector. The OR''s liability is the inspector''s liability:
        narrow, but real, and increasingly named in the suit. E&O insurance is the inspector''s E&O insurance.
        The day the firm doesn''t think about the inspector analogy is the day it under-insures and discovers,
        twenty months later, that ''narrow'' doesn''t mean ''zero.''

        '
      chapter_sections:
      - heading: The Coverage Stack
        description: 'The policies an OR firm needs and the typical limits buyers expect.

          '
        bullet_points:
        - 'Professional liability (E&O): typical limits $1M/$2M up to $5M/$10M depending on project size
          and buyer requirements; primary coverage for advisory work'
        - 'General liability, auto, workers'' comp: standard small-business coverage but with public-sector
          named-insured language buyers will require'
        - 'Umbrella: typically $5M, occasionally $10M for larger jurisdictions; cheap insurance against
          the catastrophic claim'
        - 'Cyber liability: increasingly required by buyers post-2022 ransomware era; sometimes a rider
          on E&O, sometimes a standalone policy'
      - heading: The OR's Liability Footprint
        description: 'Where the firm is and isn''t on the hook.

          '
        bullet_points:
        - 'Advice-not-design: the firm recommends, the architect designs and stamps; the firm''s exposure
          is on the advice, not the design'
        - 'Recommendations vs. decisions: the OR recommends an A/E, the buyer selects; the OR recommends
          a CMR, the buyer awards — the buyer''s decision insulates the firm from the selection itself'
        - 'OAC chairing and the documentation discipline: meeting minutes that show recommendations made,
          decisions deferred to the owner, and risks flagged — the OR''s primary defense in any dispute'
        - 'The insider truth: most OR liability claims arise from things the OR didn''t say in writing
          — an undocumented warning, a verbal concession, a meeting that wasn''t minuted; written discipline
          is the firm''s main risk-management tool'
      - heading: The Contract Clauses That Matter
        description: 'What to negotiate into every owner-consultant agreement.

          '
        bullet_points:
        - '''We are not the architect of record'' language — explicit in the scope of services, repeated
          in every relevant clause'
        - 'Indemnification: mutual where possible, capped where mandatory; never unlimited, never one-way
          against the firm'
        - 'Limitation of liability: typically capped at the fee paid or a multiple of the fee — and the
          buyer''s pushback on this clause is one of the most common contract-negotiation flashpoints'
        - 'Professional standard of care: the contractual articulation of what the firm is judged against
          — typically the standard for similar professionals in similar engagements in similar geographies'
      - heading: Indemnification and the Public Buyer
        description: 'The negotiation reality with municipal counsel.

          '
        bullet_points:
        - Public buyers often require broad indemnification language; firms have to negotiate caps, exclusions
          for buyer-caused harm, and exclusions for consequential damages
        - Sovereign immunity and what it does and doesn't waive — varies by state, and shapes who's actually
          exposed to suit when the project goes wrong
        - 'Insurance certificates as additional-insured: when buyers require it, what limits they require,
          and how the additional-insured endorsement actually works in practice'
        - 'The insider truth: a contract negotiation that goes seven rounds on indemnification language
          is a contract worth signing carefully — and a firm without an attorney experienced in public-sector
          contracts will get worked over'
      conclusion: 'The OR firm''s liability is narrow but real. Insurance limits should match buyer expectations;
        contract clauses should match the firm''s actual risk posture; written discipline is the firm''s
        daily defense. Get all three right and the firm operates insulated from catastrophic risk; get
        any one wrong and the firm is one bad project from a claim that can take years to clear.

        '
      transition: 'Insurance protects against unforeseen claims. The contract itself — the document that
        defines scope, terms, and termination — is the foundational protection. And public- sector contracts
        are a different document than the private-sector ones a developer is used to. The next chapter
        walks that difference.

        '
    - title: Public-Contract Terms and the AIA / EJCDC Templates
      word_target: 1700
      description: 'The standard public-sector owner-consultant agreement is a different document than
        the private-sector contract a developer is used to. Termination for convenience, fund-out clauses,
        sovereign immunity, pay-when-paid mechanics, and the AIA C-series and EJCDC templates all behave
        differently in the public realm. This chapter walks the differences, the clauses to negotiate,
        and the AIA/EJCDC documents most commonly used in NC/SC/VA municipal practice.

        '
      intro: 'Open with an analogy from real estate leasing. A residential lease and a commercial lease
        can be for the same building, on the same square footage, between the same two parties — and they
        are completely different documents, with different default rules, different termination provisions,
        different liability allocations. A private developer who reflexively applies residential-lease
        habits to a commercial negotiation gets worked over. The same developer who applies private-construction-contract
        reflexes to a municipal owner-consultant agreement is making the same mistake on a much bigger
        document.

        '
      chapter_sections:
      - heading: What's Different About Public Contracts
        description: 'The five clauses where private-developer reflexes fail.

          '
        bullet_points:
        - 'Termination for convenience: public contracts almost always include the right of the buyer
          to terminate without cause on notice; the firm''s protection is in the wind-down compensation
          language, not in resisting the clause'
        - 'Fund-out / non-appropriation: public buyers cannot legally bind future fiscal years'' budgets;
          multi-year contracts are typically conditional on annual appropriation'
        - 'Pay-when-paid and pay-if-paid limitations: how public-sector contracts handle the chain of
          payment, especially when the firm is a subconsultant'
        - 'Sovereign immunity: what the buyer waives, what it doesn''t, and how that affects the firm''s
          actual ability to collect a judgment if litigation arises'
        - 'Mandatory dispute resolution paths: protest procedures before litigation, mediation requirements,
          venue and choice-of-law clauses that are often non-negotiable'
      - heading: AIA C-Series Templates Most Commonly Used
        description: 'The AIA documents an OR firm encounters in public-sector practice.

          '
        bullet_points:
        - AIA C132 — Standard Form of Agreement Between Owner and Construction Manager as Adviser; the
          canonical OR-as-CM-adviser document
        - AIA C133 — Owner-CM as Constructor Agreement; less common for an OR firm but worth knowing for
          negotiating with CMR partners
        - AIA C172 — Program Management Agreement; the document for portfolio-level program-management
          engagements
        - AIA B-series amendments owner-side — the family of architect-related documents the OR helps
          the owner negotiate
      - heading: EJCDC E-Series and Owner-Generated Contracts
        description: 'When AIA isn''t the right document, and how to redline what the buyer hands you.

          '
        bullet_points:
        - 'EJCDC E-series for engineering-led projects: E-500 Owner-Engineer Agreement and the related
          construction-services documents'
        - 'Owner-generated contracts: city/county-attorney-drafted, often modified from a prior project,
          often containing terms the OR firm should redline'
        - 'Common redlines: indemnification scope, limitation of liability cap, ownership of work product,
          payment timing, dispute-resolution venue'
        - 'The insider truth: most public-sector contracts that arrive on the firm''s desk have been used
          five times before; a careful first-time review and redline becomes the firm''s negotiation template
          for every future contract with that buyer'
      - heading: Negotiation Reality with Municipal Counsel
        description: 'Who you''re negotiating with and how to get to yes.

          '
        bullet_points:
        - Municipal counsel as the typical opposing party — and their priorities (defensibility, compliance
          with state code, precedent for future contracts), which differ from a private GC's
        - 'When to push and when to fold: indemnification caps and limitation-of-liability are usually
          negotiable; sovereign-immunity language and termination-for-convenience usually are not'
        - 'The redline-and-explanation discipline: every redline accompanied by a one-sentence rationale;
          counsel is more likely to accept a redline they can explain to their client than a stripped-out
          clause'
        - Building a relationship with the procurement officer and county attorney over multiple contracts
          — by year three, the redlines get accepted faster because the firm is known and trusted
      conclusion: 'Public-sector contracts use a different vocabulary, encode different risks, and follow
        different negotiation conventions than the private-sector documents a developer learned on. The
        AIA C-series and EJCDC E-series are starting points, not finishing points; the clauses that matter
        — indemnification, LOL, termination, fund-out — are negotiated in every contract. A firm that
        learns this once, with a careful first review, has the template for every future contract.

        '
      transition: 'The contract is the document that governs the engagement. Ethics is the unwritten document
        that governs the firm''s reputation. And in public-sector advisory, the reputational floor is
        unforgiving — a single ethics misstep can end careers and end firms. The next chapter walks the
        ethics regimes in NC, SC, and VA, the patterns that get firms in trouble, and the disciplines
        that prevent it.

        '
    - title: Ethics, Gifts, Conflicts, and Scandal Pathology
      word_target: 1700
      description: 'Ethics, gift, and conflict-of-interest rules are stricter and more strictly enforced
        in public-sector work than most private developers expect. Reading the rules in NC, SC, and VA
        is non-negotiable, and so is studying the patterns of scandals that have ended firms and careers.
        This chapter walks the three states'' frameworks, the scandal patterns that recur, and the operational
        disciplines a firm builds to prevent them.

        '
      intro: 'Open with a specific scandal pattern — the lobster lunch. A contractor takes a public works
        director out for a $200 lobster lunch, six months before an RFQ that the contractor will respond
        to. The director thinks nothing of it; he''s gone to lunches like that for twenty years. Two years
        later, the local newspaper FOIAs the director''s calendar, the lunch shows up in the auditor''s
        report, the director is forced to retire, the contractor is debarred for three years, and the
        case becomes the regional cautionary tale that gets cited in every ethics training for the next
        decade. The lunch wasn''t the issue. The lunch in proximity to the RFQ was the issue. And nobody
        noticed at the time.

        '
      chapter_sections:
      - heading: The Three-State Ethics Framework
        description: 'The statutes and the practical thresholds.

          '
        bullet_points:
        - 'North Carolina: State Ethics Act (Chapter 138A) and GS 160A-86 for local government conflicts;
          financial-disclosure thresholds; the Department of State Ethics Commission'
        - 'South Carolina: SC State Ethics Act (Title 8 Chapter 13) and the SC Ethics Commission; financial-disclosure
          forms (SEI/SEC) for state and local officials'
        - 'Virginia: VA State and Local Government Conflict of Interests Act (§2.2-3100 et seq.) and the
          Virginia Conflict of Interest and Ethics Advisory Council'
        - 'Federal overlay: federal funds (FEMA, USDA, EDA) trigger federal ethics rules on top of state
          rules — and the fact that ARPA and IIJA dollars are everywhere means federal rules are now relevant
          in projects that used to be purely local'
      - heading: Gifts, Meals, and the Threshold Rules
        description: 'The bright lines and the gray zones.

          '
        bullet_points:
        - 'Gift thresholds: VA''s $100 single-gift / $250 aggregate-per-year line; NC''s stricter rules
          for state employees, looser local rules; SC''s mid-range thresholds'
        - 'What counts as a gift: meals, travel, conference registrations, sporting event tickets, holiday
          gift baskets — and what doesn''t (industry-standard educational materials, modest items of nominal
          value)'
        - 'The ''thank-you basket'' boundary: a $30 gift basket sent to a manager''s office after closeout
          is fine; a $300 wine-and-cheese spread is not; the line is enforced inconsistently but punished
          consistently when crossed'
        - 'The insider truth: the right policy is no gifts of any kind, ever — the savings are negligible,
          the risk is unbounded, and the firm''s reputation as ''doesn''t gift'' is itself a credential'
      - heading: Pay-to-Play and Political Contributions
        description: 'The political-contribution rules that catch firms unaware.

          '
        bullet_points:
        - Political contribution rules in each state — restrictions on contributions to officials with
          award authority over the firm's work, varying by state and by jurisdiction
        - 'Pay-to-play prohibition: federal and state restrictions on contributions to candidates whose
          offices will award the firm''s contracts; SEC MSRB Rule G-37 for municipal advisors'
        - 'The cumulative-disclosure trap: small contributions across multiple cycles aggregating into
          reportable thresholds the firm forgot about'
        - 'The personal vs. firm distinction: the principal''s personal contributions are sometimes attributed
          to the firm by buyers; the cleanest policy is no contributions to active-procurement-decision-makers,
          full stop'
      - heading: The Scandal Patterns That Recur
        description: 'The named patterns from regional case files, and the operational disciplines that
          prevent them.

          '
        bullet_points:
        - 'The ''former employee, current vendor'' pattern: a manager retires, joins a firm, and the firm
          bids on the former employer''s project six months later — almost always investigated, often
          debarred'
        - 'The ''consultant who wrote the RFQ also bid on it'' pattern: pre-RFQ engagement that crosses
          into improper influence, then a bid that benefits from the engagement'
        - 'The ''gift in proximity to award'' pattern: any meal, ticket, or favor in the 90 days before
          or after a contract award becomes the auditor''s exhibit'
        - 'The ''family member subcontractor'' pattern: a sub on the firm''s team is owned by the manager''s
          son-in-law; never disclosed because nobody asked'
        - The reputational halo of 'never had an issue' — the asset every long-tenured firm has and that
          a single misstep destroys; it cannot be rebuilt at any price
      conclusion: 'Ethics rules in NC, SC, and VA are stricter than private-developer reflexes anticipate,
        and the enforcement is asymmetric — most violations are never caught, but the ones that are end
        careers. The right operational posture is conservative: no gifts, no contributions to active decision-makers,
        all pre-RFQ engagement documented, all conflicts disclosed proactively. The reputational halo
        of ''this firm has never had an issue'' is the most valuable single asset a public-sector advisory
        firm can hold.

        '
      transition: 'Ethics is about what the firm shouldn''t do. FOIA and open-meetings law is about what
        the public — and the firm — has a right to see. And the firms that treat public records as a BD
        intelligence source rather than an inconvenience build pursuit pipelines no competitor can match.
        The next chapter is the transparency regime as a working tool.

        '
    - title: FOIA, Open Meetings, and BD Intelligence
      word_target: 1500
      description: 'Public records and open meetings are not just compliance topics — they are the firm''s
        primary intelligence source. Reading agenda packets and minutes is BD work; submitting records
        requests strategically is BD work; understanding the procedural rules of NC''s GS 132, SC''s FOIA
        §30-4-10, and VA''s FOIA §2.2-3700 lets the firm read jurisdictions from the outside in.

        '
      intro: 'Open with an analogy from chess. Every move is on a board everyone can see. The grandmaster
        and the amateur are looking at the same position; the difference is what they notice. Public-
        records law makes municipal capital decisions a chess match in the sun — every decision published,
        every meeting recorded, every memo eventually subject to disclosure. Most firms never look at
        the board. The firms that do see every move two years before the RFQ issues.

        '
      chapter_sections:
      - heading: The Three-State Records Regime
        description: 'The statutes, the response timelines, and what''s actually requestable.

          '
        bullet_points:
        - 'North Carolina: GS 132 (public records) and GS 143-318 (open meetings); permissive, broad public-records
          access, no response-time statute but enforceable expectation of reasonable promptness'
        - 'South Carolina: SC FOIA §30-4-10 with a 10-business-day response window; broad scope similar
          to NC but with explicit timing'
        - 'Virginia: VA FOIA §2.2-3700 with a 5-day response, narrower exceptions than the other two states;
          tighter and more procedurally rigorous'
        - Federal FOIA — relevant when projects involve federal grants or federal-agency oversight; longer
          timelines, broader exemptions
      - heading: Agenda Packets, Minutes, and Consent Items
        description: 'The public artifacts that are the highest-yield BD intelligence in the business.

          '
        bullet_points:
        - Agenda packets and the staff-recommended-action language — usually the first signal a project
          is moving from staff intent to council decision
        - Consent agendas and how decisions hide there — many capital actions are approved on consent
          without discussion; the agenda is where to find them
        - Closed-session purposes (personnel, real estate, litigation) and what's recoverable post-decision;
          the closed-session minute is often released after the related decision is made
        - 'Meeting recordings and clip-watching: a council member''s comment in a meeting two months ago
          is sometimes the only signal of a brewing capital priority'
      - heading: The Records Request as a BD Tool
        description: 'How to use the right to know without straining the relationship.

          '
        bullet_points:
        - 'Strategic records requests: when to submit one and what to ask for — narrow, specific, time-bounded,
          never a fishing expedition'
        - 'What''s typically responsive: prior similar contracts, fee schedules, evaluation memos from
          past procurements, board materials'
        - 'Cost recovery: most jurisdictions can charge for staff time and copying; submitting a request
          without anticipating cost is rookie behavior'
        - 'Relationship implications of frequent requests: a clerk who handles three requests a year from
          the same firm starts wondering what they''re up to; a firm that only requests when essential
          keeps the relationship clean'
      - heading: Open-Meetings Law as a Pursuit Calendar
        description: 'The discipline of attending — physically or virtually — the meetings that decide
          everything.

          '
        bullet_points:
        - Required vs. discretionary closed-session purposes by state and the limits on each
        - Notice requirements (posting timelines, agenda publication, special-meeting rules) and how to
          read them as a pursuit calendar
        - Recording, livestreaming, and post-meeting access in NC/SC/VA — and the fact that most jurisdictions
          now post recordings, making meeting attendance partly virtual
        - 'The insider truth: a firm that watches one council meeting per week for every Tier 1 jurisdiction
          within 150 miles of Raleigh sees pursuit signals two cycles before competitors do — the time
          investment is meaningful but the intelligence advantage is permanent'
      conclusion: 'FOIA and open-meetings law are not compliance topics. They are the firm''s primary
        intelligence source — agenda packets, meeting minutes, consent items, and records requests, used
        disciplined-but-sparingly, give a small firm an information advantage over national competitors
        who rely on lead-gen vendors. The chess board is in the sun. The firms that learn to read it win.

        '
      transition: 'Records and meetings tell you what''s happening inside a jurisdiction. Teaming and
        partnership tell you who you''re going in with — and the choice between primary and subconsultant,
        between a national OR firm and a local A/E, between real and paper MBE participation, decides
        as much about firm trajectory as any pursuit ever does. The next chapter is the partnership math.

        '
    - title: Teaming and MBE / WBE / HUB Partnerships
      word_target: 1500
      description: 'Most pursuits are won as teams, not individual firms. Whether to prime, sub, or partner
        with a larger firm; how to pick teaming partners that strengthen rather than distract a proposal;
        how to structure MBE/HUB/SWaM participation that''s real, not paper — these are the partnership
        decisions that shape every pursuit. Get them right and the firm compounds; get them wrong and
        the firm gives away its best clients to its ''partners.''

        '
      intro: 'Open with an analogy from a wedding. The prime is the venue. The sub is the band. Both get
        paid; both have a role; both leave the night with a relationship to the bride and groom. But the
        venue books the next wedding from the same family. The band books the next gig from the photographer
        or the planner — never from the family directly. The same logic governs prime/sub teaming: the
        prime owns the client; the sub gets paid; and a firm that subs to the same prime three times has
        built a relationship with a competitor, not with a client.

        '
      chapter_sections:
      - heading: When to Prime and When to Sub
        description: 'The decision rule and the implications.

          '
        bullet_points:
        - 'Prime when: the firm has the credentials for the lead role, the project size matches firm capacity,
          the client relationship is the firm''s, and primary economics work for the scope'
        - 'Sub when: the firm needs scale credentials it doesn''t have, the project is bigger than the
          firm can credibly lead, or the relationship is owned by another firm willing to lead'
        - 'Teaming agreement essentials: scope clarity, dollar allocation, decision rights, IP and reference
          rights, and an exit clause that defines what happens at contract end'
        - 'The ''do not let the prime steal the client'' clause: a partner-friendly clause prohibiting
          the prime from soliciting the firm''s contributed client for two years post-contract'
      - heading: Common Teaming Configurations
        description: 'Who teams with whom in NC/SC/VA practice.

          '
        bullet_points:
        - 'A/E primes with OR subs: the A/E firm primes a small project, the OR firm provides advisory
          and procurement support — the most common small-project configuration'
        - 'National OR primes with local subs: a national OR firm wins a large pursuit, the local OR firm
          provides feet-on-the-ground and local relationships — the most common large-project configuration'
        - 'CMR-as-prime configurations: increasingly common in design-build and PDB procurements, with
          the OR firm as owner-side advisor and the CMR as design-build prime'
        - 'OR as prime with specialty subs: the firm primes, brings in specialty subs (cost estimators,
          schedulers, vertical SMEs) on defined-scope subagreements — the configuration the firm should
          aim for as the default'
      - heading: MBE / HUB / SWaM Participation
        description: 'The certified-firm partnerships that are required, common, and consequential.

          '
        bullet_points:
        - NC HUB (Historically Underutilized Business) certification — verification under NC OSHUB; how
          participation goals translate to actual sub scope
        - SC SMBCC (Small and Minority Business Contracting and Certification) under the SC Ethics Reform
          Act — different categories and processes
        - VA SWaM (Small, Women-owned, Minority-owned) certification under the Department of Small Business
          and Supplier Diversity; DBE pass-through for federally-funded projects
        - 'Reciprocity: certifications don''t always carry across state lines; firms working three-state
          often help partners hold certifications in each state separately'
      - heading: Real vs. Paper Participation
        description: 'How panels detect compliance theater and what real participation looks like.

          '
        bullet_points:
        - 'Real participation: named scope, dollar value, named principal at the partner, references for
          the partner''s prior work, integration in the team'
        - 'Paper participation: ''we will identify a partner'' filler, no named scope, partner contributing
          only resume language, partner not at the interview'
        - 'Panel detection signals: the partner answers a panel question with technical depth (real),
          or the prime answers every question while the partner sits silent (paper)'
        - 'The insider truth: the second-tier sub pattern — the prime puts the firm on the SOQ as a sub,
          then builds the work itself and gives the firm a token assignment — is the most common form
          of paper participation, and the firms that allow it are giving away their certifications'
      conclusion: 'Teaming is a strategic decision, not a tactical one. Whether to prime or sub, who to
        partner with, how to structure MBE/HUB/SWaM participation — each decision compounds over years.
        The firm that primes selectively, subs strategically, partners with certified firms substantively,
        and protects its client relationships through teaming agreements builds a durable book. The firm
        that subs reflexively to the same primes, accepts paper MBE roles, and fails to protect client
        rights ends up as someone else''s pipeline.

        '
      transition: 'The pursuit motion ends with a signed contract. The next part of the book covers execution
        — just enough to be credible in the pursuit conversation, because what a firm promises during
        pursuit it has to deliver afterward, and a sales-first firm that can''t hold a credible delivery
        conversation loses pursuits to the firm that can.

        '
- title: 'Part Eight: From Win to Execution (Just Enough to Be Credible)'
  description: 'What happens after the contract is signed. This part is execution-focused but pitched
    at the level of pursuit credibility, not delivery exhaustiveness — because a pursuit firm that can''t
    hold a credible execution conversation in the interview loses to the firm that can. The chapters cover
    Week One, programming and budget reconciliation, A/E selection from the owner side, delivery methods
    and GMP negotiation, OAC and project controls through closeout, and turning a finished project into
    the next pursuit.

    '
  sections:
  - title: Delivering the Work
    description: 'From signed contract to ribbon cutting to the next pursuit — the execution arc, in just
      enough detail to make the pursuit credible.

      '
    chapters:
    - title: Week One — What an Owner's Rep Actually Does
      word_target: 1500
      description: 'The first 30 days of an OR engagement set the relationship''s tone, define the deliverables
        the buyer will judge the firm by, and either calibrate or miscalibrate every interaction that
        follows. This chapter walks the Day 1–10, Day 11–30, and first-board-update arcs — and the discipline
        of reading rather than changing in the first 90 days, the principle that separates trusted advisors
        from premature reformers.

        '
      intro: 'Open with an analogy from a chief of staff arriving for a new president. The first 100 days
        are not about changing the agenda; they are about reading what''s there. Who''s in every meeting
        and why? Whose access has been protected and whose has been cut? What fights are old, what fights
        are new, what fights are about to break? A chief of staff who walks in on day one and announces
        three new initiatives is the chief of staff replaced by day 200. The owner''s rep walking into
        a city manager''s office is the same role: the firm that arrives reading rather than reforming
        earns the trust the firm-that-arrives-pitching never builds.

        '
      chapter_sections:
      - heading: Day 1–10 — Read Everything
        description: 'The discovery and audit phase that anchors every later decision.

          '
        bullet_points:
        - 'Stakeholder map: every named role on the project (manager, finance, department head, A/E, CMR
          if selected, board liaison, attorney, end users) with current contact info, tenure, and recent
          role transitions'
        - 'Document audit: every relevant document the buyer has — needs assessment, CIP entry, budget
          message, prior board reports, A/E contract, geotechnical, environmental, prior correspondence
          — pulled, indexed, and read'
        - 'Baseline schedule and budget capture: the snapshot the firm will measure progress against;
          one-page summary, owned by the OR, refreshed monthly'
        - 'Risk register draft: the top ten risks the OR sees on day ten, ranked by impact and likelihood,
          with proposed mitigations — the artifact that tells the manager the firm is already adding value'
      - heading: Day 11–30 — Charter and Cadence
        description: 'The structural deliverables that establish how the engagement will run.

          '
        bullet_points:
        - 'Project charter: scope, schedule, budget, governance, decision rights, escalation paths — short,
          signed, posted on the project SharePoint'
        - 'OAC cadence and standing agenda: weekly during construction, biweekly during pre-construction;
          standing agenda discipline that prevents OAC drift'
        - 'Reporting templates: the monthly owner report, the board update format, the manager-only briefing
          — defined now so the firm isn''t redesigning them at month four'
        - 'A/E or CMR kick-off facilitation: depending on phase, the firm runs either pre-design or pre-construction
          kick-off, sets expectations for both sides, and earns the role of meeting chair'
      - heading: The First Board Update and the Briefing-Manager Discipline
        description: 'The communications cadence that protects the manager and credentials the firm.

          '
        bullet_points:
        - 'First board update: typically 60–90 days in, a 15-minute presentation that summarizes the project
          status, identifies decisions ahead, and asks for nothing — the appearance designed to build
          credibility, not to extract'
        - 'The ''what we found'' memo: an internal manager-only memo summarizing the audit findings, with
          risks named in clear language and recommendations clearly attributed to the firm'
        - 'Brief the manager privately before any board appearance, every time: the rule that prevents
          surprises and builds trust over years'
        - 'The insider truth: the manager is judging the firm not on what it accomplishes in the first
          month but on whether it surfaces problems early, communicates them clearly, and never embarrasses
          the manager in public — the firm that does these three things is the firm that gets the next
          contract'
      - heading: Reading vs. Reforming — The 90-Day Rule
        description: 'Why the trusted-advisor posture beats the premature-reformer posture every time.

          '
        bullet_points:
        - 'First 90 days: observe, document, ask questions, defer recommendations except where safety
          or legal compliance requires immediate action'
        - 'What gets reformed and what gets accepted: process improvements (OAC discipline, RFI tracking,
          change-order discipline) are owned by the firm; political dynamics are observed, not engineered'
        - 'The ''I''m new here'' line as a working tool: a polite version of ''help me understand'' that
          never expires and always works'
        - 'The contrast posture that fails: arriving with a ten-point reform agenda; the firm that does
          this is dismissed as another consultant within thirty days'
      conclusion: 'Week One sets the tone, the deliverables, and the trust posture that governs every
        later interaction. The firms that read before they reform, document before they recommend, and
        brief before they present are the firms that earn the trusted-advisor role over years. The firms
        that arrive with a reform agenda end up as another consultant the manager outlasts.

        '
      transition: 'Reading takes thirty days. The first substantive deliverable is usually programming
        and budget reconciliation — the moment the project moves from inherited assumptions to owned decisions.
        The next chapter is the discipline of reconciling what the user wants with what the budget can
        actually support.

        '
    - title: Programming and Scope-Budget Reconciliation
      word_target: 1500
      description: 'The space between what the user thinks they want and what the budget will actually
        buy is where most municipal projects quietly fail. Programming validation, square-footage benchmarking,
        and scope-budget reconciliation are the OR''s highest-leverage early-phase deliverables — and
        the value engineering strategies that don''t gut the program are the skill that separates trusted
        advisors from cost-cutters.

        '
      intro: 'Open with an analogy from interior design. The client wants the Architectural Digest house
        — vaulted ceilings, custom millwork, the imported tile. The budget supports the Pottery Barn version
        — drywall, stock cabinets, ceramic tile from the local supply house. The interior designer who
        shows up after the client has signed the AD contract spends three months managing the client''s
        disappointment. The designer who shows up before the contract — and reconciles aspiration with
        budget on day one — saves the project. The OR''s programming role is the same: arrive before the
        architect locks in the AD program, or spend the rest of the project trying to back out of it.

        '
      chapter_sections:
      - heading: Program Validation
        description: 'The discipline of pressure-testing the user''s program before the architect commits.

          '
        bullet_points:
        - 'Space-type benchmarking: square footage by space type against three to five comparable jurisdictions;
          the data set that grounds ''what''s reasonable'''
        - 'Adjacency and flow review: not architecture, but operational logic — does the floor plan support
          the work the building has to do?'
        - 'User group facilitation: organized sessions with end users to extract requirements, not editorial
          preferences; the OR runs these, the architect listens'
        - 'Documenting the validated program: a signed-off space-list with assumptions, sources, and explicit
          out-of-scope items — the artifact that prevents scope creep later'
      - heading: $/SF Benchmarks Worth Knowing
        description: 'The current dollars by building type in NC/SC/VA; the figures the OR cites in programming
          meetings.

          '
        bullet_points:
        - 'Fire stations in NC/SC/VA: typically $500–$700/SF in current dollars, with apparatus bays at
          the lower end and training facilities pushing the upper'
        - 'K-12 schools: elementary $400–$550/SF, high school $450–$600/SF, depending on geography and
          prototype reuse'
        - 'Town halls and administrative buildings: typically $400–$550/SF; often higher for renovations
          than new construction'
        - 'Public works and maintenance facilities: $250–$400/SF; lower envelope expectations, higher
          equipment integration'
        - 'The insider truth: published $/SF benchmarks are eighteen months stale by the time they''re
          cited; current-quarter benchmarks come from active GMP packages and CMR pre-construction estimates,
          not from RSMeans data'
      - heading: The Scope-Budget Reconciliation Memo
        description: 'The deliverable that turns aspiration into appropriation.

          '
        bullet_points:
        - 'The memo''s structure: program summary, total cost estimate (construction + soft + FF&E + contingency
          + escalation), funding source identification, gap and mitigation'
        - 'Audience: the manager and finance director, with the chief or superintendent CC''d; designed
          to be the basis of the next council update'
        - 'Tone: neutral, fact-based, never advocating for a specific cut; the OR identifies trade-offs,
          the owner makes them'
        - 'Timing: before the architect has spent more than 30% of design fee, ideally during SD; the
          later the memo, the more expensive the reconciliation'
      - heading: Value Engineering That Doesn't Gut the Program
        description: 'The cost-management strategies that preserve the building''s purpose.

          '
        bullet_points:
        - 'Deferred FF&E: build the building, defer the furniture, fixtures, and equipment to a later
          capital line; common but politically delicate'
        - 'Phased construction: build core program now, build expansion later; works for fire stations
          and schools where future-need is documented'
        - 'Shell-and-fit-out: complete the shell, defer interior fit-out; the most common K-12 school
          strategy when growth is uncertain'
        - 'Bid alternates: design with optional scope (the canopy, the second classroom wing, the training-prop
          site) and let bid prices tell you which alternates fit'
        - 'What not to cut: structural quality, life-safety systems, mechanical capacity for future expansion
          — the cuts that look cheap and cost ten times the savings over the building''s life'
      conclusion: 'Programming and reconciliation are the OR''s highest-leverage early deliverable. The
        firm that arrives early enough to validate the program, benchmarks the cost in current dollars,
        writes the reconciliation memo before the architect is locked in, and proposes VE strategies that
        preserve the program rather than gut it earns trust no later deliverable can replicate. The firm
        that arrives late spends the rest of the project reconciling.

        '
      transition: 'The program defines the building. The architect designs it. And selecting the right
        architect — through the right process, with the right contract — is the single most consequential
        decision the OR helps the owner make. The next chapter is the A/E selection process from the owner
        side.

        '
    - title: A/E Selection and Contract Negotiation, Owner-Side
      word_target: 1500
      description: 'Selecting the right architect or engineer through the right process is the single
        most consequential decision the owner''s rep helps the buyer make in the early phases. This chapter
        walks the QBS-compliant A/E RFQ from the owner side — scope, evaluation criteria, shortlisting,
        interviews, ranking — and the fee negotiation under mini-Brooks that follows. The OR''s role is
        to run the process the owner doesn''t have the bandwidth or expertise to run themselves.

        '
      intro: 'Open with an analogy from a hiring search committee. The OR is the recruiter, not the hiring
        manager. The recruiter writes the job description, posts it, screens applicants, runs first-round
        interviews, and presents three finalists to the hiring manager. The hiring manager picks. The
        recruiter doesn''t pick — but the recruiter shapes who''s in the finalist pool, and that''s where
        the real decision is made. The OR running an A/E selection is the recruiter. The architect is
        the new VP of construction. The interview matters more than the resume.

        '
      chapter_sections:
      - heading: Running the A/E RFQ from the Owner Side
        description: 'The mechanics of a QBS-compliant solicitation.

          '
        bullet_points:
        - 'Scope of services: the document that defines what the architect will and won''t do; written
          carefully because every later change is a fee event'
        - 'Evaluation criteria: relevant experience, key personnel, approach, references, local presence,
          MBE/HUB/SWaM participation — typical weights of 25/25/15/10/15/10 with variation'
        - 'Shortlisting and the interview matrix: typically three finalists, structured 60–90 minute interviews,
          scored against published criteria'
        - 'Ranking and the recommendation memo to the buyer: not ''we picked this firm'' but ''these are
          the three finalists, here''s how each scored, here''s our recommended ranking, the decision
          is yours'''
      - heading: Fee Negotiation Under Mini-Brooks
        description: 'The post-shortlist conversation that converts qualifications into a contract.

          '
        bullet_points:
        - 'Scope agreement first, fee proposal second: the QBS choreography that the firm has to run from
          the owner side'
        - 'Walking-away rights: the buyer''s right to terminate fee negotiations and move to the secondary
          candidate; rarely exercised but sometimes effective leverage'
        - 'Owner standards: a reusable set of design standards (envelope, MEP, IT, security, sustainability)
          that gets applied to every project; written once, refined annually'
        - 'AIA B-series amendments: the standard owner-architect agreement family, with the redlines the
          OR helps the owner negotiate'
      - heading: Owner Standards and Repeatable Documents
        description: 'The artifacts that turn first-time-buyer chaos into repeatable practice.

          '
        bullet_points:
        - 'Owner standards by trade: the technical specifications the buyer requires regardless of architect,
          refreshed every two to three years'
        - 'Owner-design-review templates: SD/DD/CD review checklists the OR uses with the buyer to catch
          issues before the next phase'
        - 'Owner-supplied items list: items the buyer procures separately (FF&E, technology, kitchen equipment)
          and how they integrate with the GC scope'
        - 'The insider truth: a small jurisdiction without owner standards is the OR''s largest opportunity
          to deliver structural value — the standards become an artifact of the engagement that outlasts
          the project'
      - heading: Managing the A/E Without Becoming the A/E
        description: 'The line the OR walks every week of the engagement.

          '
        bullet_points:
        - 'What the OR does: process management, scope discipline, schedule and fee monitoring, owner-voice
          in design reviews'
        - 'What the OR doesn''t do: design decisions, stamping, technical specification — the licensed-professional
          work that creates licensure exposure'
        - The 'we are not the architect of record' line, repeated in every meeting where the boundary
          might blur — protects the firm legally and protects the architect's professional standing
        - 'When the architect underperforms: how to escalate inside the contract, how to document, when
          to recommend the owner exercise termination — the firm''s hardest conversations and the ones
          that earn the trusted-advisor role'
      conclusion: 'A/E selection is the most consequential early decision. Run the process well — scope,
        criteria, shortlist, interview, rank, negotiate fee under QBS — and the project starts with the
        right partner under the right contract. Manage the architect without becoming the architect, and
        the firm operates inside its scope. Cross the line and the firm acquires liabilities it didn''t
        price for.

        '
      transition: 'The architect designs the building. The contractor builds it. And how the contractor
        is procured — design-bid-build, construction-manager-at-risk, design-build, or a public- private
        alternative — shapes the entire delivery economics. The next chapter walks delivery method selection
        and GMP negotiation.

        '
    - title: Delivery Methods and GMP Negotiation
      word_target: 2000
      description: 'Delivery method selection — DBB, CMR, design-build, PDB, IPD — shapes the project''s
        risk allocation, schedule, and cost. CMR is the dominant mid-size method in NC, SC, and VA municipal
        practice, and GMP negotiation under CMR is one of the highest-leverage moments in the entire project.
        This chapter walks the methods, the statutory authority for each in the three states, and the
        GMP discipline an OR firm uses to protect the owner from the moment the GMP package arrives until
        the moment it''s signed.

        '
      intro: 'Open with an analogy from car-buying. Design-bid-build is the dealer auction — sealed bids,
        lowest takes it, the buyer gets what they get. CMR is the trade-in negotiation — the dealer is
        on your side until the moment of the deal, then the price has to be negotiated even though the
        conversation has been collaborative. Design-build is Carvana — click ''buy,'' a truck shows up,
        you get what''s in the catalog. PDB is the certified pre-owned with extended warranty. Each gets
        you a vehicle. Each has different friction, different trust dynamics, and different wins and losses
        for the buyer.

        '
      chapter_sections:
      - heading: The Delivery Methods
        description: 'What each method is, what it''s good for, and the statutory authority in NC/SC/VA.

          '
        bullet_points:
        - 'Design-bid-build (DBB): the legacy method; design complete before bid; statutorily allowed
          everywhere but increasingly seen as slower and more adversarial than alternatives'
        - 'Construction-Manager-at-Risk (CMR): the dominant mid-size method in NC/SC/VA; CMR engaged during
          design, GMP negotiated post-CD; better collaboration, but the GMP negotiation is the leverage
          moment'
        - 'Design-build (DB): the architect and contractor as a single entity under one contract with
          the owner; statutory authority varies by project type and jurisdiction in each state'
        - 'Progressive design-build (PDB) and Integrated Project Delivery (IPD): emerging methods for
          complex projects; PDB combines design-build with progressive contracting, IPD shares risk across
          owner-A/E-CMR — both rare in municipal practice'
        - 'Statutory authority by state and project type: NC''s CM at Risk Act, SC''s allowance for various
          delivery methods under the Consolidated Procurement Code, VA''s PPEA for design-build flexibility'
      - heading: GMP Anatomy
        description: 'What''s in a CMR''s GMP package and where the OR firm''s review focuses.

          '
        bullet_points:
        - 'Cost of work: the trade subcontracts, materials, equipment, labor — the hard cost of building
          the building'
        - 'General conditions and general requirements: the CMR''s site overhead, project management staff,
          supervision, temporary services — the line every owner overpays on without scrutiny'
        - 'Fee: the CMR''s profit, typically a percentage of cost of work; negotiated separately from
          GCs and GRs'
        - 'Contingency: shared between owner and CMR, with carefully negotiated rules about what each
          can be used for'
        - 'Allowances: line items for scope items not yet defined (FF&E, owner-furnished equipment, paving
          alternates) — the items most likely to be used or returned'
        - 'Alternates: bid alternates included or excluded in the GMP, with the rules for accepting them
          post-GMP'
      - heading: Open-Book Economics and Audit Rights
        description: 'The transparency framework that turns the GMP into a real number.

          '
        bullet_points:
        - 'Open-book CMR contracts: the buyer''s right to see every subcontract, every material invoice,
          every cost-of-work line — and the OR''s role in actually exercising that right'
        - 'The 3-bid rule for sub procurement: under public CMR, most jurisdictions require three competitive
          bids per trade or a documented justification for fewer'
        - 'Self-perform exception: when the CMR can perform a trade with their own forces, and how the
          buyer''s interest is protected'
        - 'Public-bid-list disclosure: the requirement (in some jurisdictions) that the CMR disclose all
          subs solicited, not just selected — protects against bid-rigging accusations'
        - 'Audit rights: the right to audit the CMR''s cost-of-work books for one to three years post-completion;
          rarely exercised, always valuable as leverage'
      - heading: VE Pre-GMP vs. Post-GMP
        description: 'The leverage difference between two timing windows that look similar but are not.

          '
        bullet_points:
        - 'Pre-GMP value engineering: collaborative, with the CMR''s full participation, before the price
          is locked; the OR runs sessions, the architect implements'
        - 'Post-GMP value engineering: adversarial, with the CMR pricing changes against the locked-in
          scope; every reduction in the GMP is an argument over what the original scope actually included'
        - 'The discipline of doing VE pre-GMP: the schedule pressure to get to GMP fast vs. the cost pressure
          to identify savings before the lock-in'
        - 'The insider truth: most cost overruns on CMR projects can be traced to insufficient pre-GMP
          VE — the firm that runs three pre-GMP VE sessions saves more than the firm that runs ten post-GMP
          change-order battles'
      - heading: Contingency Burndown and Reporting to the Board
        description: 'How the OR makes the math visible to non-technical decision-makers.

          '
        bullet_points:
        - 'Owner contingency vs. CMR contingency: separate buckets, separate rules, separate reporting'
        - 'Burndown reporting: monthly tracking of contingency usage with cause coding (unforeseen, design
          change, owner-requested, escalation) so the board can see why money is moving'
        - 'Forecast at completion: the running estimate of where contingency will land at substantial
          completion, updated monthly'
        - 'The board update format: one page, three lines (committed cost, projected cost, contingency
          remaining), with a one-paragraph narrative — the artifact the manager wants and the board reads'
      conclusion: 'CMR is the dominant mid-size method in NC/SC/VA municipal practice, and GMP negotiation
        is the highest-leverage moment in the project. The OR firm that runs disciplined open- book reviews,
        ensures 3-bid sub procurement, runs pre-GMP VE rather than post-GMP fights, and reports contingency
        burndown clearly to the board protects the owner from the cost overruns that would otherwise become
        the project''s defining story.

        '
      transition: 'GMP gets the contractor on contract and the price set. From there, the OAC, project
        controls, permitting, commissioning, and closeout are the discipline of running the project to
        completion. The next chapter walks the running of construction in just enough detail to make the
        OR''s pursuit conversation credible.

        '
    - title: OAC, Project Controls, and Closeout
      word_target: 2000
      description: 'The OAC chairing, RFI and submittal logs, change-order discipline, pay-application
        review, permitting, commissioning, FF&E, and closeout — the construction-phase machinery of an
        OR engagement. Pursuit-stage credibility requires fluency in this vocabulary, even though most
        OR firms staff junior practitioners on the day-to-day. This chapter is a working overview, not
        an exhaustive guide.

        '
      intro: 'Open with an analogy from a newsroom. The OAC is the daily editorial meeting — what''s moving
        today, what''s blocked, who needs what by when. The RFI log is the wire copy flowing in from reporters,
        waiting for the editor''s call. Submittal logs are the pages going to print, each requiring its
        own approvals before the press runs. Change orders are the stop-the-presses moments. Pay applications
        are payroll. The OR running this engagement is the managing editor — coordinating without writing
        the stories, deciding what runs and what waits, and accountable for the paper that goes out at
        the end of every shift.

        '
      chapter_sections:
      - heading: OAC Cadence and Standing-Agenda Discipline
        description: 'The meeting that runs the project, run with the discipline that earns the chair''s
          authority.

          '
        bullet_points:
        - 'Cadence: weekly during construction, biweekly during pre-construction, with phase-change meetings
          to recalibrate'
        - 'Standing agenda: schedule status, RFI log, submittal log, change-order log, pay-app status,
          safety, key decisions ahead — the same eight items every meeting'
        - 'Attendees: owner (manager or designee), architect, CMR, OR; subs invited as needed; minutes
          distributed within 48 hours'
        - 'The chair''s discipline: keeps the meeting on time, never lets it run long, owns the action-item
          list, and follows up on every action between meetings'
      - heading: RFI, Submittal, and Change-Order Logs
        description: 'The three logs that tell the story of the project''s health.

          '
        bullet_points:
        - 'RFI log: response-time metrics (target 7–10 days), cost-impact flags, escalation triggers when
          responses are late; the OR''s primary tool for keeping the architect responsive'
        - 'Submittal log: critical-path tracking, long-lead items (apparatus, switchgear, custom millwork)
          flagged separately, status reported every OAC'
        - 'Change-order log with cover-sheet discipline: each change-order request gets a cover sheet
          (cause, cost, schedule impact, owner-decision deadline), tracked from request to disposition'
        - 'The insider truth: a project''s health is visible in the logs before it''s visible in the schedule;
          an RFI log with 30+ open items past 14 days is a project about to slip the schedule, regardless
          of what the schedule says'
      - heading: Pay-App Review and Lien Waivers
        description: 'The financial discipline that protects the owner from over-billing and lien risk.

          '
        bullet_points:
        - 'Schedule of values discipline: the SOV reviewed line-by-line at first pay app, refined to prevent
          front-loading, then enforced consistently'
        - 'Pay-app review: percent complete by line item, stored materials documentation, conditional
          vs. unconditional lien waivers from each tier of subs'
        - 'Retainage: typically 5–10%, released at substantial completion or per state mechanic''s-lien-law-aligned
          reduction schedules'
        - 'The ''pay when paid'' chain: how subs flow up to the CMR, who flows up to the owner, and where
          lien risk lives at each step'
      - heading: Permitting, Commissioning, and FF&E
        description: 'The mid-to-late-phase machinery the OR coordinates rather than performs.

          '
        bullet_points:
        - 'DRB and permitting cadence: NC/SC/VA permit-review timelines; the discipline of pre-submittal
          meetings with reviewers to identify red flags'
        - 'Commissioning levels: enhanced (LEED, often required for state-funded projects) vs. fundamental
          (typical baseline); fire-station-specific Cx for apparatus exhaust capture, station alerting,
          generator and ATS'
        - 'FF&E procurement: typically separate from construction, often via state cooperative contracts
          (NC NCEPP, GSA, OMNIA Partners); the OR coordinates schedule with the construction completion'
        - 'The schedule integration: FF&E delivery and Cx commissioning have to converge with substantial
          completion; mis-sequencing here delays occupancy'
      - heading: Punch List, Substantial Completion, Final, and Warranty
        description: 'The last 10% of the project that defines whether the firm gets the next contract.

          '
        bullet_points:
        - 'Substantial completion: the legal milestone that triggers retainage reduction, warranty start,
          and beneficial occupancy; the OR runs the inspection and the punch list'
        - 'Final completion: punch list closed, all paperwork (warranties, O&M manuals, as-builts, attic-stock)
          delivered, retainage released'
        - 'Warranty period: typically 12 months from substantial completion; the 11-month warranty walk
          identifies remaining items before the warranty expires'
        - 'The 11-month walk as a bridge to the next pursuit: the firm comes back, walks the building
          with the chief or facilities director, identifies issues, and re-establishes the relationship
          — the bridge from this project to the next'
      conclusion: 'OAC, RFIs, submittals, change orders, pay apps, permitting, commissioning, FF&E, punch
        list, warranty — the mechanical apparatus of construction-phase OR work. A pursuit- stage firm
        doesn''t need to staff this work itself; it needs to be able to discuss it fluently in pursuit
        conversations and supervise it credibly when delivery starts. The vocabulary is the qualifier.
        The 11-month walk is the bridge to the next pursuit.

        '
      transition: 'The project ends with substantial completion, then final completion, then warranty
        walk-through. But the firm''s relationship with the jurisdiction is just entering its most valuable
        phase. The next — and final — chapter is about turning a finished building into the next pursuit,
        and the long compounding game that defines a B2G advisory practice.

        '
    - title: Turning a Finished Project into the Next Pursuit
      word_target: 1500
      description: 'The finish line of one project is the starting line of the next. Reference cultivation,
        alumni tracking, ribbon-cutting discipline, and trade-press publication are the activities that
        convert a single contract into a multi-year revenue arc. This final chapter is about the long
        game — the ten-year compounding horizon that separates a one-project firm from a CivicDev practice
        with fifteen jurisdictions in steady rotation.

        '
      intro: 'Open with an analogy from college graduation and alumni reunions. The day the diploma is
        handed out feels like the end. It''s actually the beginning of a 50-year alumni relationship.
        The graduates throw a party, scatter, and most of them never see the campus again. A few come
        back for every reunion, every fundraiser, every alumni meeting — and ten years later, those few
        are the class president, the fundraising chair, the one whose name is on the new library wing.
        The firm that throws a ribbon-cutting party and disappears is the typical graduate. The firm that
        comes back for every reunion — the 11-month walk, the alumni tracking, the trade-press case study
        — is the alumni chair, and that''s where the next class president comes from.

        '
      chapter_sections:
      - heading: The Closeout Memo as Case Study
        description: 'Writing the project''s history while it''s still fresh.

          '
        bullet_points:
        - 'The closeout memo at substantial completion: project summary, schedule and budget actuals vs.
          plan, lessons learned, named outcomes — written within thirty days of substantial completion'
        - 'Format that doubles as a case study: project name, dates, dollar values, role specificity,
          named references, photographs, outcome metrics — already the SOQ project sheet'
        - 'Internal version vs. external version: the internal includes lessons-learned candor; the external
          is the publishable case study with permission from the buyer'
        - 'Approval to publish: in the original contract, ideally; if not, requested explicitly at closeout
          — and never assumed'
      - heading: Reference Cultivation Post-Occupancy
        description: 'The 90-day, 12-month, and ongoing cadence that keeps the relationship warm.

          '
        bullet_points:
        - 'The 30-day post-occupancy thank-you: a substantive note, not a card, with one specific mention
          of a moment in the project'
        - 'The 90-day check-in: ''how''s the building performing?'' — a real question, with the firm prepared
          to address any issues that surface'
        - 'The 12-month walk-through: scheduled with the buyer, often combined with the 11-month warranty
          walk, used to extend the relationship beyond the contract''s formal end'
        - 'The annual touch: a holiday note, a conference run-in, an article share — the cadence that
          keeps the firm in the buyer''s memory without being intrusive'
      - heading: Alumni Tracking and the Next Jurisdiction
        description: 'Where the manager, chief, or superintendent goes next is where the next pursuit
          is.

          '
        bullet_points:
        - 'Alumni tracking discipline: maintain a list of every former buyer-side counterpart, with current
          role and jurisdiction, refreshed quarterly'
        - 'The first call to a former buyer in a new role: a congratulations within seven days, no pitch,
          just an offer to be useful in the new context'
        - 'The introduction asset: a former chief in a new jurisdiction is a credentialed introduction
          to the jurisdiction''s manager and team — a relationship that converts at multiples of cold
          outreach'
        - 'The insider truth: most pursuit firms don''t track alumni systematically; the firms that do
          build a multi-year compounding pipeline that no competitor can replicate without the same patience'
      - heading: Ribbon-Cuttings and Trade-Press Publication
        description: 'The visibility moments that convert one project into broader brand presence.

          '
        bullet_points:
        - 'Ribbon-cutting discipline: attend, never speak unless invited, dress and behave like a member
          of the team, never claim credit publicly that wasn''t pre-cleared with the buyer'
        - 'Trade-press case studies: American City and County, the state-association magazines, Fire Engineering
          for fire-station projects — pitch the project, ghost-write where appropriate, never publish
          without buyer approval'
        - 'Conference panel pitches: the closeout memo as a conference panel proposal — co-presented with
          the buyer''s manager or chief, the format that converts at the highest rate covered earlier
          in this book'
        - 'LinkedIn and the firm''s website: the project gets its case-study page, the principal posts
          about it with the buyer tagged, the firm publishes a short article — and these become the digital
          surface the next panel sees when it Googles the firm'
      conclusion: 'The finish line of one project is the starting line of the next, and the firm that
        treats every closeout as the beginning of a new relationship arc — closeout memo as case study,
        references cultivated post-occupancy, alumni tracked across years, ribbon- cuttings and trade-press
        as visibility moments — builds the kind of practice where fifteen jurisdictions are in steady
        rotation and every year''s pursuit pipeline is half- filled before January 1st.

        '
      transition: 'Eight parts and forty chapters. The arc of this book runs from why municipal buyers
        think the way they do, through the procurement and verticals and pursuit motion, into the firm''s
        economics and risk posture, and out to the execution work that delivers what pursuits promise.
        The compounding game starts the first time a principal sits down to read 24 months of council
        minutes and ends — never; that''s the point. CivicDev is a practice that rewards patience over
        a decade more than aggression over a quarter. The firms that internalize that rhythm are the firms
        that turn one fire station into seven, and seven stations into the regional reputation that makes
        the next pursuit half the effort of the last.

        '

