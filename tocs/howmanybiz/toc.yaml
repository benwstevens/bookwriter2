title: "How Many Businesses? A Kid's Guide to Seeing the Hidden World of Companies Around You"
author: "Ben"
default_word_target: 1200

parts:
  - title: "Part One: The Tree Crew"
    description: >
      One ordinary scene — guys cutting down a tree on your street — turns out to contain at least a dozen
      businesses, most of them invisible. This part uses that scene to teach the core idea of the book: every
      single thing you see is the tip of a business iceberg. Then it introduces the five questions you can ask
      to figure out which businesses in any scene are the great ones, the okay ones, and the rough ones.

    sections:
      - title: "The Big Idea"
        description: >
          The dawning realization that the world is way more crowded with businesses than it looks — and that
          most of them are hiding behind the one you can see.

        chapters:
          - title: "How Many Businesses Do You See?"
            word_target: 1200
            description: >
              The opening scene of the book: a tree-cutting crew working in a neighborhood. The reader's first
              guess is one business — the tree guys. The real answer is closer to a dozen. This chapter walks
              through the scene slowly, peeling back layer after layer of hidden businesses behind the one you
              can see, and sets up the big question the whole book is going to keep asking.

            intro: >
              Open with a movie-style scene. You and I are walking down the sidewalk on a Saturday morning.
              A big chipper truck is parked on the street, a guy in a hard hat is up in a bucket lift, and
              another guy is feeding branches into a chipper that sounds like a dragon chewing on a piano.
              Freeze-frame the scene. Ask the reader: "If I told you that what you're looking at involves at
              least twelve different businesses, would you believe me?" Then promise to prove it. The voice
              throughout is warm and direct — like you're walking next to the reader, pointing things out.

            chapter_sections:
              - heading: "The Business You Can See"
                description: >
                  Start with the obvious one and don't move on too fast — there's already more here than meets the eye.
                bullet_points:
                  - "The tree-cutting company itself — usually a pretty small business with somewhere between 5 and 30 employees, a couple of trucks, and a guy named something like Dave who answers the phone"
                  - "How they got the job: somebody's mom called three companies and picked the one that came out fastest, which is how most of these jobs really happen — not the cheapest, not the best, the fastest"
                  - "What they actually sell: not 'tree cutting' — they sell the feeling that your roof isn't going to get crushed during the next big storm"
                  - "Why this is a tougher business than it looks: pretty much anyone with a chainsaw and a pickup truck could try to start a tree company tomorrow"

              - heading: "The Businesses That Made the Stuff"
                description: >
                  Look at every single object in the scene and ask: who made that?
                bullet_points:
                  - "The wood chipper — that giant orange machine costs about $70,000 (more than most families pay for their car) and was made by a company called Vermeer or Bandit that you've never heard of but is enormous"
                  - "The bucket truck — also made by a company you've never heard of (Altec, Terex). A used one can cost more than a small house in some places"
                  - "The chainsaws are almost always made by Stihl, a German company that's been around since 1926. There's also the helmet, the special pants that protect the legs from a chainsaw, the ropes, the gloves — every single thing on that truck got made by somebody, and that somebody got paid"
                  - "The bright orange shirts — there's a whole company whose entire job is making clothes bright enough that cars don't hit you. That's all they do. And they're doing fine"

              - heading: "The Businesses That Help Them Run"
                description: >
                  The tree company doesn't just need stuff — it needs services it pays for every month, whether it works or not.
                bullet_points:
                  - "Insurance — without it, one falling branch on the wrong car ends the whole tree company. Insurance is non-negotiable and expensive"
                  - "The accountant who does their taxes, and the lawyer they call when somebody decides to sue them (which happens more than you'd think)"
                  - "The Google ads they pay for so they show up when you Google 'tree removal near me' at 11pm during a windstorm — every click costs them money"
                  - "The bank that loaned them the money for the chipper, and is taking a piece every month for the next five years"

              - heading: "The Businesses That Buy What's Left Over"
                description: >
                  When a tree gets cut down, you get a giant pile of wood and a giant pile of chips. Both of those have buyers.
                bullet_points:
                  - "The mulch business — those wood chips don't go in the trash. They get sold to landscapers or bagged up at Home Depot for $3.99"
                  - "The firewood business — the bigger logs go to a guy who splits and sells firewood by the cord (about $300 each in most places)"
                  - "The sawmill — really big logs of valuable trees (like oak or walnut) might get trucked off to a place that turns them into lumber for furniture"
                  - "Here's a secret nobody tells you: the tree company sometimes makes as much money getting rid of the wood as they did cutting the tree down. The homeowner who paid them never knows"

            conclusion: >
              You started counting at one business. We ended up somewhere around twelve, and we didn't even
              count all of them. This is how every scene in the world works. The thing in front of your eyes
              is almost always the smallest part of what's actually happening.

            transition: >
              Once you start seeing the businesses behind the one business, you can't stop. But there's a
              new problem: with twelve businesses in this one scene alone, how do you know which ones are
              the great ones and which ones are kind of rough? Because they are absolutely not all the same.
              The tree-cutting guy and the wood chipper company live in totally different worlds, and the
              next chapter is going to show you why.

          - title: "The Iceberg"
            word_target: 1200
            description: >
              The single most important mental picture in the book: an iceberg. The business you see is the
              part above the water, but most businesses live underwater, supplying or supporting or buying
              from the one you can see. This chapter introduces the four "layers" of any scene — the visible
              doer, the suppliers, the helpers, and the leftovers — and gets the reader fluent at spotting
              all four.

            intro: >
              Open with the iceberg image, but make it physical and specific. The Titanic didn't sink
              because of what the captain could see — it sank because of the part of the iceberg under the
              water, which was about seven times bigger than the part poking up above. Tell the reader:
              every business you can see is the captain's-eye view. The seven-times-bigger part is what
              we're going to learn to look at. Make the image vivid — kids love the Titanic.

            chapter_sections:
              - heading: "Layer One — The Doer"
                description: >
                  The business you can actually see doing the thing.
                bullet_points:
                  - "The 'doer' is whoever is actually doing the visible job — the tree guys, the pizza guy, the Uber driver, the dentist"
                  - "Doers are the easiest to spot. Their name is on the truck or the sign or the app"
                  - "Doers are usually the hardest businesses to run, because there are tons of other doers competing with them"
                  - "When most people picture a business, they picture a doer — and that's exactly why most people never see how the world really works"

              - heading: "Layer Two — The Suppliers"
                description: >
                  The companies that make the stuff the doer uses.
                bullet_points:
                  - "Suppliers are the companies that sold the doer everything the doer is using right now"
                  - "The supplier is often much bigger than the doer. Vermeer (the chipper maker) is a giant company; Dave's tree company is a guy and a truck. The little fish bought their gear from a much, much bigger fish"
                  - "Some suppliers are 'one step away' (the chipper itself) and some are 'two steps away' (the company that built the engine inside the chipper). You can stack these like Russian nesting dolls"
                  - "There can be five or ten layers of suppliers stacked behind a single visible business, and most of them are companies you've never heard of"

              - heading: "Layer Three — The Helpers"
                description: >
                  The boring but super important services every business has to pay for.
                bullet_points:
                  - "Helpers don't make stuff. They sell services — insurance, banking, accounting, ads, software"
                  - "Almost every business pays its helpers every single month, no matter how things are going. That means helpers can be incredibly steady businesses"
                  - "Here's the secret: the helper layer is where some of the biggest companies in the world hide. The little payment box on the counter at the donut shop? That little box is owned by a company called Square — and Square is worth way more than most of the donut shops it serves"
                  - "If a doer skips paying a helper for too long, the doer disappears. No insurance plus one accident equals goodbye, tree company"

              - heading: "Layer Four — The Leftovers"
                description: >
                  Whoever turns the leftover stuff into a new business.
                bullet_points:
                  - "Every visible business produces leftovers — wood chips, used cooking oil, old cardboard boxes, expired snacks, scrap metal"
                  - "Somebody almost always shows up to buy those leftovers, and that somebody is a real business with trucks and employees"
                  - "Examples: the company that drives around sucking used fryer grease out of McDonald's (they turn it into fuel), the people who buy old air conditioners just for the copper inside, the mulch sellers"
                  - "Leftover businesses have one giant advantage: their main supplier is paying them to take it. Imagine if your biggest expense was free. That's a magic position to be in"

            conclusion: >
              From now on, every time you look at a business, you should automatically be looking for four
              things: the doer, the suppliers behind the doer, the helpers feeding the doer, and the
              leftovers leaving the doer. Once this becomes a habit, you'll never see the world the same
              way again.

            transition: >
              So now we know there's a doer, a stack of suppliers, a row of helpers, and a couple of
              leftover businesses in every scene. But here's the bigger question, and it's the real point
              of the whole book: are some of these layers way better businesses than others? Like, the
              kind-of-better that could change what you decide to do when you grow up? The answer is yes,
              and the next chapter explains exactly how to tell.

      - title: "The Five Sniff Tests"
        description: >
          A kid-friendly translation of one of the most famous tools in business — Porter's Five Forces —
          into five questions a reader can ask about any business. The point isn't to memorize words. The
          point is to develop the instinct that some businesses are structurally great and others are
          structurally rough, no matter how hard the people inside them work.

        chapters:
          - title: "Some Businesses Are Way Better Than Others"
            word_target: 1400
            description: >
              The big shift in this chapter: not all businesses are created equal. Two people can work
              equally hard, be equally smart, and end up in totally different places — because one is in a
              great business and the other is in a tough one. This chapter introduces the five questions
              that decide whether a business is a sweet spot or a trap.

            intro: >
              Open with a real, concrete comparison. Two kids grow up next door to each other and both start
              businesses when they're grown-ups. Owner A opens a pizza place — really good pizza, works all
              the time, barely makes ends meet. Owner B writes a little app for soccer coaches, sells it once
              for $5 a month, and now 50,000 coaches pay him $5 a month forever while he sits on his couch.
              Same effort. Same kind of person. Totally different outcome. Why? Promise the reader that by
              the end of this chapter, they'll be able to spot the difference from a mile away.

            chapter_sections:
              - heading: "Question 1 — How Crowded Is the Field?"
                description: >
                  The first sniff test: how many other people are doing exactly the same thing?
                bullet_points:
                  - "If you can find ten of these businesses within a fifteen-minute drive, the field is crowded — think pizza places, hair salons, lawn-care companies, gas stations"
                  - "When a field is crowded, everyone has to fight on price, and when everyone's fighting on price, nobody gets to keep much money"
                  - "Less crowded means more room. Sometimes a town only has one orthodontist, and that orthodontist has a really nice car"
                  - "Here's the trick: when you see a business and your first thought is 'I could totally start one of those,' that's exactly the problem. So could everyone else. And a lot of them already did"

              - heading: "Question 2 — How Hard Is It to Copy?"
                description: >
                  Even if a field isn't crowded yet, could a copy of this business pop up tomorrow?
                bullet_points:
                  - "Some businesses are super easy to copy — opening a lemonade stand, starting a dog-walking service, making t-shirts"
                  - "Some businesses are really hard to copy — building a phone like the iPhone, opening a bank, starting an airline"
                  - "Hard-to-copy businesses tend to make more money because nobody can show up next month and steal their customers"
                  - "Easy-to-copy businesses might do okay for a while, but the moment they start doing well, three other people open up across the street"

              - heading: "Question 3 — Are the Suppliers Bossy?"
                description: >
                  Who has the power between the business and the people it buys stuff from?
                bullet_points:
                  - "If you only have one supplier and they know it, they can charge you anything they want. Like the kid in the lunchroom who has the only deck of UNO cards"
                  - "Bossy-supplier examples: airlines (only two companies in the world make giant passenger planes — Boeing and Airbus), phone makers (only one company makes the most advanced chips), restaurants (one giant company called Sysco delivers food to half the restaurants in America)"
                  - "Less bossy: a t-shirt company can buy blank shirts from a hundred different places, so no one supplier can squeeze them"
                  - "If your supplier can quietly raise their prices 10% and there's nothing you can do about it, your business is in trouble even if your customers love you"

              - heading: "Question 4 — Are the Customers Bossy?"
                description: >
                  Are the people buying from you in charge, or are you in charge?
                bullet_points:
                  - "If your customers can take their money to a hundred other places that look just like yours, your customers are bossy — they can squeeze you on price any time"
                  - "If your customers basically have no other choice (the only gas station for forty miles, the only phone service that works at their house), you have a way better situation"
                  - "Apple is interesting — they have lots of competitors, but Apple customers love them so much they happily pay extra. That love acts like a force field"
                  - "Think of it this way: when there are five kids and only one slice of pizza left, the pizza-holder is in charge. When there are five slices and only one kid, the kid is in charge"

              - heading: "Question 5 — Could a Totally Different Thing Replace You?"
                description: >
                  Even if no competitor can beat you head-on, could the whole category of what you do disappear?
                bullet_points:
                  - "Taxis looked safe for 100 years — until Uber showed up and replaced them with a completely different thing"
                  - "Movie theaters had no real competition from other movie theaters — but Netflix showed up and gave people a totally different way to watch movies"
                  - "Bookstores were doing fine — until Amazon came along and changed how books got sold"
                  - "Here's the scary part: the most dangerous competitor isn't another business that looks like you. It's the totally different thing that doesn't even look like a competitor — until suddenly it is"

            conclusion: >
              Five questions. How crowded? How hard to copy? Bossy suppliers? Bossy customers? Could
              something totally different replace you? The fewer 'bad' answers a business has, the better
              the business. From now on, every time we see a business in this book, we're going to ask all
              five.

            transition: >
              Time to actually try it. Let's go back to the tree crew and rank every single business in
              that scene from best to worst using the five questions. Some of the answers are going to
              surprise you — and one of them is going to completely flip the way you think about who's
              actually making money on your street.

          - title: "Ranking the Tree Crew"
            word_target: 1400
            description: >
              The first full ranking exercise in the book. Take all twelve businesses from Chapter 1 and
              run each one through the five questions, building a leaderboard as we go. The reader gets to
              watch the author's reasoning happen in slow motion and ends up with a clear answer: the
              tree-cutting company is near the bottom. The chipper manufacturer is near the top. And the
              insurance company is probably the best business of all.

            intro: >
              Open with a draft metaphor — like picking teams in gym class, or drafting players for fantasy
              football, or building your team in Madden or NBA 2K. You're sitting at the table with a draft
              board. Instead of picking quarterbacks and running backs, you're "drafting" the businesses
              from the tree crew scene. Whichever one you pick first is the one you think is the best
              business to own. Tell the reader you're going to do the draft together, in order, and they
              should try to guess who you'd pick first before you reveal it.

            chapter_sections:
              - heading: "The Bottom of the List — The Tree Cutters Themselves"
                description: >
                  Surprise: the most visible business in the scene is one of the worst ones to own.
                bullet_points:
                  - "How crowded? Insanely crowded — every town has dozens of tree companies, and a new guy with a pickup can pop up tomorrow"
                  - "How hard to copy? Embarrassingly easy — one chainsaw and one website and you're in business"
                  - "Bossy customers? Yes — every homeowner gets three quotes and picks the cheapest one, every single time"
                  - "Why does anybody do it then? Because it's a real job that pays the bills. But the owner is buying themselves a hard, dangerous job — not a treasure chest"

              - heading: "The Middle — The Mulch Guy and the Sign Guy"
                description: >
                  Some businesses in the scene are okay — not great, not terrible.
                bullet_points:
                  - "The mulch business: pretty good actually — they get the wood chips for free or almost free, and people will always need mulch in spring. The only real problem is local competition"
                  - "The sign-and-website company: lots of competitors, but also lots of customers, so it's a decent business if you're good at it"
                  - "The chainsaw store: steady customers (every tree pro needs one) but the manufacturer (Stihl) is taking most of the value"
                  - "Notice the pattern: 'okay' businesses usually have one strong answer to the five questions and one weak one. They're not amazing, but they're not doomed either"

              - heading: "Near the Top — The Equipment Maker (Vermeer)"
                description: >
                  The chipper company is way better positioned than the tree company that bought the chipper.
                bullet_points:
                  - "How crowded? Not very — there are only about four big chipper makers in the entire world (Vermeer, Bandit, Morbark, Altec)"
                  - "How hard to copy? Really hard — designing and building a chipper that won't break in the field takes decades of engineering"
                  - "Bossy customers? Not really — every tree company in America needs a chipper, and they tend to stick with the brand they're used to"
                  - "Bonus secret weapon: they sell the chipper once for $70,000, then sell new blades and belts and repairs to that same customer for the next fifteen years. Like getting paid forever for one sale"

              - heading: "The Champion — The Insurance Company"
                description: >
                  The most boring-looking business in the scene is, secretly, the very best one.
                bullet_points:
                  - "Every single tree company has to have insurance — it's the law in most places, and no homeowner will hire a company without it"
                  - "Once an insurance company has you, they kind of have you forever — switching is a paperwork nightmare, so most people don't bother"
                  - "Insurance companies make money two ways: keeping the difference between what they collect and what they pay out, AND making money on the giant pile of money they're holding onto in the meantime"
                  - "Here's the wild part nobody on the street is thinking about: while the tree guy is up in the bucket risking his life for $400, his insurance company is making more money than he is, sleeping just fine, and has never picked up a chainsaw"

            conclusion: >
              The most visible business is almost never the best business. The thing your eyes naturally
              lock onto — the truck, the noise, the action — is usually the toughest seat in the room. The
              best seats are quiet, boring, and hidden. Once you really get this, you'll never look at a
              busy street corner the same way again.

            transition: >
              The tree crew was Scene One. We have lots more to look at. Next we're going to walk over to
              a place every kid in America has stared at while waiting for a parent — the vending machine
              in the hallway. It looks like a glass box full of snacks. It's actually a five-business cage
              match, and the winner is going to surprise you even more than the insurance company did.

  - title: "Part Two: The Vending Machine"
    description: >
      A second anchor scene, this one in a school hallway or office lobby — the vending machine. This is a
      deeper dive than the tree crew because we now have the five-questions tool. We're going to use it
      carefully. The big lesson: in any chain of businesses, the people who take a tiny fee from every
      single transaction are often quietly winning. The vending machine scene also lets us introduce two
      ideas that show up everywhere — getting paid every month no matter what, and brand power.

    sections:
      - title: "A Different Kind of Ecosystem"
        description: >
          The cast of characters in the vending machine scene and how they each get paid.

        chapters:
          - title: "The Box in the Hallway"
            word_target: 1200
            description: >
              The vending machine scene gets unpacked layer by layer, just like the tree crew did. The
              reader meets every player: the company that built the machine, the candy and snack makers
              (Mars, Hershey, Frito-Lay), the little card reader, the route operator who drives around
              restocking, and the building owner who lets the machine sit there.

            intro: >
              Open with a scene the reader has probably actually lived. You're standing in a hallway with
              $1.50 in change. Maybe it's at school, maybe at the dentist, maybe at a community pool. You're
              looking at the glass and you can't decide — Skittles or Reese's? The Reese's wins. The wrapper
              is in your hand. And as you start to chew, you start to ask the question we asked about the
              tree crew: how many businesses just touched this one candy bar? At least five. They all got
              paid before you even finished chewing.

            chapter_sections:
              - heading: "The Machine Itself"
                description: >
                  Somebody had to design and build the giant glass-and-steel box in the hallway.
                bullet_points:
                  - "The machine itself was made by one of a small handful of companies — AMS, Crane, or Royal Vendors are the big ones — and a brand new machine costs $3,000 to $7,000"
                  - "Inside the machine: a little fridge, a computer chip, motors that turn those corkscrew things, a card reader, and software that talks to the internet"
                  - "The school doesn't own the machine. It's owned by an 'operator' — a small business that puts it there, refills it every week, and pays the school a small piece of the money to let it stay"
                  - "Fun fact: there are millions of vending machines in the United States. Together, they make about $8 billion a year in sales. That's just snacks in glass boxes"

              - heading: "The Snacks Inside"
                description: >
                  A handful of giant food companies make almost everything in the spirals.
                bullet_points:
                  - "Almost every chocolate item came from Mars (M&M's, Snickers, Twix) or Hershey (Reese's, Kit Kat, Hershey bars). Two companies, basically the whole chocolate section"
                  - "Almost every chip came from Frito-Lay, which is part of Pepsi — Doritos, Cheetos, Lay's, Sun Chips, all of it"
                  - "Each candy bar gets passed through three or four sets of hands before it gets to you — the factory, the warehouse, the truck, the operator who restocks the machine"
                  - "The operator probably paid 60 cents wholesale for that bar (the price before it gets sold to you) and sold it to you for $1.50. But most of that gap gets eaten up by other costs we'll get to"

              - heading: "The Payment Wizard Nobody Notices"
                description: >
                  When you tap your card or phone, a third business slides in.
                bullet_points:
                  - "See that little card reader on the front? It's almost certainly made and run by a company called Cantaloupe"
                  - "Cantaloupe takes a tiny piece — usually about 5 cents on every dollar — every single time anyone buys anything"
                  - "Cantaloupe also makes the software that lets the operator see from their phone which machines are running low, so they don't waste a trip"
                  - "Cantaloupe powers more than a million machines around the country. They don't make candy, they don't drive trucks, they don't own any buildings. They just take a small slice. Forever"

              - heading: "The Operator and the Building"
                description: >
                  Two more players, both of whom take a cut.
                bullet_points:
                  - "The route operator is usually a small business with a few trucks, a warehouse, and a couple of people who drive around restocking machines all week"
                  - "The building (the school, the office, the hospital) usually gets paid a 'commission' — a percentage of sales, usually 10 to 25 cents on every dollar — just for letting the machine sit there"
                  - "If a machine doesn't sell enough snacks, the operator has to come yank it out and move it somewhere else. That's expensive and annoying, and small operators dread it"
                  - "Every single business in this chain gets paid out of the same $1.50. Once you add everyone up, the operator might end up with about 30 cents per Reese's"

            conclusion: >
              Five businesses, one snack. Just like the tree crew, the visible thing — the machine itself —
              is only the surface. Most of the money is moving through hands you'd never see if you weren't
              looking.

            transition: >
              Now that we know who's in the room, here's the obvious next question: who's having the best
              time? Who's the insurance company of this scene — the boring, quiet, secretly-amazing winner?
              It's not the machine maker. It's not even the candy companies, and they're huge. The answer
              is so good it's actually funny.

          - title: "The Best Business in the Vending Hallway"
            word_target: 1400
            description: >
              The full ranking of the vending machine scene using the five questions. Builds suspense and
              then delivers the surprise: the payment processor (Cantaloupe) is one of the best businesses
              in the whole scene, even though it's the least visible. Uses this to teach a deeper idea:
              "owning the rails" — being the company everyone has to pay to go through — is one of the most
              powerful positions a business can be in.

            intro: >
              Open with a suspense build. "I want to tell you about the most boring business in this whole
              hallway. It's so boring you wouldn't even notice it if I pointed at it. But it might be the
              best business in the entire scene, and once I tell you why, you're going to start spotting
              businesses like this everywhere you go." Don't reveal Cantaloupe yet — let the reader feel the
              build.

            chapter_sections:
              - heading: "Why the Operator Has the Hardest Job"
                description: >
                  Start at the bottom of the rankings and work up.
                bullet_points:
                  - "The operator is the 'doer' — they're driving a van around all week, hauling cases of soda, fixing jammed machines, and worrying about which buildings might kick them out"
                  - "Five-questions check: crowded field (any small business can buy a machine and try), super easy to copy, bossy customers (the buildings can replace them anytime), bossy suppliers (Mars sets the candy price)"
                  - "There's nothing wrong with being an operator — it's a real job, real income — but as a business, it's a tough seat"
                  - "Most operators don't get rich. They make a steady living and add machines slowly, one at a time, over many years"

              - heading: "Why Mars and Hershey Are Doing Great"
                description: >
                  The candy makers are way higher than the operators, and not for the reason you might guess.
                bullet_points:
                  - "Mars and Hershey aren't really competing on price — they're competing on a feeling people have about their brand, which we'll get into in the next chapter"
                  - "Their suppliers (sugar, cocoa, milk) can push prices around a little, but Mars and Hershey are big enough to push back"
                  - "Their customers (the vending operators) basically have to carry the famous candy bars, because that's what kids actually want. Try filling a vending machine with no-name chocolate. You'll be empty by Friday"
                  - "But: Mars and Hershey compete pretty hard with each other, which keeps them from being the absolute champion"

              - heading: "The Quiet Champion — Cantaloupe"
                description: >
                  The card reader on the front of the machine might be the best business in the entire scene.
                bullet_points:
                  - "Cantaloupe doesn't make candy. Doesn't drive trucks. Doesn't own buildings. They just take about 5 cents on every dollar that goes through their card reader"
                  - "How crowded? Only a few competitors — building a national network of certified card readers is really hard"
                  - "How hard to copy? Very. Cantaloupe is hooked up to over a million machines, and any new competitor would have to convince thousands of operators to switch, one at a time"
                  - "The genius part: Cantaloupe gets paid whether business is up or down. If you buy more, they make more. If prices go up, they automatically make more. They barely have to do anything"

              - heading: "The Big Idea — Owning the Rails"
                description: >
                  Cantaloupe is an example of one of the best positions in all of business.
                bullet_points:
                  - "When everybody in an industry has to use the same company to do something, that company is 'owning the rails' — like the railroad in an old frontier town. Everything had to go through it"
                  - "Examples you know: Visa and Mastercard own the rails for credit cards, Apple and Google own the rails for phone apps, YouTube owns the rails for online videos"
                  - "Once a business owns the rails, everybody else in the scene basically pays them, even if they don't realize it"
                  - "The catch: somebody is always trying to build new rails. Once in a while they succeed — that's how Uber happened to taxis. So rail-owners have to stay sharp"

            conclusion: >
              The card reader is more powerful than the candy bar. The candy bar is more powerful than the
              truck driver. None of this is obvious from looking. The five questions and the iceberg picture
              are how you see what your eyes can't.

            transition: >
              We just put Cantaloupe at the top, but Mars came in surprisingly high too. Why? Not because
              they own the rails — they don't. Something else is going on, and it's so powerful that it
              needs a whole chapter. It's the reason a Snickers bar costs the same as a no-name chocolate
              bar that's basically the same chocolate, but the Snickers always wins.

      - title: "Owning the Rails and Winning the Brand War"
        description: >
          Two short chapters that use the vending scene to teach two of the most important business ideas
          ever: brand power (why being Mars is amazing) and the trap of businesses that look easy to start
          but aren't (why being a vending operator is rough).

        chapters:
          - title: "Mars Bars and 'Real' Bars"
            word_target: 1200
            description: >
              A whole chapter on why being a famous brand is one of the best positions in business. Uses
              Mars and Hershey as the central examples but pulls in Nike, Apple, Coca-Cola, and Lego to
              generalize. The deep idea: a brand is a kind of magic that lets you charge more for the same
              physical thing because of the feeling it creates in the customer's head.

            intro: >
              Open with a specific physical object. Pick up a Snickers bar and look at the back. It says
              "MARS, INCORPORATED, McLean, VA." That bar cost Mars about 30 cents to make. They sell it for
              about $1.50 wholesale (that's what the store pays before selling it to you). A no-name
              chocolate bar with peanuts and caramel costs about the same to make. Same chocolate, same
              peanuts, same caramel. Why does every kid in America always pick the Snickers? It's not
              because you've done a taste test. It's because of something Mars has been quietly building
              for almost 100 years.

            chapter_sections:
              - heading: "What a Brand Actually Is"
                description: >
                  A brand is not a logo. It's a shortcut in your brain.
                bullet_points:
                  - "A brand is the feeling that pops into your head before you've even decided whether you want the thing"
                  - "It's why you'd rather have a Snickers than 'Pete's Chocolate Caramel Bar,' even if Pete's tastes exactly the same"
                  - "Brands take a really long time to build. Coca-Cola has been Coca-Cola since 1886. Snickers has been Snickers since 1930. That's longer than your grandparents have been alive"
                  - "Once a brand is built, it's like a force field. Competitors can copy the recipe. They can't copy the feeling"

              - heading: "Why Brands Are Such a Good Business"
                description: >
                  Run the five questions on Mars and watch every answer come up green.
                bullet_points:
                  - "Crowded field? Sort of — there are lots of candy companies, but only two or three giants, and Mars is one of them"
                  - "Hard to copy? Crazy hard. You can copy a chocolate bar in a week. You can't copy 90 years of memories every kid in America has of eating a Snickers"
                  - "Bossy customers? Not really. When a vending operator stocks a machine, leaving out Snickers would be commercial suicide"
                  - "The clean version: Mars sells about $50 billion of stuff every year. Without owning a single store. Or a single vending machine. Or even a single shelf at the grocery store"

              - heading: "How Brands Get Built"
                description: >
                  Brands are made out of three things: repetition, story, and time.
                bullet_points:
                  - "Repetition: you've seen the Snickers logo and eaten a Snickers more times than you can count. Your brain now expects a Snickers when you're hungry"
                  - "Story: the 'You're not you when you're hungry' commercials gave Snickers a personality and a tagline you can finish before they say it"
                  - "Time: every year a brand survives, it gets a tiny bit more powerful — like a tree adding rings"
                  - "Here's the part nobody warns competitors about: this is exactly why famous brands are so hard to take down. Even when they mess up, the feeling around them is so big that one bad year barely scratches it"

              - heading: "Brands Outside the Candy Aisle"
                description: >
                  The same magic explains a lot of the most valuable companies in the world.
                bullet_points:
                  - "Apple: an iPhone is made of metal and glass that cost about $400 to put together. It sells for $1,200. That $800 difference is mostly the Apple brand"
                  - "Nike: a real Nike sneaker is made in a factory for about $25. It gets sold for $130. The swoosh is doing the heavy lifting"
                  - "Lego: there are tons of off-brand plastic-brick companies. Lego sells for triple the price because — well, because it's Lego"
                  - "Coca-Cola: a can of soda is basically water and sugar. But Coke is the most valuable drink brand on Earth because of what happens in your head when you read the word 'Coke'"

            conclusion: >
              A brand is the closest thing in the business world to a magic spell. It takes forever to cast.
              But once it's working, every customer pays a little extra without quite knowing why, and every
              competitor has to work twice as hard for half the result.

            transition: >
              Brand is one way to a great business. Owning the rails is another. But there's also a flip
              side — positions that look like easy opportunities but are actually traps. The very next
              person in the vending machine scene is the perfect example. Anyone can become a vending
              operator. Most people who try, end up wishing they hadn't. Why?

          - title: "Why Nobody Wants to Be the Vending Operator"
            word_target: 1200
            description: >
              The mirror of the brand chapter — a chapter on the worst position in the vending scene, and
              what it teaches us about businesses that look easy but really aren't. Uses the vending
              operator to introduce three ideas: high startup costs that don't actually protect you,
              expenses that hit every month, and the brutal math of tiny profits on small purchases.

            intro: >
              Open with an honest confession from the author. "When I was about your age, I read an article
              that said you could buy a vending machine for $4,000 and make $200 a month, forever. I thought
              I'd discovered free money. I begged my parents to let me buy one. They said no, and I was mad
              about it for years. I'm now going to explain why my parents were extremely smart."

            chapter_sections:
              - heading: "The 'Easy Money' Pitch"
                description: >
                  Why being a vending machine operator looks amazing on paper.
                bullet_points:
                  - "The pitch: buy a machine for a few thousand dollars, fill it with snacks, watch the money roll in while you sleep. Sometimes people call this 'passive income'"
                  - "There are whole TikTok and YouTube channels selling this fantasy right now. They leave out almost everything that actually matters"
                  - "It's true that a busy machine in a good spot can make $200 to $500 a month. That part isn't a lie"
                  - "The lie is everything that happens between 'I bought a machine' and 'the money rolled in'"

              - heading: "Where the Money Actually Goes"
                description: >
                  Run the five questions and watch the answers go red one by one.
                bullet_points:
                  - "The cost of the candy: about half of every dollar that goes in goes right back to Mars, Hershey, and Frito-Lay"
                  - "The card reader fee: Cantaloupe takes about 5 cents on every dollar"
                  - "The building's cut: the school or office wants 10 to 25 cents on every dollar just to let the machine sit there"
                  - "The gas, the truck, the insurance, the time it takes to drive around — by the time you do the real math, that $200 a month gets a lot smaller"

              - heading: "Why It's a Tough Seat"
                description: >
                  All five questions answered the wrong way.
                bullet_points:
                  - "How crowded? Anyone can do it — there are over 4 million vending machines in the US"
                  - "Hard to copy? Embarrassingly easy — buy a machine, find a spot, you're in business"
                  - "Bossy suppliers? Yes — Mars and Cantaloupe both set their prices and you take what they give you"
                  - "Bossy customers? In a way, yes — every building you put a machine in can kick you out and replace you with a competitor whenever they feel like it"

              - heading: "When This Same Trap Shows Up Somewhere Else"
                description: >
                  The vending operator's situation is a pattern, not a one-off.
                bullet_points:
                  - "Uber drivers — Uber owns the rails (the app), the car maker owns the supplies, and the driver gets what's left"
                  - "Food trucks — anyone can buy one, and the rent at the festival eats most of the profit"
                  - "Most Etsy sellers — Etsy takes a fee, the next seller is one click away, and your customers can shop forever for free"
                  - "Here's the lesson: when a business looks easy to start, that's almost always a warning sign, not a green light"

            conclusion: >
              The world is full of businesses that look like opportunities and are actually traps. The way
              to spot them is the same as the way to spot a great business — just run the five questions
              and pay attention when most of the answers come back bad.

            transition: >
              Two scenes down. We've watched a tree get taken apart and a Reese's get bought, and we've
              picked up the iceberg, the four layers, the five questions, brand magic, and the trap of easy
              starts. Now it's time to travel. The next part of the book takes you to seven more scenes —
              pizza places, movie theaters, airports, gas stations, Little League fields, concerts — and
              asks the same question every time: how many businesses?

  - title: "Part Three: Seven More Scenes"
    description: >
      Seven scene chapters in a row, each one following the same pattern: walk into a place, count the
      businesses, run the five questions, deliver a ranking. Each scene introduces at least one new business
      idea — popcorn-stand math, last-mile delivery, captive customers, loss leaders, network effects,
      and so on. By the end, the reader has applied the framework so many times that doing it feels
      automatic.

    sections:
      - title: "Stuff You Eat and Drink"
        description: >
          Two food scenes with totally different economics underneath them.

        chapters:
          - title: "The Pizza Place on the Corner"
            word_target: 1200
            description: >
              Walk into a local pizza place on a Friday night and unpack every business behind the slice.
              Uses this scene to teach the rough math of the restaurant business: rent, workers, and
              ingredients eat almost everything, and the visible hard-working business has one of the worst
              structures in the book. Also introduces the franchise idea (Domino's, Papa John's) as a way
              to get a slightly better seat at the same table.

            intro: >
              Open with a Friday-night scene in vivid detail. The smell of the dough as you push the door
              open. The little bell that dings overhead. The kid behind the counter spinning a flat circle
              of dough into the air. The line of high schoolers waiting for their slices. Stop the scene
              and ask the same question we always ask: how many businesses just touched the slice you're
              about to eat?

            chapter_sections:
              - heading: "The Pizza Itself"
                description: >
                  Every ingredient is its own industry.
                bullet_points:
                  - "The flour came from a wheat field, got ground up at a flour company, and was delivered by a food company called Sysco — which delivers to almost half the restaurants in America"
                  - "The cheese came from dairy farms through a cheese plant. The price of cheese moves around a lot, and it's usually the single thing a pizzeria owner stresses most about"
                  - "The pepperoni and the canned tomatoes each come from their own giant food chain"
                  - "Even the cardboard box came from a packaging company you've never heard of, and it sometimes costs more than the pepperoni on top of the pizza"

              - heading: "The Place Where the Pizza Lives"
                description: >
                  The store itself is its own little world of businesses.
                bullet_points:
                  - "The ovens, the dough mixers, the prep tables — all bought from restaurant equipment companies for tens of thousands of dollars"
                  - "The building is rented from a landlord, and the rent is usually one of the biggest monthly bills the pizza place has"
                  - "The screen the cashier punches your order into is made by a company called Toast or Square, and that company takes a tiny fee on every order"
                  - "Here's a weird one: the Coca-Cola fridge isn't owned by the pizza place. Coke gives it to them free, as long as they only sell Coke products inside"

              - heading: "The Math That Eats the Owner"
                description: >
                  Why running a pizza shop is so much harder than it looks.
                bullet_points:
                  - "Rough rule: about 30 cents of every dollar goes to ingredients, 50 to 55 cents goes to workers and rent, and the owner gets to keep what's left — usually around 10 cents"
                  - "An average independent pizza shop sells about $440,000 worth of pizza a year, and the owner takes home around $30,000. That's less than the assistant manager at a CVS makes"
                  - "Run the five questions: crowded (yes), easy to copy (yes), bossy suppliers (kind of — cheese prices move a lot), bossy customers (yes — there's another pizza place a block away)"
                  - "Here's the bittersweet part: most independent pizza shops are family businesses, where the whole family is essentially trading their lives for the chance to own something. That's a beautiful thing — but it's not a great business"

              - heading: "The Franchises Found a Loophole"
                description: >
                  Why Domino's and Papa John's get a different answer to the same five questions.
                bullet_points:
                  - "A franchise pays the big parent company a fee (Domino's takes about 5.5 cents on every dollar) for the right to use the brand and recipes"
                  - "The franchisee gets a famous name (people drive to a Domino's on purpose) and a whole system that's been figured out over thousands of stores"
                  - "Here's the part most people miss: Domino's the corporation is a way better business than any single Domino's store. They collect fees from thousands of stores at once and never have to actually make pizza"
                  - "The pattern is going to repeat all over this book: in many industries, the company that owns the brand wins. The people running the actual locations do most of the work"

            conclusion: >
              The visible pizza place — the one with the bell and the dough-spinner — is a tough business
              where one bad month of cheese prices can wreck a year. The invisible Domino's corporation,
              collecting 5.5 cents from every dollar at 6,000 stores at once, is sitting in a way better
              seat. Same building. Same pizza. Totally different game.

            transition: >
              Pizza taught us about ingredient costs and franchises. The next stop teaches us something
              even weirder — a place where the thing they're selling at the door is barely the business at
              all, and the real money is being made on what looks like the snack. Next stop: the movie
              theater.

          - title: "The Movie Theater (Where the Popcorn Is the Business)"
            word_target: 1200
            description: >
              The movie theater scene, with its surprising twist: theaters barely make money on tickets —
              most of that money gets handed back to the movie studios — and the real business is the
              popcorn, soda, and candy at the snack counter. Introduces the idea of a "loss leader":
              something a business sells super cheap to get you in the door so they can sell you something
              else at a giant markup.

            intro: >
              Open with a startling fact, told very plainly. "A movie theater makes more money on a $7
              popcorn than on a $14 movie ticket. Most of your ticket money — sometimes more than half —
              goes straight to the movie studio. So even though it looks like the theater is in the movie
              business, it's actually in the popcorn business. Let me show you."

            chapter_sections:
              - heading: "Where Your Ticket Money Actually Goes"
                description: >
                  The theater is way less in charge of ticket prices than you'd think.
                bullet_points:
                  - "When a brand-new movie comes out, the studio (Disney, Warner Bros, Universal) takes a huge cut of your ticket — sometimes 60 to 70 cents on every dollar"
                  - "The cut shrinks over time. By week six of a movie's run, the theater might keep most of the ticket. The problem? Most blockbusters make almost all their money in week one"
                  - "Movies the studios know are going to be huge (think a new Marvel movie) come with strict rules: the theater has to play it for a set number of weeks, and the studio sets the terms"
                  - "From the theater's point of view, they're basically renting out their seats so the studio can show you their movie"

              - heading: "The Concession Stand Math"
                description: >
                  This is where the real money happens.
                bullet_points:
                  - "A bag of popcorn kernels costs the theater about 40 cents. They sell it as a giant bucket for $7 or $8. That's more than $7 of profit on a $0.40 ingredient"
                  - "Soda is mostly water with a little flavor syrup. The paper cup it comes in costs the theater more than the soda inside"
                  - "The candy in the glass case is the exact same Mars and Hershey stuff from the vending machine, marked up to almost double what you'd pay at a corner store"
                  - "Snacks might be only 30 cents of every dollar the theater earns, but they can be 70 cents of every dollar of profit"

              - heading: "Why They Can Charge $7 for Popcorn"
                description: >
                  This is one of the cleanest examples in the book of customers being stuck.
                bullet_points:
                  - "You're already inside. You bought the ticket, parked the car, and the movie starts in 12 minutes. You're not going to leave for cheaper popcorn"
                  - "The theater knows this. The popcorn buyer knows this. That's the whole game"
                  - "Most theaters won't let you bring outside food in. That's the only thing that would break the trap"
                  - "Grown-ups have a name for this: a 'captive audience.' Once you start looking, you'll see it everywhere — airports, amusement parks, concerts, cruise ships, sports stadiums"

              - heading: "Ranking the Movie-Night Ecosystem"
                description: >
                  Run the businesses through the questions and see who wins.
                bullet_points:
                  - "Bottom: the actual theater (AMC, Regal) — squeezed by the studios, squeezed by rent, and slowly losing customers to streaming"
                  - "Middle: the popcorn and soda suppliers — fine business, but they have lots of competitors"
                  - "High: the studios — they own the rails (the movies themselves) and dictate the terms to every theater in the world"
                  - "Sneaky high: Netflix and Disney+ — they're the substitute that's slowly eating the whole movie theater industry from underneath"

            conclusion: >
              The thing on the big sign outside is not the business. The bucket of popcorn is. Once you see
              this pattern, you'll see it in dozens of other places — the visible thing is the hook, and
              the real business is whatever they sell you after you're hooked.

            transition: >
              The popcorn move at the movie theater is a tiny version of a much bigger pattern: sell
              something cheap to get people in, then make real money on the second sale. The next scene is
              a whole industry built on this trick. But before we get there, we have one more delivery to
              make. Literally. Let's follow your last Amazon package from the moment you tapped 'buy' to
              the moment it landed on your porch.

      - title: "Stuff That Moves"
        description: >
          Three scenes about getting things and people from one place to another. Together, these chapters
          teach the ideas of last-mile delivery, captive customers, and the loss-leader trick.

        chapters:
          - title: "Following Your Amazon Package"
            word_target: 1400
            description: >
              You ordered something from Amazon at 8pm. Two days later, a blue van pulls up and a person
              in a vest hands you a box. This chapter traces every business that touched that package
              between those two moments. Introduces the wild structure of Amazon's "Delivery Service
              Partner" program — thousands of small businesses who deliver only Amazon packages — and the
              deep idea that "last-mile delivery" is one of the hardest, most fascinating problems in
              business.

            intro: >
              Open with the action sequence. You tap "Buy now." Click. Twenty-eight hours later, a blue
              Amazon van rolls slowly down your street. A person in a navy vest hops out, scans your porch
              with a phone, sets down a box, and drives off. You walk outside and pick it up. The whole
              thing on your end took thirty seconds. End scene. Now we're going to rewind it like a movie
              and look at every single business in between that click and that porch.

            chapter_sections:
              - heading: "What Amazon Itself Owns"
                description: >
                  More than you'd think, but less than you'd think.
                bullet_points:
                  - "The website you tapped 'buy' on — Amazon, including the part that figured out what to recommend to you, the search bar that found the item, and the payment system that took your money"
                  - "The giant warehouse where a robot brought your item to a human worker — Amazon. These warehouses are the size of about 20 football fields each"
                  - "The trucks that moved your package between warehouses and then to a regional hub closer to you — mostly Amazon"
                  - "The blue van that drove down your street? Sometimes Amazon. Often not. That's where it gets really interesting"

              - heading: "The Brilliant (and Brutal) DSP Program"
                description: >
                  The blue van company is almost certainly not Amazon itself.
                bullet_points:
                  - "It's almost certainly an Amazon Delivery Service Partner, or DSP — a small business that owns 20 to 40 vans and only delivers Amazon packages"
                  - "There are over 3,000 of these DSPs in the US right now, and together they employ over 275,000 drivers"
                  - "Amazon set up the program brilliantly: the DSPs handle the hardest, most expensive part of delivery (the part near your house) and Amazon doesn't have to hire all those drivers as full-time employees"
                  - "The trade for the DSP owner: the vans are leased through Amazon, the routes come from Amazon's app, the uniforms say Amazon. They're 'independent' on paper. In real life, Amazon is their entire customer"

              - heading: "The Last Mile Is the Whole Problem"
                description: >
                  Why getting a box across town is harder than getting it across the country.
                bullet_points:
                  - "About one out of every three dollars spent on shipping a package gets spent in the last few miles. People in the industry call this 'the last-mile problem'"
                  - "Long-distance trucking is actually pretty easy — one driver, one truck, one trip. Last-mile means hundreds of stops a day, ringing doorbells, dealing with apartment buildings, dogs, locked gates, and lost addresses"
                  - "An Amazon DSP driver does 250 to 300 deliveries in a single shift. That's one stop every two minutes, for ten hours straight"
                  - "Amazon, FedEx, UPS, and the US Postal Service all fight over the last mile. The post office used to do it cheapest because they were already going to every address anyway"

              - heading: "Ranking the Amazon Delivery Scene"
                description: >
                  The five questions paint a really clear picture.
                bullet_points:
                  - "Top: Amazon itself — they own the rails (the website), the brand (Prime), the data, and the relationship with you"
                  - "Middle: the truck and van makers (Rivian, Mercedes, Ford) — solid businesses, but they have to compete with each other, and Amazon is so big it can squeeze them on price"
                  - "Lower middle: UPS, FedEx, and the post office — losing more share every year as Amazon delivers more of its own packages"
                  - "Tough seat: the DSP owner — a real business with real employees, but completely dependent on one customer who can change the rules whenever they want. That sounds like a great deal until it isn't"

            conclusion: >
              Amazon designed an entire industry where they sit at the top and thousands of small businesses
              do the hardest work. It's not evil — those DSPs are real businesses with real owners — but
              it's a perfect example of who ends up with the best seat in the room when one company is big
              enough to redesign the whole table.

            transition: >
              Amazon, Cantaloupe, Mars — they're all examples of the same big idea. When you're huge, you
              can set things up so smaller businesses depend on you more than you depend on them. Now I
              want to take you somewhere that's almost the opposite — a place where customers are literally
              trapped inside a building they can't leave, and the businesses inside take total advantage of
              it. The airport.

          - title: "The Airport"
            word_target: 1200
            description: >
              The airport scene — a small city where the customer is trapped after security. Introduces the
              idea of captive customers at industrial scale (bringing back the popcorn pattern), the power
              of owning the real estate everyone else has to rent, and "slot scarcity" (why airlines fight
              so hard for gates at busy airports). Surfaces the surprising idea that the airport itself —
              or rather, the people who own the airport — might be the best business in the whole place.

            intro: >
              Open with a metaphor that paints the size. JFK Airport in New York sees about 60 million
              people walk through it every year. That's more visitors than the entire population of half
              the states in America combined. An airport isn't a building. It's a city. It has its own
              roads, its own police, its own restaurants, its own shops, and its own rules.

            chapter_sections:
              - heading: "Why Airport Food Costs What It Costs"
                description: >
                  The popcorn pattern at industrial scale.
                bullet_points:
                  - "A burger that's $9 outside the airport is $19 inside the airport. And you'll buy it, because you can't leave"
                  - "The restaurants pay outrageous rent for the right to have customers who can't go anywhere else. They pass that rent on through prices"
                  - "One giant company called HMSHost runs hundreds of these airport restaurants. They've basically figured out how to make money off trapped travelers"
                  - "Here's something kind of unfair: airports often have rules saying restaurants are supposed to charge 'street prices' — the same prices they'd charge outside the airport. Those rules get broken all the time, because nobody enforces them and nobody can leave to compare"

              - heading: "The Airlines Are Having a Worse Time Than You'd Think"
                description: >
                  This will probably surprise you — airlines are famously a tough business.
                bullet_points:
                  - "Airlines have enormous costs (a single passenger plane costs over $100 million), workers in unions, fuel prices that swing wildly, and customers who pick by price"
                  - "Warren Buffett — one of the most famous and successful investors of all time — has called airlines one of the worst businesses ever invented. Too many competitors, no power over prices, brutally expensive equipment"
                  - "Run the five questions: bossy suppliers (only Boeing and Airbus make big planes), bossy customers (you'll switch airlines for $20), substitutes (video calls instead of flying for business), and they all fight each other constantly"
                  - "The big logo on the plane's tail is the most visible business in the whole airport. It's also one of the toughest"

              - heading: "Who's Quietly Winning at the Airport"
                description: >
                  Same as always: not who you'd guess.
                bullet_points:
                  - "The airport itself (the people who own the building) wins because they can't be replaced. Everybody else has to pay them rent"
                  - "Companies like CLEAR and Global Entry — small slices of the experience that pretty much everyone going through the airport thinks about at least once"
                  - "Credit card companies and airline lounges — American Express pays the airline for lounge access, charges you $695 a year to be eligible, and makes you feel fancy"
                  - "The airline you actually flew on? Way down the list. They did the visible work, and they probably broke even on your ticket"

            conclusion: >
              An airport is a landlord pretending to be a transportation hub. The thing you'll remember
              from your trip (the flight, the airline) is one of the worst-positioned businesses in the
              entire building. The thing nobody thinks about (the building itself, and whoever owns it) is
              the structural champion.

            transition: >
              We've now seen the captive-customer trick at the movie theater and the airport. There's one
              more place this trick shows up that you've almost certainly been to dozens of times, and it
              has a totally different trick layered on top — the loss leader. Time to walk into the gas
              station.

          - title: "The Gas Station — and Why Nobody Makes Money on Gas"
            word_target: 1200
            description: >
              The gas station scene as the cleanest possible example of the loss-leader move. The "main
              product" — gasoline — gets sold at almost no profit, and exists mostly to get people inside,
              where the actual business (the convenience store) is happening. Introduces the loss-leader
              idea formally, and connects it to other examples kids know: video game consoles sold below
              cost, cheap printers sold to sell expensive ink, low base airline tickets that pile on fees.

            intro: >
              Open with a scene at the pump. The little click as the handle locks in. You're stuck there
              for two minutes. Out of habit, you wander into the store. You come out with a Slurpee, a bag
              of chips, and a Gatorade. You just spent more on the snacks than the entire fill-up. Tell
              the reader: this was not an accident. The whole place is designed for exactly this to happen.
              The gas was bait.

            chapter_sections:
              - heading: "Gas Station Math"
                description: >
                  Selling gas is actually a pretty terrible business.
                bullet_points:
                  - "The price of gas is mostly set by the world oil market. Gas stations have almost no control over what they pay for gas or what they can charge you"
                  - "The actual money they keep on gas is something like 5 to 15 cents per gallon. After the credit card fee, sometimes it's basically nothing"
                  - "The big oil company names on the signs (Exxon, Shell, BP) usually don't even own those gas stations. They're owned by separate small business owners who pay a fee to use the name"
                  - "If a gas station only sold gas, it would barely break even. Some would actually lose money"

              - heading: "Where the Real Business Is"
                description: >
                  Inside the doors, the math completely flips.
                bullet_points:
                  - "Coffee, bottled drinks, snacks, taquitos, lottery tickets — these have profit margins of 50 to 70 cents on every dollar"
                  - "A bottle of water that the station paid 30 cents for sells to you for $2.50. That's almost $2.20 of pure profit on one bottle of water"
                  - "Inside-the-store sales are usually a smaller part of total money, but they're most of the actual profit"
                  - "This is exactly the popcorn move from the movie theater, but on every street corner in America"

              - heading: "What a Loss Leader Actually Is"
                description: >
                  Once you spot this pattern, you'll see it everywhere.
                bullet_points:
                  - "A 'loss leader' is something a business sells super cheap (sometimes for less than it cost them) just to get you in the door, where they can sell you something else for a lot more"
                  - "Game console example: a PlayStation 5 is sold for about what it cost to make. Sony loses a little money on every console. They make it back on every $70 game"
                  - "Printer example: a cheap printer ($60) plus expensive ink cartridges ($80 a pop). The real business is the ink. The printer just locks you in"
                  - "Airline example: the cheap base ticket gets you to commit. Then they charge you $35 for a checked bag, $25 for a seat, and $9 for a snack"

              - heading: "Ranking the Gas Station"
                description: >
                  Same drill as always.
                bullet_points:
                  - "The oil supplier (Exxon, Shell): tough business set by global prices, but enormous scale — they make their money on giant quantity"
                  - "The franchise owner (the actual station owner): real, hard-working business. Their main job is squeezing more profit out of what's inside the store"
                  - "The snack distributor: the company that delivers all those bottles and bags (Core-Mark, McLane) — boring, big, structurally fine"
                  - "The credit card companies: same as always — taking a tiny piece of every single transaction, in the background, forever"

            conclusion: >
              The thing on the giant sign out front (gas, $3.79) is the bait. The thing in the cooler is
              the business. Once you can see this, you'll start spotting every place that's pulling the
              same move on you, and there are a lot of them.

            transition: >
              We've spent a lot of time looking at things people buy. Now I want to spend two chapters on
              things people do — the activities that bring people together. The first one's the place
              where you spend a lot of your weekends. The second one's basically the most fun anybody will
              ever have. Welcome to the Little League field.

      - title: "Stuff You Do for Fun"
        description: >
          Two activity scenes — a Little League game and a concert — that turn out to have very different
          ecosystems inside them.

        chapters:
          - title: "Saturday at the Little League Field"
            word_target: 1200
            description: >
              The youth sports scene, with its often-invisible economic engine. Introduces the businesses
              behind the uniforms (Rawlings, Wilson, Easton), the equipment, the tournament organizers, the
              umpires, the field-maintenance companies, and — at the very top — Dick's Sporting Goods,
              sitting at the cash register every spring as the unavoidable gateway to youth baseball gear.

            intro: >
              Open with a sensory scene at the field. The smell of cut grass. The chain-link fence behind
              home plate. The parents in folding chairs. The metallic ping of an aluminum bat connecting
              with a ball. The kid in the blue uniform sliding into second base. The umpire calling him
              safe. Pause the action. Ask: how many businesses just touched this single play?

            chapter_sections:
              - heading: "The Gear"
                description: >
                  Every kid on the field is wearing or holding stuff from a small handful of giant brands.
                bullet_points:
                  - "The bats are almost always Easton, DeMarini (owned by Wilson now), Louisville Slugger, or Marucci. Five brands cover almost the whole sport"
                  - "The gloves are almost always Rawlings or Wilson. Two brands have run the glove business for almost 100 years, and a real glove costs $80 to $300"
                  - "The cleats and protective gear come from Under Armour, Nike, Easton — the same handful of brands"
                  - "Every single one of those companies is using classic brand power: parents will pay $250 for a Rawlings glove that's basically the same leather as a $90 no-name glove"

              - heading: "The League and the Field"
                description: >
                  Behind the kids on the field is a whole network of organizations and small businesses.
                bullet_points:
                  - "The local league (Little League, Pony League) is usually a non-profit run by parent volunteers — but they have a real budget with real expenses"
                  - "The field is owned by the town, but the mowing, lining, and dirt work is usually contracted out to small landscaping companies"
                  - "Tournaments are increasingly run by for-profit companies (Perfect Game, USSSA) that charge teams $400 to $1,500 just to enter for a weekend"
                  - "Umpires are independent — paid $50 to $100 a game — and there's a whole tiny industry making umpire gear (Ump-Attire, Force3)"

              - heading: "The Snack Bar"
                description: >
                  Every Little League field has one, and it's a tiny, perfect example of business."
                bullet_points:
                  - "The snack bar is usually run by parent volunteers and is the league's main fundraiser — gummy worms, hot dogs, blue Gatorade, sunflower seeds"
                  - "The profit margins are huge — the food usually costs about 30 cents of every dollar, and the snack bar keeps the rest"
                  - "It's a perfect tiny version of every business in this book: cheap supplies, captive customers (kids and parents stuck there for three hours), almost no competition"
                  - "Here's the funny part: if the snack bar at your local Little League field were a real grown-up company you could buy stock in, it would actually score really high on the five questions"

              - heading: "Where the Real Money Is — Travel Ball"
                description: >
                  The Little League you can see is actually the smaller version of a way bigger industry next door.
                bullet_points:
                  - "Travel sports for kids is now a multi-billion-dollar industry. Some families spend $5,000 to $15,000 a year on a single kid playing one sport"
                  - "Travel teams pay coaches, rent fields, buy team uniforms, pay for tournaments, and travel to events. There are now whole businesses serving just these teams"
                  - "Brands love travel ball because they can sponsor a team, dress them in custom uniforms, and turn 12-year-olds into walking advertisements"
                  - "Here's something not many parents notice: Little League is the front door to a much bigger funnel that the gear companies and tournament businesses built very on purpose"

            conclusion: >
              The kid in the uniform sliding into second base is the visible piece. Behind him is an
              entire industry that didn't even exist 50 years ago and now moves billions of dollars a year,
              mostly funded by parents who really, really want their kid to be good at this.

            transition: >
              Little League taught us how a 'just for fun' activity becomes a giant economy when you look
              at it carefully. The next scene is the most extreme version of this in American life. It
              involves a single ticket, two giant companies you've probably never thought about, and a
              $58 fee that nobody can ever quite explain. Welcome to the concert.

          - title: "The Concert"
            word_target: 1400
            description: >
              The concert scene, with the Live Nation / Ticketmaster combo as the centerpiece. Walks
              through how a single concert ticket gets divided up: the artist, the promoter (often Live
              Nation), the venue (often also owned by Live Nation), the ticket platform (Ticketmaster,
              also owned by Live Nation), the merch sellers, the drink vendors, and so on. Teaches the
              idea of a network effect (everybody has to use Ticketmaster because everybody else uses
              Ticketmaster) and connects it back to the rail-owner pattern from the vending machine.

            intro: >
              Open with a specific receipt. The ticket says $89. You paid $147 at checkout. Where did
              that other $58 go? "Service fee, $24. Convenience fee, $9. Order processing fee, $4.
              Facility charge, $12. Other, $9." Tell the reader: today we're going to follow that $58.
              We're going to discover one of the most dominant companies in the United States, hiding in
              plain sight on every concert ticket in America.

            chapter_sections:
              - heading: "Live Nation Owns Almost Everything"
                description: >
                  One of the cleanest 'rail-owner' stories in modern business.
                bullet_points:
                  - "Live Nation Entertainment owns Ticketmaster (the ticketing website), Live Nation (the company that promotes the concerts), and many of the biggest concert venues in the country"
                  - "When you buy a concert ticket, the company that ran the website, the company that promoted the show, and the company that owns the building are very often the same company"
                  - "If you're a musician trying to do a big tour in America, it's almost impossible to avoid working with Live Nation in some way"
                  - "The US government has been investigating them on and off for over ten years. They keep growing anyway"

              - heading: "Where the $58 Actually Goes"
                description: >
                  Slice up the fees and the ticket and watch the money flow.
                bullet_points:
                  - "Most of the base ticket price goes to the artist and the concert promoter — the artist's cut depends on their deal but can be 70 to 90 cents on every dollar"
                  - "The 'service fee' and 'convenience fee' mostly go to Ticketmaster and the venue. Sometimes those fees exist on purpose, so the ticket can advertise a low number and pile on the real cost at checkout"
                  - "The 'facility charge' goes to the venue — sometimes to fix the building, sometimes just into the pile"
                  - "The credit card company takes a tiny slice of every single dollar. Same as it ever was"

              - heading: "Why Ticketmaster Wins (Even Though Everybody Hates It)"
                description: >
                  This is one of the best examples of a "two-sided network" you'll ever see.
                bullet_points:
                  - "Artists use Ticketmaster because that's where the fans are. Fans use Ticketmaster because that's where the artists are. Neither side can leave on their own"
                  - "When somebody tries to start a new ticket company, they have to get enough artists AND enough fans to switch at the same time. It's almost impossible"
                  - "This trap-by-popularity is called a 'network effect' — the more people on one side use it, the more useful it gets for the other side, and the harder it is to compete with"
                  - "Other examples you know: phones (no point being on a network nobody else is on), Instagram (only fun because everyone's on it), Visa (works everywhere because it works everywhere)"

              - heading: "Ranking the Concert"
                description: >
                  The five questions cut clean lines.
                bullet_points:
                  - "Top: Live Nation and Ticketmaster — they own multiple rails AND have a network effect protecting them"
                  - "High: superstar artists — if you're Taylor Swift or Beyoncé, the fan demand is so big that even Live Nation has to negotiate with you instead of dictating"
                  - "Middle: the venue (if it's independent) — has captive customers, but can be swapped out for another venue"
                  - "Lower: the merch and drink vendors — they have captive customers helping them, but the venue takes a big cut, the breweries set the prices, and the visible vendors don't keep most of the money"

            conclusion: >
              The most important business at any concert isn't the artist on stage. It's the company that
              sold you the ticket, runs the building, and got the artist there in the first place. The
              spotlight is pointing the wrong direction. The money is in the wires.

            transition: >
              We've done seven scenes, and a clear pattern is showing up across all of them. The same kinds
              of businesses keep winning. The same kinds keep losing. From cutting trees to selling
              vending snacks to slinging pizza to popping popcorn to delivering Amazon boxes to leasing
              airport gates to pumping gas to hosting tournaments to selling concert tickets. It's time to
              stop and look at the pattern itself. What do all the winners have in common?

  - title: "Part Four: How to See It Everywhere"
    description: >
      Three short closing chapters. The first one pulls together the patterns we saw across all the scenes
      — what structurally makes a business a winner. The second introduces the idea of "moats" — long-lasting
      advantages that turn a good business into a fortress. The third is a direct challenge to the reader
      to start playing this game on their own, every place they go.

    sections:
      - title: "What We've Learned and What to Do With It"
        description: >
          A wrap-up trio: synthesis, deepening, and a real challenge.

        chapters:
          - title: "What Made the Best Businesses Best"
            word_target: 1400
            description: >
              The pattern-recognition chapter. Look back at every scene we've done — tree crew, vending
              machine, pizza, theater, package, airport, gas station, Little League, concert — and notice
              that the same kinds of businesses kept landing at the top. Brand. Rails. Captive customers.
              Recurring revenue. Network effects. Pull these into a clear short list and give the reader
              the vocabulary to spot them anywhere.

            intro: >
              Open with a pattern-recognition framing. "If you went back through all nine scenes we just
              walked through and made a list of who finished at the top of each ranking, you'd notice
              something weird. The winners aren't all the same company. But they're all the same kind of
              company. Once you see the kinds, you start seeing them everywhere."

            chapter_sections:
              - heading: "Pattern One — The Brand Was Built Long Ago"
                description: >
                  In every scene, a famous brand was near the top.
                bullet_points:
                  - "Mars in the vending machine. Rawlings in Little League. Apple wherever phones come up. Coca-Cola in the gas station fridge. Disney in the movie theater"
                  - "Brands take decades to build, but they pay off forever. Every year of being a famous brand stacks on the last one"
                  - "Here's a secret most kids never get told: brands target kids on purpose, because the feelings you build about a brand as a kid often stick with you your entire life. That's why Lego, Nintendo, and Lucky Charms work so hard to be in your life right now"
                  - "If you ever own a great brand someday, protect it like a castle. One bad year of bad decisions can chip away at decades of work"

              - heading: "Pattern Two — They Owned the Rails"
                description: >
                  Cantaloupe, Visa, Live Nation, Amazon — same trick, different industries.
                bullet_points:
                  - "The rail-owner is the company everyone else in an industry has to go through to reach their actual customers"
                  - "Rail-owners take a small piece of huge volume. Tiny slices of giant numbers turn out to be one of the best ways to get rich slowly"
                  - "Network effects often protect rail-owners — the more people use them, the more impossible they are to replace"
                  - "When you're sizing up a new business, asking 'do they own the rails?' might be the single highest-value question to ask"

              - heading: "Pattern Three — Customers Couldn't Easily Walk Away"
                description: >
                  The captive-customer pattern showed up over and over.
                bullet_points:
                  - "Movie theater popcorn. Airport burgers. Gas station Slurpees. Concert beers. All priced for people who can't leave"
                  - "Some customer trapping is physical (you're inside the building). Some is by contract (you signed a 2-year cell phone deal). Some is just laziness (nobody changes banks)"
                  - "Businesses with trapped customers can charge more for the same thing, and that's a permanent edge"
                  - "Here's the trick grown-ups use: when a business says 'lifetime customer value' or 'subscription,' they're talking, very politely, about getting you trapped"

              - heading: "Pattern Four — They Got Paid Even When Nothing Happened"
                description: >
                  The "every month no matter what" pattern is its own quiet miracle.
                bullet_points:
                  - "Insurance companies get paid every month forever, whether anything goes wrong or not"
                  - "Vermeer sells the chipper once, but they sell new parts and repairs to that customer for the next fifteen years"
                  - "Software like Microsoft Office gets paid every month even when you don't open it"
                  - "Compare to the tree-cutting company, which has to find a brand new customer every time the phone rings. That's the opposite — it's exhausting"

            conclusion: >
              Brand. Rails. Trapped customers. Money every month no matter what. These four patterns
              explain most of what makes a business great. You don't have to memorize them. But the next
              time you walk into a place, just ask which of these (if any) the business has, and you'll
              know almost right away how good a seat they're sitting in.

            transition: >
              These four patterns are powerful on their own. But there's a bigger idea waiting right
              behind them — an idea that ties all four together and explains why some businesses last for
              hundreds of years while others vanish in eighteen months. It's an old word. You already know
              what it means, even if you've never heard it used this way. The word is moat.

          - title: "Moats — When a Business Becomes a Fortress"
            word_target: 1400
            description: >
              The "moat" idea — made famous by Warren Buffett and now standard in business — explained at
              kid level. A moat is whatever protects a business from competitors trying to attack it. The
              four patterns from the last chapter are basically the four kinds of moats. This chapter
              teaches the reader to spot a moat at a glance and to understand why a wide moat can keep a
              business standing for a hundred years while businesses without one die in months.

            intro: >
              Open with a literal castle. Picture a real medieval castle — stone walls, towers, a moat
              full of water around it. The castle is the business. The walls are the things the business
              is good at (its product, its people, its brand). The moat is what keeps competitors from
              being able to charge across and attack. A castle without a moat will get raided no matter
              how thick the walls are. A castle with a wide enough moat barely needs walls at all. Tell
              the reader: every great business is a castle, and the moat is the part nobody is looking at.

            chapter_sections:
              - heading: "Moat Type One — The Brand Moat"
                description: >
                  Some brands are surrounded by so much love and history that competitors just can't get close.
                bullet_points:
                  - "Coca-Cola has spent more than $4 billion on advertising every year for decades. Nobody can recreate what the word 'Coke' means in your head"
                  - "Lego can be copied — and is, by lots of off-brand brick companies — but parents pay double for Lego because of the brand moat"
                  - "Disney has so much brand power around its characters that it could probably charge you to look at Mickey Mouse and you'd consider it"
                  - "Brand moats take 30 years or more to build, but they can last 100. They're slow, but enormous when they work"

              - heading: "Moat Type Two — The 'Too Annoying to Switch' Moat"
                description: >
                  Some businesses are protected because changing to a competitor is just too much work.
                bullet_points:
                  - "Banks: hardly anybody switches banks, because moving everything is a nightmare. That's why banks barely have to compete on being good"
                  - "Phone numbers and email addresses: even when better phones came out, nobody wanted to give up their old email address, so they kept paying the same companies forever"
                  - "Big software at work (think Excel or the program your school uses): once everyone is trained on it, switching means retraining everybody. So nobody does"
                  - "The cleaner version: nobody hates their bank enough to actually leave, and the bank knows it"

              - heading: "Moat Type Three — The Network Moat"
                description: >
                  Some businesses get more valuable the more people use them.
                bullet_points:
                  - "Visa and Mastercard: every store takes them because everyone has them, and everyone has them because every store takes them. A perfect loop"
                  - "Instagram and TikTok: only fun because everyone you know is on them, which is exactly why nobody can build a competitor"
                  - "Ticketmaster: artists go where the fans are, fans go where the tickets are. Both sides are locked in together"
                  - "Here's the catch: you can't attack a network moat by being a tiny bit better. You basically have to be ten times better AND be willing to lose money for years to pull both sides over at once"

              - heading: "Moat Type Four — The Cost Moat"
                description: >
                  Some businesses can just do the thing cheaper than anyone else.
                bullet_points:
                  - "Walmart can buy stuff from suppliers at prices nobody else can get, because Walmart is so big. That's a real moat"
                  - "Amazon's warehouses and shipping system can move a package for less money than any new competitor could. That's the moat protecting their delivery business"
                  - "Costco buys in such giant quantities that nobody can match what they pay per pickle jar"
                  - "Cost moats are real, but they're also the easiest moat to lose. The moment another company catches up on size, the moat dries up"

            conclusion: >
              Brand. Hard to switch. Networks. Cost. Those are the four big moats. Every great business
              has at least one. Many have several. The greatest businesses in the world — Apple, Visa,
              Coca-Cola, Amazon — have multiple moats stacked on top of each other, which is why they
              keep winning year after year while their competitors come and go.

            transition: >
              You now have everything you need. The five questions. The four layers. The four patterns.
              The four moats. The next chapter is the shortest one in the whole book, and it's not really
              a chapter so much as a challenge. The whole point of this book has been to teach you how to
              do something. Now you do it.

          - title: "Try It Yourself"
            word_target: 1000
            description: >
              The closing chapter. Short, energetic, and a direct challenge to the reader. The book has
              given them all the tools. Now they have to use them. The chapter walks through one final
              hypothetical scene the reader picks themselves, gives them a checklist for any new place
              they go, and ends with a push: this is how to see the world like a person who really
              understands business, and once you have it, you have it forever.

            intro: >
              Open with a direct address to the reader. "Okay. Now it's your turn. Pick somewhere you're
              going to be this weekend — anywhere. A hockey rink, a bookstore, a barbershop, a McDonald's,
              an animal shelter, a Costco, a museum, the orthodontist. Anywhere there's stuff happening.
              I want you to walk in and play the same game we've been playing, and I'm going to give you a
              cheat sheet for how."

            chapter_sections:
              - heading: "Step One — Spot the Doer"
                description: >
                  Always start where your eyes naturally land first.
                bullet_points:
                  - "Walk in, look around, and pick out the most visible business — the cashier, the dentist, the chef, whoever is doing the obvious work"
                  - "Notice that everyone else in the room is paying attention to this same person, and remember that the visible business is rarely the best one"
                  - "Don't skip the doer — they're real, they work hard, and understanding them matters. Just don't stop there"
                  - "The doer is the entrance, not the answer"

              - heading: "Step Two — Find the Other Three Layers"
                description: >
                  Once you've found the doer, the iceberg trick kicks in.
                bullet_points:
                  - "Suppliers: every single object you can see (chairs, machines, screens, clothing) came from somebody, and that somebody is a business"
                  - "Helpers: every visible business is paying somebody for insurance, software, accounting, and ads — those are businesses too"
                  - "Leftovers: what does this place produce that gets thrown away or recycled or sold off? Whoever buys that is also a business"
                  - "If you can't find a layer, you're not looking hard enough. Every scene has all four"

              - heading: "Step Three — Run the Five Questions"
                description: >
                  This is the part you'll practice the most.
                bullet_points:
                  - "How crowded is the field? (Many competitors = bad. Few = good.)"
                  - "How hard is it to copy? (Easy = bad. Hard = good.)"
                  - "Are the suppliers bossy? (Yes = bad. No = good.)"
                  - "Are the customers bossy? (Yes = bad. No = good.)"
                  - "Could a totally different thing replace it? (Yes = scary. No = safe.)"

              - heading: "Step Four — Look for Moats"
                description: >
                  The advanced move. Once you've ranked the businesses, ask why the winners are winning.
                bullet_points:
                  - "Is there a famous brand here? (Coke, Apple, Nike, Disney, Lego)"
                  - "Are customers stuck because switching would be too annoying? (banks, phone plans, school software)"
                  - "Is there a network where more people make it more valuable? (Visa, Instagram, Ticketmaster)"
                  - "Is somebody just bigger and cheaper than anyone else? (Walmart, Amazon, Costco)"
                  - "If you find a moat, you've found one of the best businesses in the room"

              - heading: "The Whole Point"
                description: >
                  Why doing this matters, beyond just being a fun game.
                bullet_points:
                  - "Most grown-ups walk through every place they ever go and only see the doer — the one obvious business at the front of the room"
                  - "You now have a way of seeing the whole iceberg, and that's a permanent upgrade. Once you see it, you can't un-see it"
                  - "Whether you grow up to start a business, work at one, invest in one, or just walk through them, you'll be a way more interesting person to talk to about how the world actually works"
                  - "The grown-up version of this game is what people on Wall Street get paid millions of dollars to play. You're playing it for free, in your own neighborhood, while you're 11"

            conclusion: >
              The world is way more crowded with businesses than it looks. Some are way better than
              others. And you can tell which is which from a few feet away if you know where to look.
              That's the whole book. Go find some scenes.

            transition: >
              There's no next chapter. This is the end. But that's the point — the next chapter is
              whatever you walk into tomorrow. Pay attention. Count the businesses. Run the five
              questions. Look for moats. And every once in a while, when you're standing in line for a
              slice of pizza or staring at a vending machine in a school hallway, smile to yourself —
              because you'll know exactly what's really going on, and almost nobody else does.
